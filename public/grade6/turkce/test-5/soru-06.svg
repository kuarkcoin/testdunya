<svg xmlns="http://www.w3.org/2000/svg" width="360" height="700" viewBox="0 0 360 700"><title>Bulunan ve aranan eşyalar için işlem yönergesi</title><rect width="360" height="700" rx="16" fill="#eff6ff"/><g font-family="Arial, sans-serif"><text x="180" y="42" text-anchor="middle" font-size="28" font-weight="bold" fill="#18324d">KAYIP EŞYA NOKTASI</text><rect x="14" y="65" width="332" height="165" rx="12" fill="#fef3c7"/><rect x="14" y="254" width="332" height="205" rx="12" fill="#dbeafe"/><rect x="14" y="484" width="332" height="190" rx="12" fill="#dcfce7"/><text x="180" y="104" text-anchor="middle" font-size="26" font-weight="bold" fill="#18324d">BİR EŞYA BULDUN</text><text x="180" y="151" text-anchor="middle" font-size="26" font-weight="normal" fill="#18324d">Görevliye teslim et.</text><text x="180" y="195" text-anchor="middle" font-size="26" font-weight="normal" fill="#18324d">Sahibi kontrol edilsin.</text><text x="180" y="294" text-anchor="middle" font-size="26" font-weight="bold" fill="#18324d">EŞYANI ARIYORSUN</text><text x="180" y="337" text-anchor="middle" font-size="26" font-weight="normal" fill="#18324d">Görevliye başvur.</text><text x="180" y="381" text-anchor="middle" font-size="26" font-weight="normal" fill="#18324d">Eşyanın özelliklerini</text><text x="180" y="420" text-anchor="middle" font-size="26" font-weight="normal" fill="#18324d">anlat.</text><text x="180" y="525" text-anchor="middle" font-size="26" font-weight="bold" fill="#18324d">GÖREVLİ</text><text x="180" y="568" text-anchor="middle" font-size="26" font-weight="normal" fill="#18324d">Bilgileri karşılaştırır.</text><text x="180" y="611" text-anchor="middle" font-size="26" font-weight="normal" fill="#18324d">Eşleşme varsa eşyayı</text><text x="180" y="650" text-anchor="middle" font-size="26" font-weight="normal" fill="#18324d">sahibine teslim eder.</text></g></svg>