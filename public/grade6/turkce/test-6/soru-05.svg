<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650"><title>Ödünç kitap ve kitap bağışı duyuruları</title><rect width="360" height="650" rx="18" fill="#eff6ff"/><g font-family="Arial, sans-serif" fill="#19334d"><text x="180" y="40" font-size="28" text-anchor="middle" font-weight="700">İKİ DUYURU</text><rect x="16" y="65" width="328" height="245" rx="14" fill="#fef3c7"/><text x="180" y="108" font-size="28" text-anchor="middle" font-weight="700">ÖDÜNÇ AL</text><path d="M130 140 L180 151 L230 140 L230 195 L180 206 L130 195 Z" fill="#fde68a" stroke="#19334d" stroke-width="3"/><path d="M180 151 L180 206" stroke="#19334d" stroke-width="3"/><text x="180" y="245" font-size="26" text-anchor="middle" font-weight="400">Kitabını seç.</text><text x="180" y="282" font-size="26" text-anchor="middle" font-weight="400">7 gün içinde geri getir.</text><rect x="16" y="330" width="328" height="285" rx="14" fill="#dcfce7"/><text x="180" y="375" font-size="28" text-anchor="middle" font-weight="700">BAĞIŞLA</text><rect x="135" y="405" width="90" height="65" rx="4" fill="#a7f3d0" stroke="#19334d" stroke-width="3"/><path d="M145 405 V470 M160 427 H211 M160 444 H202" stroke="#19334d" stroke-width="3"/><text x="180" y="510" font-size="26" text-anchor="middle" font-weight="400">Getirdiğin kitap</text><text x="180" y="548" font-size="26" text-anchor="middle" font-weight="400">okul kitaplığına</text><text x="180" y="586" font-size="26" text-anchor="middle" font-weight="400">eklensin.</text></g></svg>