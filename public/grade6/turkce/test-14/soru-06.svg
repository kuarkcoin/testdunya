<svg xmlns="http://www.w3.org/2000/svg" width="360" height="850" viewBox="0 0 360 850" role="img"><title>Planlanan ve gerçekleşen söyleşi akışı</title><desc>Plan dört aşamalıdır. Gerçekleşen akışta anlatım ikiye ayrılır; arada sorular yer alır.</desc><rect width="360" height="850" rx="16" fill="#f8fafc"/><text x="180" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#16324f">SÖYLEŞİNİN AKIŞI</text><text x="180" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#16324f">PLAN</text><rect x="30" y="103" width="300" height="45" rx="8" fill="#dbeafe"/><text x="180" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#16324f">1. Tanışma</text><rect x="30" y="159" width="300" height="45" rx="8" fill="#dbeafe"/><text x="180" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#16324f">2. Anlatım</text><rect x="30" y="215" width="300" height="45" rx="8" fill="#dbeafe"/><text x="180" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#16324f">3. Sorular</text><rect x="30" y="271" width="300" height="45" rx="8" fill="#dbeafe"/><text x="180" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#16324f">4. Kapanış</text><text x="180" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#16324f">GERÇEKLEŞEN</text><rect x="30" y="391" width="300" height="54" rx="8" fill="#ccfbf1"/><text x="180" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#16324f">1. Tanışma</text><rect x="30" y="462" width="300" height="78" rx="8" fill="#ccfbf1"/><text x="180" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#16324f">2. Anlatım:</text><text x="180" y="526" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#16324f">ilk kısım</text><rect x="30" y="557" width="300" height="54" rx="8" fill="#ccfbf1"/><text x="180" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#16324f">3. Sorular</text><rect x="30" y="628" width="300" height="78" rx="8" fill="#ccfbf1"/><text x="180" y="661" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#16324f">4. Anlatım:</text><text x="180" y="692" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#16324f">devamı</text><rect x="30" y="723" width="300" height="54" rx="8" fill="#ccfbf1"/><text x="180" y="756" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#16324f">5. Kapanış</text></svg>