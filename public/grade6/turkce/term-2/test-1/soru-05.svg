<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img"><title>Etkinlik önerileri: şekil grafiği ve duyuru taslağı</title><rect width="360" height="760" rx="20" fill="#f8fafc"/><text x="20" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">ÖNERİ PANOSU</text><text x="20" y="80" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#0f172a">24 öğrenci en az</text><text x="20" y="116" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#0f172a">bir etkinliği seçti.</text><rect x="12" y="140" width="336" height="370" rx="14" fill="#ffffff" stroke="#94a3b8"/><text x="24" y="180" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Yalnız kitap takası</text><circle cx="40" cy="216" r="15" fill="#2563eb"/><circle cx="88" cy="216" r="15" fill="#2563eb"/><circle cx="136" cy="216" r="15" fill="#2563eb"/><circle cx="184" cy="216" r="15" fill="#2563eb"/><circle cx="232" cy="216" r="15" fill="#2563eb"/><circle cx="280" cy="216" r="15" fill="#2563eb"/><text x="24" y="290" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">İki etkinlik de</text><circle cx="40" cy="326" r="15" fill="#2563eb"/><circle cx="88" cy="326" r="15" fill="#2563eb"/><circle cx="136" cy="326" r="15" fill="#2563eb"/><circle cx="184" cy="326" r="15" fill="#2563eb"/><text x="24" y="400" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Yalnız oyun günü</text><circle cx="40" cy="436" r="15" fill="#2563eb"/><circle cx="88" cy="436" r="15" fill="#2563eb"/><circle cx="36" cy="482" r="12" fill="#2563eb"/><text x="61" y="491" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#0f172a">= 2 öğrenci</text><rect x="12" y="530" width="336" height="205" rx="14" fill="#fef3c7" stroke="#94a3b8"/><text x="24" y="570" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">DUYURU TASLAĞI</text><text x="24" y="615" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#0f172a">“Okuldaki herkes</text><text x="24" y="655" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#0f172a">yalnız kitap takası</text><text x="24" y="695" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#0f172a">istiyor.”</text></svg>