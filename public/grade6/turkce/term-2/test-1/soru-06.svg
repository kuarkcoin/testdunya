<svg xmlns="http://www.w3.org/2000/svg" width="360" height="590" viewBox="0 0 360 590" role="img"><title>Gezi kartı ve mesaj taslağı</title><rect width="360" height="590" rx="20" fill="#f8fafc"/><rect x="12" y="16" width="336" height="169" rx="14" fill="#e0f2fe" stroke="#94a3b8"/><text x="26" y="52" fill="#0f172a" font-family="Arial, sans-serif" font-size="27" font-weight="700">GEZİ KARTI</text><text x="26" y="92" fill="#0f172a" font-family="Arial, sans-serif" font-size="26">10.00 Bahçe incelemesi</text><text x="26" y="130" fill="#0f172a" font-family="Arial, sans-serif" font-size="26">Yağmur yağarsa yerine</text><text x="26" y="168" fill="#0f172a" font-family="Arial, sans-serif" font-size="26">seramik atölyesi yapılır.</text><rect x="12" y="199" width="336" height="169" rx="14" fill="#ffffff" stroke="#94a3b8"/><text x="26" y="235" fill="#0f172a" font-family="Arial, sans-serif" font-size="27" font-weight="700">MÜZE GEZİSİ</text><text x="26" y="275" fill="#0f172a" font-family="Arial, sans-serif" font-size="26">13.00 Müze gezisi</text><text x="26" y="313" fill="#0f172a" font-family="Arial, sans-serif" font-size="26">Veli izin belgesi</text><text x="26" y="351" fill="#0f172a" font-family="Arial, sans-serif" font-size="26">zorunludur.</text><rect x="12" y="382" width="336" height="169" rx="14" fill="#fef3c7" stroke="#94a3b8"/><text x="26" y="418" fill="#0f172a" font-family="Arial, sans-serif" font-size="27" font-weight="700">MESAJ TASLAĞI</text><text x="26" y="458" fill="#0f172a" font-family="Arial, sans-serif" font-size="26">“Yağmurda gezi iptal,</text><text x="26" y="496" fill="#0f172a" font-family="Arial, sans-serif" font-size="26">izin belgesine</text><text x="26" y="534" fill="#0f172a" font-family="Arial, sans-serif" font-size="26">gerek yok.”</text></svg>