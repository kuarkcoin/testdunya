<svg xmlns="http://www.w3.org/2000/svg" width="360" height="440" viewBox="0 0 360 440" role="img"><title>Türkçe Test 3 soru 6</title><desc>İki sınıfın okuduğu kitap sayısını gösteren tablo. İlk ay: 6/A 12, 6/B 10. Sonraki ay: 6/A 18, 6/B 10. Afiş başlığı: Her sınıf daha çok kitap okudu.</desc><rect width="360" height="440" rx="20" fill="#f0f9ff"/><g font-family="DejaVu Sans, sans-serif" font-size="26" fill="#17324d"><text x="180" y="44" text-anchor="middle" font-weight="bold">AFİŞ BAŞLIĞI</text><text x="180" y="87" text-anchor="middle">Her sınıf daha çok</text><text x="180" y="122" text-anchor="middle">kitap okudu.</text><text x="180" y="177" text-anchor="middle" font-weight="bold">Okunan kitap sayısı</text><rect x="15" y="198" width="330" height="206" fill="white" stroke="#334155" stroke-width="2"/><path d="M15 274H345 M15 339H345 M113 198V404 M226 198V404" stroke="#64748b" stroke-width="2"/><text x="64" y="245" text-anchor="middle">Sınıf</text><text x="169" y="245" text-anchor="middle">İlk ay</text><text x="286" y="230" text-anchor="middle">Sonraki</text><text x="286" y="262" text-anchor="middle">ay</text><text x="64" y="317" text-anchor="middle">6/A</text><text x="169" y="317" text-anchor="middle">12</text><text x="286" y="317" text-anchor="middle">18</text><text x="64" y="382" text-anchor="middle">6/B</text><text x="169" y="382" text-anchor="middle">10</text><text x="286" y="382" text-anchor="middle">10</text></g></svg>