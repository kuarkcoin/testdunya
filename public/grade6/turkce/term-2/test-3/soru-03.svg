<svg xmlns="http://www.w3.org/2000/svg" width="360" height="440" viewBox="0 0 360 440" role="img"><title>Tohum sergisi duyurusu</title><desc>Tohum sergisi duyurusu: Getireceğin paketin ağzı kapalı olsun, üzerine tohumun adını yaz. Cuma günü sınıfta.</desc><rect width="360" height="440" rx="20" fill="#f0fdf4"/><g font-family="DejaVu Sans, sans-serif" font-size="26" fill="#173d2c"><rect x="18" y="18" width="324" height="404" rx="14" fill="white" stroke="#16834b" stroke-width="3"/><text x="180" y="62" text-anchor="middle" font-weight="bold">TOHUM SERGİSİ</text><path d="M180 155V118 M180 134 Q140 132 146 100 Q181 100 180 134 M180 123 Q215 121 216 91 Q181 92 180 123" fill="#86efac" stroke="#16834b" stroke-width="3"/><text x="38" y="204">Getireceğin paketin</text><text x="38" y="241">ağzı kapalı olsun.</text><text x="38" y="291">Üzerine tohumun</text><text x="38" y="328">adını yaz.</text><text x="180" y="389" text-anchor="middle" font-weight="bold">Cuma günü sınıfta</text></g></svg>