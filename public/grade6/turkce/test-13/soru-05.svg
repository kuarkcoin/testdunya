<svg xmlns="http://www.w3.org/2000/svg" width="360" height="730" viewBox="0 0 360 730" role="img" ><title>KİTAP DEĞİŞİM KÖŞESİ</title><desc>Kitap getirmesen de köşeden bir kitap alabilirsin. Kitabın temiz ve eksiksiz olmalı. Aldığın kitabı köşeye geri getir. Yeni okurlara da sıra gelsin!</desc><rect width="360" height="730" rx="16" fill="#f1f5f9"/><g font-family="Arial, sans-serif" fill="#0f172a" text-anchor="middle"><text x="180" y="38" font-size="27" font-weight="700">KİTAP DEĞİŞİM KÖŞESİ</text><rect x="12" y="65" width="336" height="169" rx="12" fill="white" stroke="#64748b"/><text x="180" y="100" font-size="27" font-weight="700">KİTAP ALIRKEN</text><text x="180" y="140" font-size="26">Kitap getirmesen de</text><text x="180" y="177" font-size="26">köşeden bir kitap</text><text x="180" y="214" font-size="26">alabilirsin.</text><rect x="12" y="259" width="336" height="132" rx="12" fill="white" stroke="#64748b"/><text x="180" y="294" font-size="27" font-weight="700">KİTAP BIRAKIRKEN</text><text x="180" y="334" font-size="26">Kitabın temiz ve</text><text x="180" y="371" font-size="26">eksiksiz olmalı.</text><rect x="12" y="416" width="336" height="132" rx="12" fill="white" stroke="#64748b"/><text x="180" y="451" font-size="27" font-weight="700">OKUDUKTAN SONRA</text><text x="180" y="491" font-size="26">Aldığın kitabı</text><text x="180" y="528" font-size="26">köşeye geri getir.</text><text x="180" y="583" font-size="26">Yeni okurlara da</text><text x="180" y="619" font-size="26">sıra gelsin!</text></g></svg>