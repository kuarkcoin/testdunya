<svg xmlns="http://www.w3.org/2000/svg" width="360" height="810" viewBox="0 0 360 810" role="img" ><title>METNİ DÜZENLİYORUM</title><desc>Her örnek düşünceyi destekliyor mu? Gereksiz olanı çıkar. Bilgiler birbiriyle çelişiyor mu? Çelişkiyi düzelt. Harfleri ve ekleri kontrol et. Yanlışları düzelt. Sırayı izle. Bir aşamadaki sorunlar bitmeden geçme.</desc><rect width="360" height="810" rx="16" fill="#f1f5f9"/><g font-family="Arial, sans-serif" fill="#0f172a" text-anchor="middle"><text x="180" y="38" font-size="27" font-weight="700">METNİ DÜZENLİYORUM</text><rect x="12" y="65" width="336" height="169" rx="12" fill="white" stroke="#64748b"/><text x="180" y="100" font-size="27" font-weight="700">1. KATKI</text><text x="180" y="140" font-size="26">Her örnek düşünceyi</text><text x="180" y="177" font-size="26">destekliyor mu?</text><text x="180" y="214" font-size="26">Gereksiz olanı çıkar.</text><rect x="12" y="259" width="336" height="169" rx="12" fill="white" stroke="#64748b"/><text x="180" y="294" font-size="27" font-weight="700">2. TUTARLILIK</text><text x="180" y="334" font-size="26">Bilgiler birbiriyle</text><text x="180" y="371" font-size="26">çelişiyor mu?</text><text x="180" y="408" font-size="26">Çelişkiyi düzelt.</text><rect x="12" y="453" width="336" height="169" rx="12" fill="white" stroke="#64748b"/><text x="180" y="488" font-size="27" font-weight="700">3. YAZIM</text><text x="180" y="528" font-size="26">Harfleri ve ekleri</text><text x="180" y="565" font-size="26">kontrol et.</text><text x="180" y="602" font-size="26">Yanlışları düzelt.</text><text x="180" y="657" font-size="26">Sırayı izle. Bir aşamadaki</text><text x="180" y="693" font-size="26">sorunlar bitmeden geçme.</text></g></svg>