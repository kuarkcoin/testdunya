<svg xmlns="http://www.w3.org/2000/svg" width="360" height="810" viewBox="0 0 360 810" role="img"><title>Bir yapı, üç belge</title><desc>Bir yapı, üç belge</desc><rect width="360" height="810" rx="16" fill="#eff6ff"/><g fill="#17324d" font-family="Arial, sans-serif"><text x="180" y="40" text-anchor="middle" font-size="28" font-weight="bold">BİR YAPI, ÜÇ BELGE</text><rect x="16" y="65" width="328" height="195" rx="12" fill="#fef3c7"/><text x="180" y="105" text-anchor="middle" font-size="32" font-weight="bold">1920</text><text x="180" y="145" text-anchor="middle" font-size="26" font-weight="bold">FOTOĞRAF NOTU</text><text x="180" y="190" text-anchor="middle" font-size="27" font-weight="normal">Bu yapı okul olarak</text><text x="180" y="225" text-anchor="middle" font-size="27" font-weight="normal">kullanılıyor.</text><rect x="16" y="280" width="328" height="195" rx="12" fill="#dbeafe"/><text x="180" y="320" text-anchor="middle" font-size="32" font-weight="bold">1950</text><text x="180" y="360" text-anchor="middle" font-size="26" font-weight="bold">BELEDİYE KAYDI</text><text x="180" y="405" text-anchor="middle" font-size="27" font-weight="normal">Bu yapı kütüphane</text><text x="180" y="440" text-anchor="middle" font-size="27" font-weight="normal">olarak kullanılıyor.</text><rect x="16" y="495" width="328" height="195" rx="12" fill="#dcfce7"/><text x="180" y="535" text-anchor="middle" font-size="32" font-weight="bold">2020</text><text x="180" y="575" text-anchor="middle" font-size="26" font-weight="bold">AÇILIŞ DUYURUSU</text><text x="180" y="620" text-anchor="middle" font-size="27" font-weight="normal">Yapımız bugün müze</text><text x="180" y="655" text-anchor="middle" font-size="27" font-weight="normal">olarak açılmıştır.</text><text x="180" y="735" text-anchor="middle" font-size="26" font-weight="normal">Belgeler yalnız kendi</text><text x="180" y="772" text-anchor="middle" font-size="26" font-weight="normal">tarihlerini gösterir.</text></g></svg>