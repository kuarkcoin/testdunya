<svg xmlns="http://www.w3.org/2000/svg" width="360" height="930" viewBox="0 0 360 930"><title>Fotoğraf yayımlama koşulları</title><rect width="360" height="930" rx="18" fill="#eff6ff"/><text x="180" y="40" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#183b56">FOTOĞRAF KURALLARI</text><rect x="16" y="65" width="328" height="135" rx="14" fill="#fef3c7"/><text x="180" y="104" text-anchor="middle" font-family="Arial" font-size="26" fill="#183b56" font-weight="bold">HER FOTOĞRAF</text><text x="180" y="143" text-anchor="middle" font-family="Arial" font-size="26" fill="#183b56">Çekim yeri ve tarihi</text><text x="180" y="182" text-anchor="middle" font-family="Arial" font-size="26" fill="#183b56">yazılmalı.</text><rect x="16" y="220" width="328" height="285" rx="14" fill="#dbeafe"/><text x="180" y="259" text-anchor="middle" font-family="Arial" font-size="26" fill="#183b56" font-weight="bold">FOTOĞRAF KİMİN?</text><text x="180" y="298" text-anchor="middle" font-family="Arial" font-size="26" fill="#183b56">Başkasınınsa:</text><text x="180" y="337" text-anchor="middle" font-family="Arial" font-size="26" fill="#183b56">Sahibinin adı ve</text><text x="180" y="376" text-anchor="middle" font-family="Arial" font-size="26" fill="#183b56">kullanım izni gerekir.</text><text x="180" y="415" text-anchor="middle" font-family="Arial" font-size="26" fill="#183b56">Kendininse:</text><text x="180" y="454" text-anchor="middle" font-family="Arial" font-size="26" fill="#183b56">Kullanım izni aranmaz.</text><rect x="16" y="525" width="328" height="285" rx="14" fill="#dcfce7"/><text x="180" y="564" text-anchor="middle" font-family="Arial" font-size="26" fill="#183b56" font-weight="bold">GÖRÜNEN KİŞİLER</text><text x="180" y="603" text-anchor="middle" font-family="Arial" font-size="26" fill="#183b56">Yüzü tanınan kişi varsa</text><text x="180" y="642" text-anchor="middle" font-family="Arial" font-size="26" fill="#183b56">onun izni de gerekir.</text><text x="180" y="681" text-anchor="middle" font-family="Arial" font-size="26" fill="#183b56">Yüzü tanınan kişi yoksa</text><text x="180" y="720" text-anchor="middle" font-family="Arial" font-size="26" fill="#183b56">bu izin aranmaz.</text><text x="180" y="858" text-anchor="middle" font-family="Arial" font-size="26" fill="#183b56">İki izin birbirinin</text><text x="180" y="894" text-anchor="middle" font-family="Arial" font-size="26" fill="#183b56">yerine geçmez.</text></svg>