<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650"><title>Okul dergisinin hazırlanma planı</title><rect width="360" height="650" rx="18" fill="#eff6ff"/><g font-family="Arial, sans-serif" fill="#19334d"><text x="180" y="42" font-size="28" text-anchor="middle" font-weight="700">OKUL DERGİSİ</text><rect x="16" y="68" width="328" height="124" rx="14" fill="#fef3c7"/><text x="180" y="100" font-size="26" text-anchor="middle" font-weight="700">PAZARTESİ</text><text x="180" y="137" font-size="26" text-anchor="middle" font-weight="400">Ece</text><text x="180" y="173" font-size="26" text-anchor="middle" font-weight="400">Yazıları toplar.</text><rect x="16" y="208" width="328" height="124" rx="14" fill="#dbeafe"/><text x="180" y="240" font-size="26" text-anchor="middle" font-weight="700">SALI</text><text x="180" y="277" font-size="26" text-anchor="middle" font-weight="400">Can</text><text x="180" y="313" font-size="26" text-anchor="middle" font-weight="400">Çizimleri hazırlar.</text><rect x="16" y="348" width="328" height="124" rx="14" fill="#dcfce7"/><text x="180" y="380" font-size="26" text-anchor="middle" font-weight="700">ÇARŞAMBA</text><text x="180" y="417" font-size="26" text-anchor="middle" font-weight="400">Ece ve Can</text><text x="180" y="453" font-size="26" text-anchor="middle" font-weight="400">Sayfaları düzenler.</text><rect x="16" y="488" width="328" height="124" rx="14" fill="#fce7f3"/><text x="180" y="520" font-size="26" text-anchor="middle" font-weight="700">PERŞEMBE</text><text x="180" y="573" font-size="26" text-anchor="middle" font-weight="400">Dergi basılır.</text></g></svg>