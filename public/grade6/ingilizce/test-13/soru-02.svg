<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000"><title>English Test 13 Question 2</title><rect width="360" height="1000" fill="#f8fafc"/><text x="180" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">EVA&#x27;S BREAKFAST</text><rect x="12" y="55" width="336" height="205" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="180" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">Usually: eggs</text><text x="180" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">Today: cheese instead</text><text x="180" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">and toast, please.</text><text x="180" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">Tea is fine.</text><text x="180" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">No milk in my tea!</text><rect x="12" y="280" width="336" height="158" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="35" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">A</text><ellipse cx="70" cy="345" rx="25" ry="16" fill="white" stroke="#64748b"/><circle cx="70" cy="345" r="8" fill="#facc15" stroke="#475569" stroke-width="2"/><rect x="148" y="325" width="44" height="38" rx="10" fill="#d6a86c" stroke="#92400e" stroke-width="2"/><rect x="270" y="325" width="30" height="27" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="2"/><path d="M300 330 q18 0 12 14 q-2 5 -12 4" fill="none" stroke="#92400e" stroke-width="3"/><text x="180" y="392" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">Eggs + toast</text><text x="180" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">Tea — no milk</text><rect x="12" y="455" width="336" height="158