30" height="38" rx="8" fill="#c084fc" stroke="#334155" stroke-width="2"/><line x1="62" y1="329" x2="56" y2="353" stroke="#334155" stroke-width="4"/><line x1="78" y1="329" x2="84" y2="353" stroke="#334155" stroke-width="4"/><rect x="115" y="275" width="225" height="80" rx="8" fill="#fff7ed" stroke="#334155" stroke-width="2"/><text x="228" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">“I feel scared</text><text x="228" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">up there.”</text><text x="180" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">“I don’t want to ride</text><text x="180" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">the Ferris wheel.”</text></svg>