<svg xmlns="http://www.w3.org/2000/svg" width="360" height="475" viewBox="0 0 360 475"><title>A ride entrance with a height rule</title><rect width="360" height="475" rx="16" fill="#f0f9ff"/><text x="180" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#172554">ROLLER COASTER</text><path d="M 40 180 Q 120 40 190 155 T 320 115" fill="none" stroke="#7c3aed" stroke-width="8"/><line x1="80" y1="135" x2="80" y2="215" stroke="#334155" stroke-width="4"/><line x1="270" y1="155" x2="270" y2="215" stroke="#334155" stroke-width="4"/><rect x="132" y="100" width="70" height="30" rx="8" fill="#f97316" stroke="#334155" stroke-width="2"/><circle cx="150" cy="132" r="8" fill="#172554" stroke="#334155" stroke-width="3"/><circle cx="185" cy="132" r="8" fill="#172554" stroke="#334155" stroke-width="3"/><rect x="30" y="240" width="300" height="100" rx="8" fill="#fef3c7" stroke="#334155" stroke-width="2"/><text x="180" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">You must be</text><text x="180" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">at least 140 cm.</text><circle cx="60" cy="370" r="14" fill="#fed7aa" stroke="#334155" stroke-width="3"/><rect x="45" y="386" width="30" height="38" rx="8" fill="#38bdf8" stroke="#334155" stroke-width="2"/><line x1="52" y1="424" x2="46" y2="448" stroke="#334155" stroke-width="4"/><line x1="68" y1="424" x2="74" y2="448" stroke="#334155" stroke-width="4"/><text x="228" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Tom: 135 cm</text><text x="228" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Lily: 145 cm</text></svg>