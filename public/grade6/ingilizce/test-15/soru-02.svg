<svg xmlns="http://www.w3.org/2000/svg" width="360" height="900" viewBox="0 0 360 900" role="img"><title>WHOSE BREAKFAST?</title><rect x="0" y="0" width="360" height="900" rx="8" fill="#f8fafc" stroke="#f8fafc" stroke-width="2"/><text x="180" y="40" font-family="Arial,sans-serif" font-size="28" fill="#172554" text-anchor="middle">WHOSE BREAKFAST?</text><rect x="20" y="90" width="320" height="190" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="180" y="125" font-family="Arial,sans-serif" font-size="27" fill="#172554" text-anchor="middle">TRAY 1</text><polygon points="53,187 95,187 87,155" fill="#fde047" stroke="#ca8a04"/><circle cx="75" cy="175" r="3" fill="#eab308" stroke="#475569" stroke-width="2"/><rect x="150" y="150" width="40" height="35" rx="7" fill="#d6a469" stroke="#92400e" stroke-width="2"/><rect x="250" y="158" width="33" height="25" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/><circle cx="290" cy="170" r="9" fill="none" stroke="#92400e" stroke-width="2"/><text x="180" y="235" font-family="Arial,sans-serif" font-size="27" fill="#172554" text-anchor="middle">Cheese + toast</text><text x="180" y="268" font-family="Arial,sans-serif" font-size="26" fill="#172554" text-anchor="middle">Tea</text><rect x="20" y="310" width="320" height="190" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="180" y="345" font-family="Arial,sans-serif" font-size="27" fill="#172554" text-anchor="middle">TRAY 2</text><ellipse cx="75" cy="393" rx="24" ry="16" fill="white" stroke="#64748b"/><circle cx="75" cy="393" r="8" fill="#facc15" stroke="#475569" stroke-width="2"/><rect x="150" y="370" width="40" height="35" rx="7" fill="#d6a469" stroke="#92400e" stroke-width="2"/><rect x="258" y="368" width="24" height="40" rx="0" fill="white" stroke="#38bdf8" stroke-width="2"/><rect x="258" y="368" width="24" height="10" rx="0" fill="#bfdbfe" stroke="#38bdf8" stroke-width="2"/><text x="180" y="455" font-family="Arial,sans-serif" font-size="27" fill="#172554" text-anchor="middle">Eggs + toast</text><text x="180" y="488" font-family="Arial,sans-serif" font-size="26" fill="#172554" text-anchor="middle">Milk</text><rect x="15" y="540" width="330" height="140" rx="8" fill="#fef3c7" stroke="#3b82f6" stroke-width="2"/><text x="180" y="575" font-family="Arial,sans-serif" font-size="27" fill="#172554" text-anchor="middle">ECE</text><text x="180" y="620" font-family="Arial,sans-serif" font-size="27" fill="#172554" text-anchor="middle">Both drinks are fine.</text><text x="180" y="658" font-family="Arial,sans-serif" font-size="27" fill="#172554" text-anchor="middle">No eggs for me.</text><rect x="15" y="705" width="330" height="150" rx="8" fill="#dcfce7" stroke="#3b82f6" stroke-width="2"/><text x="180" y="742" font-family="Arial,sans-serif" font-size="27" fill="#172554" text-anchor="middle">ARDA</text><text x="180" y="788" font-family="Arial,sans-serif" font-size="27" fill="#172554" text-anchor="middle">Eggs or cheese is fine.</text><text x="180" y="828" font-family="Arial,sans-serif" font-size="27" fill="#172554" text-anchor="middle">No tea for me.</text></svg>