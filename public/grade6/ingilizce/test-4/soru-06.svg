<svg xmlns="http://www.w3.org/2000/svg" width="360" height="470" viewBox="0 0 360 470"><title>Ella at home</title><desc>A storm cloud with lightning outside and Ella with a frightened expression. Ella explicitly says thunder scares her.</desc><rect width="360" height="470" rx="18" fill="#edf5fa"/><text x="180" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">Ella at home</text><rect x="14" y="62" width="332" height="245" rx="16" fill="#fff" stroke="#bbcedb" stroke-width="2"/><g fill="#a6bdce" stroke="#183b50" stroke-width="3"><path d="M 58 158 C 34 150 44 118 70 121 C 72 85 123 85 130 120 C 165 117 165 158 140 158 Z"/></g><polygon points="100,160 80,192 97,192 88,221 125,179 107,179 119,160" fill="#ffce4a" stroke="#a86600" stroke-width="2"/><path d="M 24 270 H 335" stroke="#bbcedb" stroke-width="3"/><circle cx="270" cy="205" r="42" fill="#ffdbb7" stroke="#183b50" stroke-width="3"/><circle cx="256" cy="197" r="4" fill="#183b50"/><circle cx="284" cy="197" r="4" fill="#183b50"/><ellipse cx="270" cy="224" rx="10" ry="13" fill="#183b50"/><text x="180" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">“The thunder is loud.</text><text x="180" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">I feel scared.</text><text x="180" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">Please stay with me.”</text></svg>
