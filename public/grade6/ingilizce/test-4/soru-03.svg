<svg xmlns="http://www.w3.org/2000/svg" width="360" height="490" viewBox="0 0 360 490"><title>Two friends today</title><desc>Leo smiles and says he loves snow. Mia looks sad and misses the sun; no picnic today.</desc><rect width="360" height="490" rx="18" fill="#edf5fa"/><text x="180" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">Two friends today</text><rect x="14" y="60" width="332" height="198" rx="16" fill="#fff" stroke="#bbcedb" stroke-width="2"/><text x="180" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">Leo</text><circle cx="75" cy="157" r="42" fill="#ffdbb7" stroke="#183b50" stroke-width="3"/><circle cx="61" cy="149" r="4" fill="#183b50"/><circle cx="89" cy="149" r="4" fill="#183b50"/><path d="M 56 167 Q 75 192 94 167" fill="none" stroke="#183b50" stroke-width="4"/><text x="231" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">“Snow!</text><text x="231" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">I love it!”</text><text x="180" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">Snowman time!</text><rect x="14" y="271" width="332" height="198" rx="16" fill="#fff" stroke="#bbcedb" stroke-width="2"/><text x="180" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">Mia</text><circle cx="75" cy="368" r="42" fill="#ffdbb7" stroke="#183b50" stroke-width="3"/><circle cx="61" cy="360" r="4" fill="#183b50"/><circle cx="89" cy="360" r="4" fill="#183b50"/><path d="M 56 393 Q 75 370 94 393" fill="none" stroke="#183b50" stroke-width="4"/><text x="231" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">“I miss</text><text x="231" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">the sun.”</text><text x="180" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">No picnic today.</text></svg>
