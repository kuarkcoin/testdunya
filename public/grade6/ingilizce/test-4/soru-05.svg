<svg xmlns="http://www.w3.org/2000/svg" width="360" height="450" viewBox="0 0 360 450"><title>Saturday trip</title><desc>Mountain forecast: snow and minus2°C. The trip is outdoors all morning.</desc><rect width="360" height="450" rx="18" fill="#edf5fa"/><text x="180" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">Saturday trip</text><rect x="14" y="65" width="332" height="260" rx="16" fill="#fff" stroke="#bbcedb" stroke-width="2"/><text x="180" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">Mountain forecast</text><g fill="#a6bdce" stroke="#183b50" stroke-width="3"><path d="M 138 201 C 114 193 124 161 150 164 C 152 128 203 128 210 163 C 245 160 245 201 220 201 Z"/></g><line x1="152" y1="214" x2="152" y2="232" stroke="#1676b6" stroke-width="3"/><line x1="144" y1="218" x2="160" y2="228" stroke="#1676b6" stroke-width="3"/><line x1="144" y1="228" x2="160" y2="218" stroke="#1676b6" stroke-width="3"/><line x1="180" y1="214" x2="180" y2="232" stroke="#1676b6" stroke-width="3"/><line x1="172" y1="218" x2="188" y2="228" stroke="#1676b6" stroke-width="3"/><line x1="172" y1="228" x2="188" y2="218" stroke="#1676b6" stroke-width="3"/><line x1="208" y1="214" x2="208" y2="232" stroke="#1676b6" stroke-width="3"/><line x1="200" y1="218" x2="216" y2="228" stroke="#1676b6" stroke-width="3"/><line x1="200" y1="228" x2="216" y2="218" stroke="#1676b6" stroke-width="3"/><text x="180" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">−2°C</text><text x="180" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">Outside all morning</text><text x="180" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">Pack for the weather.</text></svg>
