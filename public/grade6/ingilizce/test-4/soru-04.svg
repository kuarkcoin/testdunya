<svg xmlns="http://www.w3.org/2000/svg" width="360" height="450" viewBox="0 0 360 450"><title>At the park</title><desc>A child flies a kite; wind lines show moving air. The child says the air is moving.</desc><rect width="360" height="450" rx="18" fill="#edf5fa"/><text x="180" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">At the park</text><rect x="20" y="62" width="320" height="290" rx="18" fill="#dff0f8"/><path d="M 35 100 H 132 Q 165 100 157 78 M 42 127 H 174 Q 198 127 193 111 M 35 151 H 119" fill="none" stroke="#42839f" stroke-width="5"/><polygon points="246,80 290,123 247,175 215,121" fill="#ee855f" stroke="#183b50" stroke-width="3"/><path d="M 247 175 Q 230 234 145 265" fill="none" stroke="#183b50" stroke-width="3"/><circle cx="111" cy="230" r="20" fill="#ffdbb7" stroke="#183b50" stroke-width="3"/><path d="M 111 251 V 302 M 111 266 L 146 263 M 111 266 L 82 283 M 111 302 L 88 335 M 111 302 L 135 335" stroke="#183b50" stroke-width="7" fill="none"/><path d="M 20 342 H 340" stroke="#5d9560" stroke-width="8"/><text x="180" y="391" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">“My kite is flying!</text><text x="180" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#183b50">The air is moving.”</text></svg>
