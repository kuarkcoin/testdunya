ial,sans-serif" font-size="27" fill="#172554" text-anchor="middle">ADA</text><text x="180" y="457" font-family="Arial,sans-serif" font-size="27" fill="#172554" text-anchor="middle">No eggs, please.</text><text x="180" y="500" font-family="Arial,sans-serif" font-size="27" fill="#172554" text-anchor="middle">Tea or milk is fine.</text><rect x="15" y="595" width="330" height="200" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="180" y="635" font-family="Arial,sans-serif" font-size="27" fill="#172554" text-anchor="middle">BEN</text><text x="180" y="680" font-family="Arial,sans-serif" font-size="27" fill="#172554" text-anchor="middle">No cheese, please.</text><text x="180" y="725" font-family="Arial,sans-serif" font-size="27" fill="#172554" text-anchor="middle">No milk for me.</text><text x="180" y="850" font-family="Arial,sans-serif" font-size="27" fill="#172554" text-anchor="middle">Different foods</text><text x="180" y="890" font-family="Arial,sans-serif" font-size="27" fill="#172554" text-anchor="middle">The same drink</text></svg>