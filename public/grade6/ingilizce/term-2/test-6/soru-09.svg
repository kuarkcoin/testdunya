<svg xmlns="http://www.w3.org/2000/svg" width="360" height="995" viewBox="0 0 360 995" role="img">
<title>The three parts of Tom’s story and Lena’s reading diary</title>
<desc>An illustrated story sequence has three connected stages. Part 1, Tuesday: Tom says, “I found a map in the forest,” with a map drawing. Part 2, next day: “I sailed to an island,” with a boat. Part 3, next day: “I came home,” with a house. Arrows connect Parts 1, 2 and 3. Lena’s diary, dated 6 May, says: “I read one part a day for three days, in order. Yesterday: Part 3 at home. Part 1: at school.”</desc>
<rect width="360" height="995" rx="18" fill="#f1f6fc"/>
<g font-family="Arial, sans-serif">
