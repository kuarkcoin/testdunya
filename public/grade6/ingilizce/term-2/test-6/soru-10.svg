<svg xmlns="http://www.w3.org/2000/svg" width="360" height="845" viewBox="0 0 360 845" role="img">
<title>The trip and the washing place</title>
<desc>The route has three stops in this order. 1 BEACH: Ada drinks; Ben does not drink; no washing. 2 PARK: both drink; washing here. 3 FOREST: both drink; no washing. Arrows show the order of the stops.</desc>
<rect width="360" height="845" rx="18" fill="#f1f6fc"/>
<g font-family="Arial, sans-serif">
<text x="180" y="43" text-anchor="middle" font-size="27" fill="#142c46" font-weight="600">THE ECO-CLUB TRIP</text><rect x="20" y="67" width="320" height="225" rx="14" fill="#fff" stroke="#a7bbd0" stroke-width="2"/><text x="180" y="106" text-anchor="middle" font-size="29" fill="#142c46" font-weight="600">1  BEACH</text><rect x="20" y="333" width="320" height="225" rx="14" fill="#fff" stroke="#a7bbd0" stroke-width="2"/><text x="180" y="372" text-anchor="middle" font-size="29" fill="#142c46" font-weight="600">2  PARK</text><rect x="20" y="599" width="320" height="225" rx="14" fill="#fff" stroke="#a7bbd0" stroke-width="2"/><text x="180" y="638" text-anchor="middle" font-size="29" fill="#142c46" font-weight="600">3  FOREST</text><text x="180" y="151" text-anchor="middle" font-size="28" fill="#142c46" font-weight="600">Ada drinks.</text><text x="180" y="194" text-anchor="middle" font-size="27" fill="#142c46" font-weight="600">Ben does not drink.</text><text x="180" y="260" text-anchor="middle" font-size="26" fill="#944448" font-weight="600">NO WASHING</text><line x1="180" y1="300" x2="180" y2="322" stroke="#2563a6" stroke-width="5" stroke-linecap="round"/><path d="M 168 313 L 180 327 L 192 313" fill="none" stroke="#2563a6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="180" y="417" text-anchor="middle" font-size="28" fill="#142c46" font-weight="600">Both drink.</text><text x="180" y="523" text-anchor="middle" font-size="26" fill="#23674f" font-weight="600">WASHING HERE</text><line x1="180" y1="566" x2="180" y2="588" stroke="#2563a6" stroke-width="5" stroke-linecap="round"/><path d="M 168 579 L 180 593 L 192 579" fill="none" stroke="#2563a6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="180" y="683" text-anchor="middle" font-size="28" fill="#142c46" font-weight="600">Both drink.</text><text x="180" y="792" text-anchor="middle" font-size="26" fill="#944448" font-weight="600">NO WASHING</text><path d="M 123 473 L 123 449 L 194 449 L 194 469" fill="none" stroke="#759bad" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/><line x1="150" y1="439" x2="171" y2="439" stroke="#496e82" stroke-width="6" stroke-linecap="round"/><line x1="160" y1="440" x2="160" y2="449" stroke="#496e82" stroke-width="4" stroke-linecap="round"/><path d="M 195 479 Q 183 492 195 497 Q 207 492 195 479 Z" fill="#68bfe2" stroke="#3a8aaa" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M 150 747 L 177 701 L 205 747 Z" fill="#75aa70" stroke="#477445" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="177" y1="746" x2="177" y2="763" stroke="#86623f" stroke-width="7" stroke-linecap="round"/>
</g>
</svg>
