<svg xmlns="http://www.w3.org/2000/svg" width="360" height="2118" viewBox="0 0 360 2118" role="img"><title>Ece’s library visit last Friday</title><desc>Last Friday Ece’s homework asked: Who wrote The Blue Key? Where did Nora find her brother? In the library, Ece reads an open encyclopaedia with the entry: Ada Brown wrote The Blue Key. The librarian says: The storybook is on the shelf. You can read it here, but you cannot borrow it today. In the final panel Ece remains at a library reading table with The Blue Key open to its last page. The last page says: Nora saw a note: “Meet me at the old station.” She thought it was from her brother. At the station, a boy said, “I wrote that for my sister. Your brother went home.” Nora went home. Her brother opened the door. Ece’s note says: Now I have both answers.</desc><rect width="360" height="2118" rx="20" fill="#fff"/><g stroke="#243b53" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><text x="180" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#243b53" stroke="none">LAST FRIDAY</text><rect x="12" y="66" width="336" height="275" rx="18" fill="#f7f4eb"/><rect x="31" y="88" width="298" height="230" rx="9" fill="#fffdf5"/><rect x="139" y="78" width="82" height="25" rx="8" fill="#e5bc6a"/><text x="180" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#243b53" stroke="none">HOMEWORK</text><text x="180" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">Who wrote</text><text x="180" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">The Blue Key?</text><text x="180" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">Where did Nora</text><text x="180" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">find her brother?</text><rect x="12" y="358" width="336" height="782" rx="18" fill="#eff6fa"/><text x="180" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#243b53" stroke="none">LIBRARY</text><rect x="35" y="430" width="86" height="76" rx="4" fill="#dfc4a0"/><path d="M48 444v47m17 -47v47m17 -47v47m17 -47v47" stroke="#75a7bc" stroke-width="10"/><path d="M35 498h86"/><path d="M167 476q-6 -60 31 -61q57 -1 35 61l-7 19h-51z" fill="#654839"/><circle cx="197" cy="472" r="27" fill="#ffddb6"/><circle cx="191" cy="469" r="2" fill="#243b53" stroke="none"/><circle cx="203" cy="469" r="2" fill="#243b53" stroke="none"/><path d="M191 478q6 7 12 0" fill="none"/><path d="M173 502h48l18 51h-83z" fill="#65b7a5"/><path d="M173 517l-24 25m72 -25l26 25" stroke="#ffddb6" stroke-width="11"/><text x="286" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">ECE</text><path d="M25 535q15 -12 31 -8 128 -18 279 9v173q-148 -24 -279 -5 -15 -5 -31 7z" fill="#fffdf4"/><path d="M56 528v175" stroke="#b7b2a4" stroke-width="3"/><text x="194" y="566" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">ENCYCLOPAEDIA</text><text x="194" y="613" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">Ada Brown</text><text x="194" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">wrote</text><text x="194" y="687" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">The Blue Key.</text><path d="M25 717h310m-285 0v23m260 -23v23" stroke="#ac825b" stroke-width="10"/><path d="M37 755h286q10 0 10 10v182q0 10 -10 10h-53l-19 28 -8 -28H37q-10 0 -10 -10V765q0 -10 10 -10z" fill="#fff"/><text x="180" y="792" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">The storybook is</text><text x="180" y="829" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">on the shelf.</text><text x="180" y="866" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">You can read it here,</text><text x="180" y="903" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">but you cannot</text><text x="180" y="940" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">borrow it today.</text><rect x="34" y="995" width="132" height="90" rx="4" fill="#e2c8a4"/><path d="M47 1008v57m22 -57v57m22 -57v57m22 -57v57m22 -57v57m18 -57v57" stroke="#7aaec0" stroke-width="13"/><path d="M34 1075h132"/><circle cx="254" cy="1019" r="24" fill="#ffddb6"/><circle cx="248" cy="1016" r="2" fill="#243b53" stroke="none"/><circle cx="260" cy="1016" r="2" fill="#243b53" stroke="none"/><path d="M248 1025q6 7 12 0" fill="none"/><circle cx="246" cy="1016" r="7" fill="none" stroke-width="2"/><circle cx="263" cy="1016" r="7" fill="none" stroke-width="2"/><path d="M232 1047h44l13 38h-71z" fill="#b89bcc"/><path d="M230 1054l-36 -11 -17 11" stroke="#ffddb6" stroke-width="10" fill="none"/><text x="252" y="1115" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">LIBRARIAN</text><rect x="12" y="1156" width="336" height="945" rx="18" fill="#f3f8ef"/><text x="180" y="1200" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#243b53" stroke="none">LIBRARY</text><rect x="33" y="1234" width="86" height="70" rx="4" fill="#dfc4a0"/><path d="M46 1245v45m17 -45v45m17 -45v45m17 -45v45" stroke="#75a7bc" stroke-width="10"/><path d="M33 1296h86"/><g transform="translate(0 20)"><path d="M169 1257q-6 -60 31 -61q57 -1 35 61l-7 19h-51z" fill="#654839"/><circle cx="199" cy="1253" r="27" fill="#ffddb6"/><circle cx="193" cy="1250" r="2" fill="#243b53" stroke="none"/><circle cx="205" cy="1250" r="2" fill="#243b53" stroke="none"/><path d="M193 1259q6 7 12 0" fill="none"/><path d="M175 1283h48l18 51h-83z" fill="#65b7a5"/><path d="M174 1298l-24 25m73 -25l26 25" stroke="#ffddb6" stroke-width="11"/><text x="286" y="1254" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">ECE</text></g><path d="M25 1322q15 -12 31 -8 128 -18 279 9v579q-148 -24 -279 -5 -15 -5 -31 7z" fill="#fffdf4"/><path d="M56 1315v581" stroke="#b7b2a4" stroke-width="3"/><text x="194" y="1353" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#243b53" stroke="none">THE BLUE KEY</text><text x="194" y="1391" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">LAST PAGE</text><text x="194" y="1434" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">Nora saw a note:</text><text x="194" y="1467" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">“Meet me at the</text><text x="194" y="1500" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">old station.”</text><text x="194" y="1533" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">She thought it was</text><text x="194" y="1566" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">from her brother.</text><text x="194" y="1599" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">At the station,</text><text x="194" y="1632" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">a boy said,</text><text x="194" y="1665" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">“I wrote that</text><text x="194" y="1698" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">for my sister.</text><text x="194" y="1731" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">Your brother</text><text x="194" y="1764" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">went home.”</text><text x="194" y="1797" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">Nora went home.</text><text x="194" y="1830" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">Her brother</text><text x="194" y="1863" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">opened the door.</text><g transform="translate(0 393)"><path d="M25 1521h310m-285 0v35m260 -35v35" stroke="#ac825b" stroke-width="10"/><rect x="47" y="1574" width="266" height="101" rx="12" fill="#fff" stroke="#89b58b"/><text x="180" y="1614" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">Now I have</text><text x="180" y="1652" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">both answers.</text></g></g></svg>