<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1256" viewBox="0 0 360 1256" role="img"><title>Nature reserve rules and visitors</title><desc>Two signs tell visitors to keep away from bird nests and take litter home. Leo watches the nest from the path and takes his litter home. Amy touches the nest and takes her litter home. Ben watches from the path but leaves litter on the ground.</desc><rect width="360" height="1256" rx="20" fill="#fff"/><g stroke="#243b53" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="12" width="336" height="211" rx="17" fill="#f5faf0"/><path d="M87 124V50m0 37l38 -24" stroke="#a07446" stroke-width="11"/><path d="M36 65q-12 -39 25 -42 17 -24 44 0 34 -6 38 31 0 26 -28 25H58q-29 0 -22 -14" fill="#9bc58b" stroke="none"/><path d="M85 84q35 36 70 0z" fill="#c78d55"/><path d="M89 88l45 13m-35 -7l42 -2m-45 10l39 -9" fill="none" stroke="#87532f"/><ellipse cx="111" cy="79" rx="8" ry="11" fill="#f8f4d7"/><ellipse cx="130" cy="80" rx="8" ry="11" fill="#f8f4d7"/><circle cx="270" cy="77" r="44" fill="#fff" stroke="#ca6667" stroke-width="7"/><path d="M242 46l57 62" stroke="#ca6667" stroke-width="7"/><text x="180" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">Keep away from</text><text x="180" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#243b53" stroke="none">nests.</text><rect x="12" y="237" width="336" height="205" rx="17" fill="#eff7fc"/><path d="M84 282h46l7 57h-60z" fill="#49b6aa"/><path d="M95 282v-10q12 -17 24 0v10" fill="none"/><path d="M93 312l9 -9 9 12 -12 10z" fill="#fff"/><path d="M115 313l9 4 -4 17 -10 -4z" fill="#ffcc62"/><path d="M199 278v67h90v-67l-45 -32z" fill="#f3cd97"/><rect x="232" y="309" width="25" height="36" fill="#fff"/><path d="M149 306h38m-11 -12l12 12 -12 12" fill="none" stroke="#4b9fd2" stroke-width="7"/><text x="180" y="384" text-anchor="middle" font-fam