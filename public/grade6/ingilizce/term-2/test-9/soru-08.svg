<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1077" viewBox="0 0 360 1077" role="img"><title>Asli’s holiday diary for 15 and 16 July</title><desc>Asli’s holiday diary shows two days with the same three family members. On 15 July rain falls outside their tent while they play a board game inside. The captions say: We played games here. I laughed a lot. I missed the sun. On 16 July the sun shines and the family walks through a forest with birds. The captions say: We walked here. I loved the birds. I missed our games in the tent.</desc><rect width="360" height="1077" rx="20" fill="#fff"/><g stroke="#243b53" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><text x="180" y="41" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#243b53" stroke="none">ASLI’S HOLIDAY</text><text x="180" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#243b53" stroke="none">DIARY</text><rect x="12" y="98" width="336" height="454" rx="18" fill="#eef4fa"/><text x="180" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#243b53" stroke="none">15 JULY</text><path d="M39 208q-22 -1 -18 -22 3 -19 24 -17 11 -20 31 -7 21 -2 23 19 0 26 -28 27z" fill="#bdcbd7" stroke="none"/><path d="M266 191q-24 1 -18 -24 4 -17 23 -15 15 -17 31 -4 23 -1 27 22 1 21 -28 21z" fill="#bdcbd7" stroke="none"/><path d="M28 225l-5 13" stroke="#6f9ec7" stroke-width="4"/><path d="M52 224l-5 13" stroke="#6f9ec7" stroke-width="4"/><path d="M81 225l-5 13" stroke="#6f9ec7" stroke-width="4"/><path d="M24 272l-5 13" stroke="#6f9ec7" stroke-width="4"/><path d="M40 312l-5 13" stroke="#6f9ec7" stroke-width="4"/><path d="M322 215l-5 13" stroke="#6f9ec7" stroke-width="4"/><path d="M294 217l-5 13" stroke="#6f9ec7" stroke-width="4"/><path d="M336 255l-5 13" stroke="#6f9ec7" stroke-width="4"/><path d="M322 300l-5 13" stroke="#6f9ec7" stroke-width="4"/><path d="M24 358l-5 13"