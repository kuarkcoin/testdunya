<title>Four people at work</title>
<desc>NORA wears work clothes and uses a spanner on the engine of a car with its bonnet open. LIAM wears a straw hat and waters growing vegetables. EVA wears a white coat and examines a patient’s teeth with small dental tools beside a reclining dental chair. MAX wears a chef hat and apron and stirs food in a pan on a cooker. No work dates are shown.</desc>
