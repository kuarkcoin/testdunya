<svg xmlns="http://www.w3.org/2000/svg" width="360" height="625" viewBox="0 0 360 625"><title>Class election ballot record</title><rect width="360" height="625" rx="18" fill="#f1f5f9"/><g font-family="Arial, sans-serif" font-size="26" fill="#0f172a"><text x="20" y="36" font-weight="bold">CLASS ELECTION</text><rect x="12" y="55" width="336" height="125" rx="12" fill="#dbeafe"/><text x="24" y="88" >VALID VOTE:</text><text x="24" y="123" >One name only.</text><text x="24" y="158" >Most votes = winner</text><rect x="12" y="220" width="336" height="195" rx="12" fill="#dcfce7"/><text x="24" y="253" >BALLOTS IN THE BOX</text><text x="24" y="288" >Ada only: 6</text><text x="24" y="323" >Ben only: 5</text><text x="24" y="358" >Ada AND Ben: 3</text><text x="24" y="393" >No name: 2</text><text x="24" y="445">One square = 1 paper</text><text x="24" y="475">Ada</text><rect x="24" y="487" width="36" height="38" rx="3" fill="white" stroke="#64748b"/><path d="M30 507 l6 6 l15 -17" fill="none" stroke="#16a34a" stroke-width="3"/><rect x="72" y="487" width="36" height="38" rx="3" fill="white" stroke="#64748b"/><path d="M78 507 l6 6 l15 -17" fill="none" stroke="#16a34a" stroke-width="3"/><rect x="120" y="487" width="36" height="38" rx="3" fill="white" stroke="#64748b"/><path d="M126 507 l6 6 l15 -17" fill="none" stroke="#16a34a" stroke-width="3"/><rect x="168" y="487" width="36" height="38" rx="3" fill="white" stroke="#64748b"/><path d="M174 507 l6 6 l15 -17" fill="none" stroke="#16a34a" stroke-width="3"/><rect x="216" y="487" width="36" height="38" rx="3" fill="white" stroke="#64748b"/><path d="M222 507 l6 6 l15 -17" fill="none" stroke="#16a34a" stroke-width="3"/><rect x="264" y="487" width="36" height="38" rx="3" fill="white" stroke="#64748b"/><path d="M270 507 l6 6 l15 -17" fill="none" stroke="#16a34a" stroke-width="3"/><text x="24" y="550">Ben</text><rect x="24" y="562" width="36" height="38" rx="3" fill="white" stroke="#64748b"/><path d="M30 582 l6 6 l15 -17" fill="none" stroke="#