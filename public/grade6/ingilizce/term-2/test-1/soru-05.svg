<svg xmlns="http://www.w3.org/2000/svg" width="360" height="665" viewBox="0 0 360 665"><title>Recycling bins and sorting instructions</title><rect width="360" height="665" rx="18" fill="#f1f5f9"/><g font-family="Arial, sans-serif" font-size="26" fill="#0f172a"><text x="20" y="36" font-weight="bold">RECYCLING STATION</text><rect x="12" y="55" width="336" height="125" rx="12" fill="#dbeafe"/><text x="24" y="88" >1. Empty bottles.</text><text x="24" y="123" >2. Put bottles in BLUE.</text><text x="24" y="158" >3. Put paper in GREEN.</text><rect x="22" y="235" width="140" height="115" rx="12" fill="#2563eb"/><text x="37" y="300" fill="white" font-weight="bold">BLUE</text><rect x="195" y="235" width="140" height="115" rx="12" fill="#16a34a"/><text x="210" y="300" fill="white" font-weight="bold">GREEN</text><rect x="12" y="375" width="336" height="125" rx="12" fill="#fef3c7"/><text x="24" y="408" >RULE</text><text x="24" y="443" >Keep wet paper out</text><text x="24" y="478" >of BOTH bins.</text><rect x="12" y="530" width="336" height="125" rx="12" fill="#dbeafe"/><text x="24" y="563" >YOUR BAG</text><text x="24" y="598" >Bottle with water</text><text x="24" y="633" >Dry paper • wet paper</text></g></svg>
