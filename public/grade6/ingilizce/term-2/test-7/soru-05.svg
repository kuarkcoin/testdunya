<svg xmlns="http://www.w3.org/2000/svg" width="360" height="778" viewBox="0 0 360 778" role="img">
<title>Three classmates’ election messages</title>
<desc>Mira says: Please choose me as class president. Leo says: I do not want to be president. I will count votes. Nora says: I want to be class president, too.</desc>
<rect x="0" y="0" width="360" height="778" rx="18" fill="#f3f7fb" stroke="none" stroke-width="2"/>
<g font-family="Arial, sans-serif">
<rect x="16" y="16" width="328" height="225" rx="14" fill="#e6f1f7" stroke="#bbcbd7" stroke-width="2"/><circle cx="65" cy="59" r="20" fill="#efc39e" stroke="#19364b" stroke-width="2"/><path d="M45 57 Q46 30 68 38 Q87 39 85 57 Q72 44 45 57" fill="#c48755" stroke="#c48755" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="58" cy="60" r="1.3" fill="#19364b" stroke="#19364b" stroke-width="1"/><circle cx="72" cy="60" r="1.3" fill="#19364b" stroke="#19364b" stroke-width="1"/><path d="M59 69 Q65 74 71 69" fill="none" stroke="#19364b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M37 114 Q39 85 65 84 Q91 85 93 114 Z" fill="#739cb7" stroke="#19364b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="135" y="73" text-anchor="start" font-size="30" font-weight="700" fill="#19364b">MIRA</text><rect x="29" y="118" width="302" height="105" rx="12" fill="#ffffff" stroke="#bed0dd" stroke-width="1.5"/><polygon points="88,118 104,103 111,118" fill="#ffffff" stroke="#bed0dd" stroke-width="1.5" stroke-linejoin="round"/><text x="44" y="156" text-anchor="start" font-size="26" font-weight="400" fill="#19364b">Please choose me</text><text x="44" y="192" text-anchor="start" font-size="26" font-weight="400" fill="#19364b">as class president.</text><rect x="16" y="258" width="328" height="260" rx="14" fill="#eef3e0" stroke="#bbcbd7" stroke-width="2"/><circle cx="65" cy="301" r="20" fill="#efc39e" stroke="#19364b" stroke-width="2"/><path d="M45 299 Q46 272 68 280 Q87 281 85 299 Q72 286 45 299" fill="#504438" stroke="#504438" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="58" cy="302" r="1.3" fill="#19364b" stroke="#19364b" stroke-width="1"/><circle cx="72" cy="302" r="1.3" fill="#19364b" stroke="#19364b" stroke-width="1"/><path d="M59 311 Q65 316 71 311" fill="none" stroke="#19364b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M37 356 Q39 327 65 326 Q91 327 93 356 Z" fill="#739cb7" stroke="#19364b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="135" y="315" text-anchor="start" font-size="30" font-weight="700" fill="#19364b">LEO</text><rect x="29" y="360" width="302" height="140" rx="12" fill="#ffffff" stroke="#bed0dd" stroke-width="1.5"/><polygon points="88,360 104,345 111,360" fill="#ffffff" stroke="#bed0dd" stroke-width="1.5" stroke-linejoin="round"/><text x="44" y="398" text-anchor="start" font-size="26" font-weight="400" fill="#19364b">I do not want to</text><text x="44" y="434" text-anchor="start" font-size="26" font-weight="400" fill="#19364b">be president.</text><text x="44" y="470" text-anchor="start" font-size="26" font-weight="400" fill="#19364b">I will count votes.</text><rect x="16" y="535" width="328" height="225" rx="14" fill="#f5e7ec" stroke="#bbcbd7" stroke-width="2"/><circle cx="65" cy="578" r="20" fill="#efc39e" stroke="#19364b" stroke-width="2"/><path d="M45 576 Q46 549 68 557 Q87 558 85 576 Q72 563 45 576" fill="#62423d" stroke="#62423d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="58" cy="579" r="1.3" fill="#19364b" stroke="#19364b" stroke-width="1"/><circle cx="72" cy="579" r="1.3" fill="#19364b" stroke="#19364b" stroke-width="1"/><path d="M59 588 Q65 593 71 588" fill="none" stroke="#19364b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M37 633 Q39 604 65 603 Q91 604 93 633 Z" fill="#739cb7" stroke="#19364b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="135" y="592" text-anchor="start" font-size="30" font-weight="700" fill="#19364b">NORA</text><rect x="29" y="637" width="302" height="105" rx="12" fill="#ffffff" stroke="#bed0dd" stroke-width="1.5"/><polygon points="88,637 104,622 111,637" fill="#ffffff" stroke="#bed0dd" stroke-width="1.5" stroke-linejoin="round"/><text x="44" y="675" text-anchor="start" font-size="26" font-weight="400" fill="#19364b">I want to be</text><text x="44" y="711" text-anchor="start" font-size="26" font-weight="400" fill="#19364b">class president, too.</text>
