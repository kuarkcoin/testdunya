<svg xmlns="http://www.w3.org/2000/svg" width="360" height="900" viewBox="0 0 360 900" role="img"><title>Question 5</title><desc>Three class president candidates give their plans. Ada says: Buy more storybooks. Stop all playground games. Ben says: Keep playground games. Buy more storybooks. Cem says: Keep playground games. Buy only sports balls, no books.</desc><rect width="360" height="900" fill="#f4f8fc"/><rect x="10" y="10" width="340" height="280" rx="16" fill="white" stroke="#a9bfd2" stroke-width="2"/><circle cx="49" cy="55" r="22" fill="#d77b53"/><text x="87" y="65" font-family="Arial,sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#17324d">ADA</text><text x="30" y="120" font-family="Arial,sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#17324d">Buy more</text><text x="30" y="162" font-family="Arial,sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#17324d">storybooks.</text><text x="30" y="204" font-family="Arial,sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#17324d">Stop all</text><text x="30" y="246" font-family="Arial,sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#17324d">playground games.</text><rect x="10" y="305" width="340" height="280" rx="16" fill="white" stroke="#a9bfd2" stroke-width="2"/><circle cx="49" cy="350" r="22" fill="#4f91b5"/><text x="87" y="360" font-family="Arial,sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#17324d">BEN</text><text x="30" y="415" font-family="Arial,sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#17324d">Keep playground</text><text x="30" y="457" font-family="Arial,sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#17324d">games.</text><text x="30" y="499" font-family="Arial,sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#17324d">Buy more</text><text x="30" y="541" font-family="Arial,sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#17324d">storybooks.</text><rect x="10" y="600" width="340" height="280" rx="16" fill="white" stroke="#a9bfd2" stroke-width="2"/><circle cx="49" cy="645" r="22" fill="#a079b5"/><text x="87" y="655" font-family="Arial,sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#17324d">CEM</text><text x="30" y="710" font-family="Arial,sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#17324d">Keep playground</text><text x="30" y="752" font-family="Arial,sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#17324d">games.</text><text x="30" y="794" font-family="Arial,sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#17324d">Buy only sports</text><text x="30" y="836" font-family="Arial,sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#17324d">balls, no books.</text></svg>