<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1100" viewBox="0 0 360 1100" role="img"><title>Holiday and reading records</title><desc>Two pages from the same storybook are shown. Ann reads page 12. In its picture, a girl puts a small bird with a bandaged wing in a cage and says: Stay here until your wing is better. Max reads only the last page, page 60. Its picture shows the girl beside the open cage as the bird flies away. She says: Time to go! Max has not seen page 12 or heard about it.</desc><rect width="360" height="1100" fill="#f3f6fc"/><rect x="12" y="14" width="336" height="524" rx="16" fill="white" stroke="#b5c9dc" stroke-width="2"/><text x="26" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17324d">ANN READS</text><text x="26" y="93" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#17324d">PAGE 12</text><circle cx="76" cy="184" r="28" fill="#e7b58a"/><path d="M47 178 Q48 135 77 146 Q109 146 105 185 L92 166 L53 167Z" fill="#644936"/><path d="M51 218 H99 L112 312 H37Z" fill="#4b8bb7"/><path d="M60 312 V362 M89 312 V362 M99 232 L157 260" stroke="#425a70" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M171 333 V229 Q226 179 282 229 V333Z" fill="#edf3f7" stroke="#71869b" stroke-width="4"/><ellipse cx="226" cy="281" rx="28" ry="20" fill="#e7b34c"/><circle cx="248" cy="263" r="14" fill="#e7b34c"/><path d="M260 260 L274 267 L260 271Z" fill="#b76f36"/><rect x="213" y="265" width="17" height="31" rx="4" fill="white" stroke="#c7b9a7" stroke-width="2"/><path d="M221 265 V296 M213 281 H230" stroke="#b8a48e" stroke-width="2"/><path d="M187 229 V333 M206 214 V333 M245 214 V333 M266 229 V333" stroke="#71869b" stroke-width="3"/><text x="26" y="424" font-family="Arial, sans-serif" font-size="26" font-weight="normal" fill="#17324d">Stay here until your</text><text x="26" y="461" font-family="Arial, sans-serif" font-size="26" font-weight="normal" fill="#17324d">wing is better.</text><rect x="12" y="552" width="336" height="524" rx="16" fill="white" stroke="#b5c9dc" stroke-width="2"/><text x="26" y="592" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17324d">MAX READS</text><text x="26" y="631" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#17324d">LAST PAGE: 60</text><circle cx="76" cy="722" r="28" fill="#e7b58a"/><path d="M47 716 Q48 673 77 684 Q109 684 105 723 L92 704 L53 705Z" fill="#644936"/><path d="M51 756 H99 L112 850 H37Z" fill="#4b8bb7"/><path d="M60 850 V900 M89 850 V900 M99 770 L157 798" stroke="#425a70" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M171 871 V767 Q226 717 282 767 V871Z" fill="#edf3f7" stroke="#71869b" stroke-width="4"/><path d="M193 766 V871 M263 766 V871 M211 786 L160 765 V850 L211 871Z" stroke="#71869b" stroke-width="3" fill="none"/><ellipse cx="266" cy="704" rx="24" ry="16" fill="#e7b34c"/><circle cx="287" cy="694" r="11" fill="#e7b34c"/><path d="M250 702 Q229 652 265 669 L277 702" fill="#d39a37"/><path d="M296 691 L309 697 L297 701Z" fill="#b76f36"/><text x="26" y="962" font-family="Arial, sans-serif" font-size="26" font-weight="normal" fill="#17324d">Time to go!</text></svg>