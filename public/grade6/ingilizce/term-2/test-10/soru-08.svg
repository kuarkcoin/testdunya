<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1100" viewBox="0 0 360 1100" role="img"><title>Holiday and reading records</title><desc>Two Monday records concern the same island. Ada&#x27;s record shows a cancelled boat route from the town to the island and a museum on the town side. Her note says: Our boat did not run. We visited the museum instead. Ben&#x27;s record shows a walking route across a bridge from the town to the island. Under the map is the heading On the island. His note says: We walked here across the bridge. The museum is on the town side, not on the island.</desc><rect width="360" height="1100" fill="#f3f6fc"/><rect x="12" y="14" width="336" height="524" rx="16" fill="white" stroke="#b5c9dc" stroke-width="2"/><text x="26" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17324d">ADA — MONDAY</text><rect x="26" y="79" width="308" height="210" rx="12" fill="#a9d9ed"/><path d="M26 79 H124 V289 H26Z" fill="#cee0a6"/><ellipse cx="265" cy="184" rx="57" ry="79" fill="#cee0a6"/><text x="30" y="114" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#17324d">TOWN</text><text x="208" y="114" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#17324d">ISLAND</text><path d="M108 202 H230" stroke="#316b96" stroke-width="4" stroke-dasharray="7 5"/><path d="M145 181 H198 L186 203 H157Z" fill="#316b96"/><path d="M151 154 L194 216 M194 154 L151 216" stroke="#b33640" stroke-width="6"/><text x="35" y="335" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#17324d">TOWN MUSEUM</text><text x="26" y="383" font-family="Arial, sans-serif" font-size="26" font-weight="normal" fill="#17324d">Our boat did not run.</text><text x="26" y="420" font-family="Arial, sans-serif" font-size="26" font-weight="normal" fill="#17324d">We visited the museum</text><text x="26" y="457" font-family="Arial, sans-serif" font-size="26" font-weight="normal" fill="#17324d">instead.</text><path d="M38 174 L72 149 L108 174Z" fill="#b38b60"/><rect x="43" y="179" width="60" height="64" fill="#d9ba93"/><path d="M54 183 V225 M73 183 V225 M92 183 V225" stroke="#9a6c43" stroke-width="7"/><rect x="12" y="552" width="336" height="524" rx="16" fill="white" stroke="#b5c9dc" stroke-width="2"/><text x="26" y="592" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17324d">BEN — MONDAY</text><rect x="26" y="617" width="308" height="210" rx="12" fill="#a9d9ed"/><path d="M26 617 H124 V827 H26Z" fill="#cee0a6"/><ellipse cx="265" cy="722" rx="57" ry="79" fill="#cee0a6"/><text x="30" y="652" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#17324d">TOWN</text><text x="208" y="652" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#17324d">ISLAND</text><path d="M107 727 H228" stroke="#b28d68" stroke-width="22"/><path d="M109 712 H228 M109 742 H228" stroke="#6d553d" stroke-width="4"/><path d="M65 797 L65 727 L263 727 L263 705" stroke="#276342" stroke-width="5" stroke-dasharray="8 5" fill="none"/><path d="M253 718 L263 704 L273 718" stroke="#276342" stroke-width="5" fill="none"/><text x="127" y="693" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#17324d">BRIDGE</text><text x="35" y="873" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#17324d">ON THE ISLAND</text><text x="26" y="921" font-family="Arial, sans-serif" font-size="26" font-weight="normal" fill="#17324d">We walked here</text><text x="26" y="958" font-family="Arial, sans-serif" font-size="26" font-weight="normal" fill="#17324d">across the bridge.</text></svg>