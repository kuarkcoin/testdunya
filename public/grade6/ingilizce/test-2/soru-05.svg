<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360"><title>Lara’nın seçimleri: olives NO; cheese YES. Zeytin ve peynir çizimleri büyük gösterilmiş.</title><rect width="360" height="360" fill="white"/><text x="180" y="32" font-family="Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#183c52">Lara&#x27;s choices</text><ellipse cx="71" cy="140" rx="11" ry="15" fill="#637c38" stroke="#183c52" stroke-width="2"/><ellipse cx="95" cy="149" rx="11" ry="15" fill="#637c38" stroke="#183c52" stroke-width="2"/><ellipse cx="118" cy="135" rx="11" ry="15" fill="#637c38" stroke="#183c52" stroke-width="2"/><text x="95" y="205" font-family="Arial, sans-serif" font-size="26" font-weight="600" text-anchor="middle" fill="#183c52">olives</text><text x="95" y="260" font-family="Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle" fill="#183c52">NO</text><polygon points="227,162 299,162 299,118" fill="#f9d66c" stroke="#183c52" stroke-width="2"/><circle cx="282" cy="149" r="4" fill="#c69c36"/><circle cx="291" cy="134" r="3" fill="#c69c36"/><text x="265" y="205" font-family="Arial, sans-serif" font-size="26" font-weight="600" text-anchor="middle" fill="#183c52">cheese</text><text x="265" y="260" font-family="Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle" fill="#183c52">YES</text><text x="180" y="330" font-family="Arial, sans-serif" font-size="26" font-weight="600" text-anchor="middle" fill="#183c52">YES: like   NO: dislike</text></svg>