<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420"><title>Teklif: Would you like some tea? Deniz’in seçim kartında tea NO, milk YES; çay fincanı ve süt bardağı resimleri.</title><rect width="360" height="420" fill="white"/><text x="180" y="32" font-family="Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#183c52">An offer to Deniz</text><rect x="15" y="55" width="330" height="85" rx="6" fill="#eef7ff" stroke="#183c52" stroke-width="2"/><text x="180" y="87" font-family="Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#183c52">Would you like</text><text x="180" y="123" font-family="Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#183c52">some tea?</text><path d="M123 209 Q150 210 137 232 L123 232" fill="none" stroke="#183c52" stroke-width="3"/><rect x="65" y="201" width="60" height="48" rx="6" fill="#fff1d0" stroke="#183c52" stroke-width="2"/><ellipse cx="95" cy="205" rx="26" ry="6" fill="#b17a3f"/><text x="95" y="291" font-family="Arial, sans-serif" font-size="26" font-weight="600" text-anchor="middle" fill="#183c52">tea</text><text x="95" y="340" font-family="Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle" fill="#183c52">NO</text><rect x="240" y="190" width="50" height="65" rx="6" fill="#fffdf3" stroke="#183c52" stroke-width="2"/><line x1="245" y1="202" x2="285" y2="202" stroke="#183c52" stroke-width="2"/><text x="265" y="291" font-family="Arial, sans-serif" font-size="26" font-weight="600" text-anchor="middle" fill="#183c52">milk</text><text x="265" y="340" font-family="Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle" fill="#183c52">YES</text><text x="180" y="393" font-family="Arial, sans-serif" font-size="26" font-weight="600" text-anchor="middle" fill="#183c52">Deniz&#x27;s choice</text></svg>