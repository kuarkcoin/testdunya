<svg xmlns="http://www.w3.org/2000/svg" width="360" height="540" viewBox="0 0 360 540"><title>A windy afternoon and Ada’s message</title><rect width="360" height="540" rx="16" fill="#f0f9ff"/><text x="180" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#172554">ADA’S AFTERNOON</text><circle cx="85" cy="100" r="24" fill="#cbd5e1" stroke="#334155" stroke-width="3"/><circle cx="114" cy="87" r="29" fill="#cbd5e1" stroke="#334155" stroke-width="3"/><circle cx="138" cy="100" r="21" fill="#cbd5e1" stroke="#334155" stroke-width="3"/><line x1="170" y1="88" x2="306" y2="88" stroke="#334155" stroke-width="4"/><line x1="190" y1="114" x2="330" y2="114" stroke="#334155" stroke-width="4"/><line x1="159" y1="141" x2="288" y2="141" stroke="#334155" stroke-width="4"/><polygon points="254,185 291,223 254,261 217,223" fill="#fb7185" stroke="#334155" stroke-width="3"/><line x1="254" y1="185" x2="254" y2="261" stroke="#334155" stroke-width="4"/><line x1="217" y1="223" x2="291" y2="223" stroke="#334155" stroke-width="4"/><path d="M254 261 Q210 300 260 320 Q285 340 230 362" fill="none" stroke="#334155" stroke-width="3"/><circle cx="92" cy="215" r="14" fill="#fed7aa" stroke="#334155" stroke-width="3"/><rect x="77" y="231" width="30" height="38" rx="8" fill="#38bdf8" stroke="#334155" stroke-width="2"/><line x1="84" y1="269" x2="78" y2="293" stroke="#334155" stroke-width="4"/><line x1="100" y1="269" x2="106" y2="293" stroke="#334155" stroke-width="4"/><line x1="108" y1="249" x2="230" y2="362" stroke="#334155" stroke-width="4"/><rect x="20" y="386" width="320" height="134" rx="8" fill="#fff" stroke="#334155" stroke-width="2"/><text x="180" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">“The wind is strong.</text><text x="180" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">My kite is flying high.</text><text x="180" y="501" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">I feel excited!”</text></svg>