<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430"><title>Mia’nın sıralı sabah programı: 06.45 kalkış, 07.10 kahvaltı, 07.25 diş fırçalama, 07.40 evden çıkış.</title><rect width="360" height="430" fill="white"/><text x="180" y="32" font-family="Arial, sans-serif" font-size="28" font-weight="600" text-anchor="middle" fill="#183c52">Mia&#x27;s morning</text><rect x="14" y="52" width="332" height="72" rx="5" fill="#edf7ff" stroke="#183c52" stroke-width="2"/><text x="28" y="82" font-family="Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start" fill="#183c52">06:45</text><text x="180" y="112" font-family="Arial, sans-serif" font-size="27" font-weight="600" text-anchor="middle" fill="#183c52">Get up</text><rect x="14" y="135" width="332" height="72" rx="5" fill="#edf7ff" stroke="#183c52" stroke-width="2"/><text x="28" y="165" font-family="Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start" fill="#183c52">07:10</text><text x="180" y="195" font-family="Arial, sans-serif" font-size="27" font-weight="600" text-anchor="middle" fill="#183c52">Have breakfast</text><rect x="14" y="218" width="332" height="72" rx="5" fill="#edf7ff" stroke="#183c52" stroke-width="2"/><text x="28" y="248" font-family="Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start" fill="#183c52">07:25</text><text x="180" y="278" font-family="Arial, sans-serif" font-size="27" font-weight="600" text-anchor="middle" fill="#183c52">Brush teeth</text><rect x="14" y="301" width="332" height="72" rx="5" fill="#edf7ff" stroke="#183c52" stroke-width="2"/><text x="28" y="331" font-family="Arial, sans-serif" font-size="28" font-weight="600" text-anchor="start" fill="#183c52">07:40</text><text x="180" y="361" font-family="Arial, sans-serif" font-size="27" font-weight="600" text-anchor="middle" fill="#183c52">Leave home</text></svg>