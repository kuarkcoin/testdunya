<svg xmlns="http://www.w3.org/2000/svg" width="360" height="336" viewBox="0 0 360 336" role="img">
<title>Gözlenen kayıttan yeni denemelere tahmin</title>
<desc>Üstte gözlenen sonuçlar kartı: 60 deneme, 21 kez açık yüz yukarıda. Aşağıya doğru, yanında Tahmin yazan bir ok var. Altta planlanan deney kartı: 100 deneme, açık yüzün yukarıda kalma sayısı soru işareti.</desc>
<rect width="360" height="336" fill="#FFFFFF"/>
<rect x="12" y="8" width="336" height="126" rx="10" fill="#DFF2F1" stroke="#36586D" stroke-width="2.5"/>
<text x="180" y="32" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#15354B">Gözlenen</text>
<text x="180" y="72" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#15354B">60 deneme</text>
<text x="180" y="111" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#15354B">Açık yüz: 21</text>
<line x1="180" y1="138" x2="180" y2="192" stroke="#41566B" stroke-width="2.5" stroke-linecap="round"/><path d="M 176.09 183.90 L 180.00 192.00 L 183.91 183.90" fill="none" stroke="#41566B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="263" y="165" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Tahmin</text>
<rect x="12" y="198" width="336" height="126" rx="10" fill="#EDE9FE" stroke="#36586D" stroke-width="2.5"/>
<text x="180" y="222" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#15354B">Planlanan</text>
<text x="180" y="262" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#15354B">100 deneme</text>
<text x="180" y="301" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#15354B">Açık yüz: ?</text>
</svg>
