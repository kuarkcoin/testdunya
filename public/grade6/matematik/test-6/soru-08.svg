<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img">
<title>Para atma deneyinin defter kaydı</title>
<desc>Deney defterinde iki bilgi grubu var: Atış sayısı 40’tan fazla ve 60’tan az. Yazı gelmesinin göreli sıklığı 5/12. Toplam atış ve yazı sayısı gösterilmiyor.</desc>
<rect width="360" height="350" fill="#FFFFFF"/>
<rect x="20" y="8" width="328" height="330" rx="8" fill="#FFFEF9" stroke="#36586D" stroke-width="2.5"/>
<line x1="54" y1="12" x2="54" y2="332" stroke="#D7A5AF" stroke-width="2" stroke-linecap="round"/>
<circle cx="34" cy="34" r="4" fill="#FFFFFF" stroke="#36586D" stroke-width="1.5"/>
<circle cx="34" cy="82" r="4" fill="#FFFFFF" stroke="#36586D" stroke-width="1.5"/>
<circle cx="34" cy="130" r="4" fill="#FFFFFF" stroke="#36586D" stroke-width="1.5"/>
<circle cx="34" cy="178" r="4" fill="#FFFFFF" stroke="#36586D" stroke-width="1.5"/>
<circle cx="34" cy="226" r="4" fill="#FFFFFF" stroke="#36586D" stroke-width="1.5"/>
<circle cx="34" cy="274" r="4" fill="#FFFFFF" stroke="#36586D" stroke-width="1.5"/>
<circle cx="34" cy="322" r="4" fill="#FFFFFF" stroke="#36586D" stroke-width="1.5"/>
<text x="200" y="38" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#15354B">Deney defteri</text>
<line x1="68" y1="63" x2="332" y2="63" stroke="#BACAD7" stroke-width="1.5" stroke-linecap="round"/>
<text x="200" y="91" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#15354B">Atış sayısı</text>
<text x="200" y="126" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">40’tan fazla</text>
<text x="200" y="161" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">60’tan az</text>
<line x1="68" y1="188" x2="332" y2="188" stroke="#BACAD7" stroke-width="1.5" stroke-linecap="round"/>
<text x="200" y="216" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#15354B">Yazı</text>
<text x="200" y="253" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Göreli sıklık</text>
<text x="200" y="303" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700" fill="#15354B">5/12</text>
</svg>
