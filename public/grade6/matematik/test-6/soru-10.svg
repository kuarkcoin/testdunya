<svg xmlns="http://www.w3.org/2000/svg" width="360" height="330" viewBox="0 0 360 330" role="img">
<title>İki kez yazılan deneylerin kayıt kontrolü</title>
<desc>Alt alta iki kayıt panosu, aynı hizada K ve L sütunları. Hatalı kayıt panosunda K 27, L 33 yazıyor. İki kez yazılan denemeler panosunda K 6, L 4 yazıyor. Düzeltilmiş toplamlar gösterilmiyor.</desc>
<rect width="360" height="330" fill="#FFFFFF"/>
<rect x="12" y="8" width="336" height="144" rx="10" fill="#DFF2F1" stroke="#36586D" stroke-width="2.5"/>
<text x="180" y="36" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#15354B">Hatalı kayıt</text>
<line x1="12" y1="62" x2="348" y2="62" stroke="#36586D" stroke-width="2.5" stroke-linecap="round"/>
<line x1="180" y1="62" x2="180" y2="152" stroke="#36586D" stroke-width="2.5" stroke-linecap="round"/>
<text x="96" y="87" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#15354B">K</text>
<text x="264" y="87" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#15354B">L</text>
<text x="96" y="127" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#15354B">27</text>
<text x="264" y="127" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#15354B">33</text>
<rect x="12" y="174" width="336" height="144" rx="10" fill="#EDE9FE" stroke="#36586D" stroke-width="2.5"/>
<text x="180" y="202" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#15354B">İki kez yazılanlar</text>
<line x1="12" y1="228" x2="348" y2="228" stroke="#36586D" stroke-width="2.5" stroke-linecap="round"/>
<line x1="180" y1="228" x2="180" y2="318" stroke="#36586D" stroke-width="2.5" stroke-linecap="round"/>
<text x="96" y="253" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#15354B">K</text>
<text x="264" y="253" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#15354B">L</text>
<text x="96" y="293" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#15354B">6</text>
<text x="264" y="293" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#15354B">4</text>
</svg>
