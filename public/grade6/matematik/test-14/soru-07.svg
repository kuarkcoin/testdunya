<svg xmlns="http://www.w3.org/2000/svg" width="360" height="700" viewBox="0 0 360 700"><title>İlk adım bir nokta. İkinci adım üstte bir altta iki, toplam üç nokta. Üçüncü adım bir, iki ve üç noktalı sıralar, toplam altı nokta. Ardışık iki büyük şeklin toplamı 81.</title><rect width="360" height="700" rx="18" fill="#f8fafc"/><text x="180" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">NOKTA ÖRÜNTÜSÜ</text><text x="70" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">1. adım</text><circle cx="235" cy="115" r="12" fill="#3b82f6" stroke="#475569" stroke-width="2"/><text x="70" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">2. adım</text><circle cx="235" cy="230" r="12" fill="#3b82f6" stroke="#475569" stroke-width="2"/><circle cx="215" cy="268" r="12" fill="#3b82f6" stroke="#475569" stroke-width="2"/><circle cx="255" cy="268" r="12" fill="#3b82f6" stroke="#475569" stroke-width="2"/><text x="70" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">3. adım</text><circle cx="235" cy="375" r="12" fill="#3b82f6" stroke="#475569" stroke-width="2"/><circle cx="215" cy="413" r="12" fill="#3b82f6" stroke="#475569" stroke-width="2"/><circle cx="255" cy="413" r="12" fill="#3b82f6" stroke="#475569" stroke-width="2"/><circle cx="195" cy="451" r="12" fill="#3b82f6" stroke="#475569" stroke-width="2"/><circle cx="235" cy="451" r="12" fill="#3b82f6" stroke="#475569" stroke-width="2"/><circle cx="275" cy="451" r="12" fill="#3b82f6" stroke="#475569" stroke-width="2"/><text x="180" y="550" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">Ardışık iki büyük adım</text><text x="180" y="595" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">Toplam: 81 nokta</text><text x="180" y="645" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">Büyük şekil = ?</text></svg>