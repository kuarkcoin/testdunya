<svg xmlns="http://www.w3.org/2000/svg" width="360" height="700" viewBox="0 0 360 700"><title>Bir büyük 8 cm kare ile sağ altına kaydırılmış 6 cm kare. Ortak dikdörtgenin yatay uzunluğu 3 cm, düşey uzunluğu 4 cm. Dış sınır turuncu, iç çizgiler kesikli.</title><rect width="360" height="700" rx="18" fill="#f8fafc"/><text x="180" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">ÜST ÜSTE İKİ KARE</text><rect x="30" y="125" width="192" height="192" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="150" y="221" width="144" height="144" fill="#bbf7d0" stroke="#2563eb" stroke-width="2"/><rect x="150" y="221" width="72" height="96" fill="#a5b4fc" stroke="#2563eb" stroke-width="2"/><path d="M30 125 H222 V221 H294 V365 H150 V317 H30 Z" fill="none" stroke="#ea580c" stroke-width="5"/><line x1="150" y1="221" x2="222" y2="221" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/><line x1="150" y1="221" x2="150" y2="317" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/><line x1="222" y1="221" x2="222" y2="317" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/><line x1="150" y1="317" x2="222" y2="317" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/><text x="126" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">8 cm</text><text x="222" y="398" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">6 cm</text><text x="180" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">Ortak bölge: 3 cm × 4 cm</text><text x="180" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">Turuncu: dış sınır</text><text x="180" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">Birleşik alan ve çevre?</text></svg>