<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650"><title>Yol üzerinde 50 cm çaplı tekerlek; başlangıçta P en altta, sağa ilerleme oku ve 25,8 m toplam yol etiketi.</title><rect width="360" height="650" rx="18" fill="#f8fafc"/><text x="180" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">TEKERLEĞİN DÖNÜŞÜ</text><circle cx="180" cy="240" r="100" fill="#e0f2fe" stroke="#475569" stroke-width="2"/><line x1="80" y1="240" x2="280" y2="240" stroke="#475569" stroke-width="3"/><text x="180" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">50 cm</text><line x1="25" y1="340" x2="335" y2="340" stroke="#475569" stroke-width="3"/><circle cx="180" cy="340" r="6" fill="#ef4444" stroke="#475569" stroke-width="2"/><text x="180" y="378" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">P</text><line x1="75" y1="440" x2="285" y2="440" stroke="#ea580c" stroke-width="4"/><polygon points="285,440 270,432 270,448" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="180" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">Toplam yol: 25,8 m</text><text x="180" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">π = 3</text><text x="180" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">Kaymadan ilerler.</text></svg>