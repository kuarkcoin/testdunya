<svg xmlns="http://www.w3.org/2000/svg" width="360" height="700" viewBox="0 0 360 700"><title>6 m genişliğinde, 4 m yüksekliğinde dikdörtgenin sağ üstünden 2 m genişliğinde ve 1,5 m yüksekliğinde dikdörtgen çıkarılmış L biçimli duvar. 0,75 L şişe ve iki kat bilgisi. Başlangıçta elde 1,2 L boya vardır.</title><rect width="360" height="700" rx="18" fill="#f8fafc"/><text x="180" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">L BİÇİMLİ DUVAR</text><polygon points="35,150 195,150 195,210 275,210 275,310 35,310" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><text x="155" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">6 m</text><text x="155" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">Tam yükseklik: 4 m</text><line x1="195" y1="150" x2="275" y2="150" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/><line x1="275" y1="150" x2="275" y2="210" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/><text x="235" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">2 m</text><text x="295" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">1,5</text><text x="300" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">m</text><text x="180" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">1 L → bir katta 7 m²</text><text x="180" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">Duvar: 2 kat boya</text><rect x="145" y="510" width="70" height="90" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/><rect x="165" y="495" width="30" height="15" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/><text x="180" y="640" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">Bir şişe: 0,75 L</text><text x="180" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#172554">Eldeki boya: 1,2 L</text></svg>