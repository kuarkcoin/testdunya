<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img"><title>Test 10 · Soru 4</title><desc>A atölyesi: bir kez 8 TL üyelik, her ders 6 TL. B atölyesi: bir kez 20 TL üyelik, her ders 4 TL.</desc><rect width="360" height="350" fill="white"/><rect x="12" y="20" width="336" height="145" rx="4" fill="#EEF7FC" stroke="#36586D" stroke-width="2"/><text x="180" y="49" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">A atölyesi</text><text x="180" y="95" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Üyelik: 8 TL</text><text x="180" y="134" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Her ders: 6 TL</text><rect x="12" y="190" width="336" height="145" rx="4" fill="#FFF0C9" stroke="#36586D" stroke-width="2"/><text x="180" y="219" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">B atölyesi</text><text x="180" y="265" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Üyelik: 20 TL</text><text x="180" y="304" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Her ders: 4 TL</text></svg>