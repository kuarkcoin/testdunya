<svg xmlns="http://www.w3.org/2000/svg" width="360" height="370" viewBox="0 0 360 370" role="img"><title>Test 10 · Soru 6</title><desc>Başlangıç sayısından sonra bir işlem kutusu: 2 ile çarp, 1 ekle. Bu işlem çifti üç kez tekrarlanır, sonra sonuç yazılır.</desc><rect width="360" height="370" fill="white"/><rect x="42" y="15" width="276" height="52" rx="4" fill="#EEF7FC" stroke="#36586D" stroke-width="2"/><text x="180" y="41" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Başlangıç sayısı</text><line x1="180" y1="67" x2="180" y2="100" stroke="#36586D" stroke-width="3"/><polygon points="175,91 185,91 180,100" fill="#36586D"/><rect x="25" y="106" width="310" height="112" rx="4" fill="#FFF0C9" stroke="#36586D" stroke-width="2"/><text x="180" y="140" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">2 ile çarp</text><text x="180" y="185" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Sonra 1 ekle</text><text x="180" y="251" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Bu işlem çiftini</text><text x="180" y="289" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">tam 3 kez uygula.</text><line x1="180" y1="309" x2="180" y2="330" stroke="#36586D" stroke-width="3"/><polygon points="175,321 185,321 180,330" fill="#36586D"/><text x="180" y="350" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Sonucu yaz</text></svg>