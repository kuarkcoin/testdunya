<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img"><title>Test 10 · Soru 7</title><desc>Dikdörtgenin kısa kenarı n cm, uzun kenarı (n + 3) cm. İki tam tur şerit sarılacağı belirtilmiş. Çizim ölçekli değil.</desc><rect width="360" height="350" fill="white"/><rect x="85" y="80" width="240" height="150" rx="4" fill="#EEF7FC" stroke="#36586D" stroke-width="2"/><text x="205" y="49" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">(n + 3) cm</text><text x="43" y="154" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">n</text><text x="43" y="188" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">cm</text><text x="180" y="267" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">n = 5</text><text x="180" y="308" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">2 tam tur şerit</text><text x="180" y="336" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Çizim ölçekli değildir.</text></svg>