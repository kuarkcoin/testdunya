<svg xmlns="http://www.w3.org/2000/svg" width="360" height="620" viewBox="0 0 360 620" role="img" aria-labelledby="title desc"><title>Kesişen doğru parçaları</title><desc>D orta nokta. AE iki EC. BPD alanı 12 santimetrekare, APE alanı soruluyor.</desc><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="620" rx="16" fill="#f8fbff"/><text x="180" y="36" font-size="28" text-anchor="middle" fill="#15324d" font-weight="600" >Kesişen parçalar</text><polygon points="170,90 35,420 320,420" fill="white" stroke="#15324d" stroke-width="2"/><polygon points="35,420 176,354 177.5,420" fill="#bfe1ff" stroke="#15324d" stroke-width="2"/><polygon points="170,90 176,354 270,310" fill="#ffb867" stroke="#15324d" stroke-width="2"/><line x1="170" y1="90" x2="177.5" y2="420" stroke="#15324d" stroke-width="3"/><line x1="35" y1="420" x2="270" y2="310" stroke="#15324d" stroke-width="3"/><line x1="106.25" y1="413" x2="106.25" y2="427" stroke="#15324d" stroke-width="3"/><line x1="248.75" y1="413" x2="248.75" y2="427" stroke="#15324d" stroke-width="3"/><text x="170" y="72" font-size="28" text-anchor="middle" fill="#15324d" font-weight="600" >A</text><text x="23" y="456" font-size="28" text-anchor="middle" fill="#15324d" font-weight="600" >B</text><text x="333" y="456" font-size="28" text-anchor="middle" fill="#15324d" font-weight="600" >C</text><text x="177" y="456" font-size="28" text-anchor="middle" fill="#15324d" font-weight="600" >D</text><text x="291" y="302" font-size="28" text-anchor="middle" fill="#15324d" font-weight="600" >E</text><text x="151" y="351" font-size="28" text-anchor="middle" fill="#15324d" font-weight="600" >P</text><text x="133" y="408" font-size="28" text-anchor="middle" fill="#15324d" font-weight="600" >12</text><text x="213" y="248" font-size="28" text-anchor="middle" fill="#15324d" font-weight="600" >?</text><text x="180" y="500" font-size="28" text-anchor="middle" fill="#15324d" font-weight="600" >BD = DC</text><text x="180" y="544" font-size="28" text-anchor="middle" fill="#15324d" font-weight="600" >AE = 2 × EC</text><text x="180" y="591" font-size="26" text-anchor="middle" fill="#15324d" font-weight="600" >Alanlar: cm²</text></g></svg>
