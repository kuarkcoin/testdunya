<svg xmlns="http://www.w3.org/2000/svg" width="360" height="560" viewBox="0 0 360 560" role="img" aria-labelledby="title desc"><title>Sıralama algoritması</title><desc>Önce A ve C, sonra B ve C karşılaştırılır. Son işlem eksiktir; hedef A küçük B küçük C sırasıdır.</desc><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="560" rx="16" fill="#f8fbff"/><text x="180" y="36" font-size="28" text-anchor="middle" fill="#15324d" font-weight="600" >Sıralama algoritması</text><rect x="39" y="65" width="84" height="56" rx="9" fill="#bfe1ff" stroke="#15324d" stroke-width="2"/><text x="81" y="103" font-size="30" text-anchor="middle" fill="#15324d" font-weight="600" >A</text><rect x="137" y="65" width="84" height="56" rx="9" fill="#bfe1ff" stroke="#15324d" stroke-width="2"/><text x="179" y="103" font-size="30" text-anchor="middle" fill="#15324d" font-weight="600" >B</text><rect x="235" y="65" width="84" height="56" rx="9" fill="#bfe1ff" stroke="#15324d" stroke-width="2"/><text x="277" y="103" font-size="30" text-anchor="middle" fill="#15324d" font-weight="600" >C</text><line x1="180" y1="125" x2="180" y2="149" stroke="#15324d" stroke-width="3"/><polygon points="174,147 186,147 180,157" fill="#15324d" stroke="#15324d" stroke-width="1"/><rect x="40" y="162" width="280" height="80" rx="12" fill="white" stroke="#15324d" stroke-width="2"/><text x="180" y="195" font-size="28" text-anchor="middle" fill="#15324d" font-weight="600" >A ile C’yi</text><text x="180" y="229" font-size="28" text-anchor="middle" fill="#15324d" font-weight="600" >karşılaştır</text><line x1="180" y1="246" x2="180" y2="274" stroke="#15324d" stroke-width="3"/><polygon points="174,272 186,272 180,282" fill="#15324d" stroke="#15324d" stroke-width="1"/><rect x="40" y="287" width="280" height="80" rx="12" fill="white" stroke="#15324d" stroke-width="2"/><text x="180" y="320" font-size="28" text-anchor="middle" fill="#15324d" font-weight="600" >B ile C’yi</text><text x="180" y="354" font-size="28" text-anchor="middle" fill="#15324d" font-weight="600" >karşılaştır</text><line x1="180" y1="371" x2="180" y2="399" stroke="#15324d" stroke-width="3"/><polygon points="174,397 186,397 180,407" fill="#15324d" stroke="#15324d" stroke-width="1"/><rect x="40" y="412" width="280" height="80" rx="12" fill="#ffb867" stroke="#15324d" stroke-width="2"/><text x="180" y="464" font-size="30" text-anchor="middle" fill="#15324d" font-weight="600" >?</text><text x="180" y="538" font-size="28" text-anchor="middle" fill="#15324d" font-weight="600" >Hedef: A &lt; B &lt; C</text></g></svg>
