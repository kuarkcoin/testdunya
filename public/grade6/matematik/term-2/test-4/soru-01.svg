<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" role="img" aria-labelledby="title desc"><title>Yedi kutu, üç grup</title><desc>K tek ortak kutudur. Grup toplamları 64, 72 ve 80 puldur.</desc><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="360" height="650" rx="16" fill="#f8fbff"/><text x="180" y="36" font-size="28" text-anchor="middle" fill="#15324d" font-weight="600" >Yedi kutu, üç grup</text><line x1="60" y1="110" x2="300" y2="330" stroke="#6e89a6" stroke-width="4"/><line x1="180" y1="75" x2="180" y2="365" stroke="#6e89a6" stroke-width="4"/><line x1="300" y1="110" x2="60" y2="330" stroke="#6e89a6" stroke-width="4"/><rect x="33" y="86" width="54" height="48" rx="8" fill="#bfe1ff" stroke="#15324d" stroke-width="2"/><text x="60" y="120" font-size="30" text-anchor="middle" fill="#15324d" font-weight="600" >A</text><rect x="153" y="51" width="54" height="48" rx="8" fill="#bfe1ff" stroke="#15324d" stroke-width="2"/><text x="180" y="85" font-size="30" text-anchor="middle" fill="#15324d" font-weight="600" >B</text><rect x="273" y="86" width="54" height="48" rx="8" fill="#bfe1ff" stroke="#15324d" stroke-width="2"/><text x="300" y="120" font-size="30" text-anchor="middle" fill="#15324d" font-weight="600" >C</text><rect x="273" y="306" width="54" height="48" rx="8" fill="#bfe1ff" stroke="#15324d" stroke-width="2"/><text x="300" y="340" font-size="30" text-anchor="middle" fill="#15324d" font-weight="600" >D</text><rect x="153" y="341" width="54" height="48" rx="8" fill="#bfe1ff" stroke="#15324d" stroke-width="2"/><text x="180" y="375" font-size="30" text-anchor="middle" fill="#15324d" font-weight="600" >E</text><rect x="33" y="306" width="54" height="48" rx="8" fill="#bfe1ff" stroke="#15324d" stroke-width="2"/><text x="60" y="340" font-size="30" text-anchor="middle" fill="#15324d" font-weight="600" >F</text><rect x="153" y="196" width="54" height="48" rx="8" fill="#ffb867" stroke="#15324d" stroke-width="2"/><text x="180" y="230" font-size="30" text-anchor="middle" fill="#15324d" font-weight="600" >K</text><rect x="30" y="414" width="300" height="52" rx="9" fill="white" stroke="#aac3da" stroke-width="2"/><text x="180" y="449" font-size="26" text-anchor="middle" fill="#15324d" font-weight="600" >A + K + D = 64</text><rect x="30" y="480" width="300" height="52" rx="9" fill="white" stroke="#aac3da" stroke-width="2"/><text x="180" y="515" font-size="26" text-anchor="middle" fill="#15324d" font-weight="600" >B + K + E = 72</text><rect x="30" y="546" width="300" height="52" rx="9" fill="white" stroke="#aac3da" stroke-width="2"/><text x="180" y="581" font-size="26" text-anchor="middle" fill="#15324d" font-weight="600" >C + K + F = 80</text></g></svg>
