<svg xmlns="http://www.w3.org/2000/svg" width="360" height="440" viewBox="0 0 360 440" role="img" aria-label="Matematik sorusu"><title>Matematik 2. dönem Test 1 — Soru 7</title><desc>ABC üçgeninin BC tabanı, sırasıyla B, D, E, C noktalarıyla üç parçaya ayrılmıştır. BD n + 2 cm, DE 2n − 1 cm, EC n + 5 cm. ABD alanı 20 cm², ADE alanı 30 cm²; AEC alanı soruluyor.</desc><rect width="360" height="440" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#0f172a"><polygon points="160,45 20,255 340,255" fill="#eef2ff" stroke="#334155" stroke-width="3"/><polygon points="160,45 20,255 104,255" fill="#bfdbfe" stroke="#334155" stroke-width="3"/><polygon points="160,45 104,255 230,255" fill="#c7d2fe" stroke="#334155" stroke-width="3"/><line x1="160" y1="45" x2="230" y2="255" stroke="#334155" stroke-width="3" /><text x="160" y="30" font-size="26" text-anchor="middle" >A</text><text x="18" y="288" font-size="26" text-anchor="middle" >B</text><text x="104" y="288" font-size="26" text-anchor="middle" >D</text><text x="230" y="288" font-size="26" text-anchor="middle" >E</text><text x="342" y="288" font-size="26" text-anchor="middle" >C</text><text x="81" y="210" font-size="26" text-anchor="middle" >20</text><text x="162" y="210" font-size="26" text-anchor="middle" >30</text><text x="261" y="210" font-size="26" text-anchor="middle" >?</text><text x="180" y="328" font-size="26" text-anchor="middle" >Alanlar: cm²</text><text x="180" y="368" font-size="26" text-anchor="middle" >BD = n + 2 cm</text><text x="180" y="399" font-size="26" text-anchor="middle" >DE = 2n − 1 cm</text><text x="180" y="430" font-size="26" text-anchor="middle" >EC = n + 5 cm</text></g></svg>