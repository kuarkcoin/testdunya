<svg xmlns="http://www.w3.org/2000/svg" width="360" height="460" viewBox="0 0 360 460" role="img" aria-label="Matematik sorusu"><title>Matematik 2. dönem Test 1 — Soru 4</title><desc>ABCD paralelkenarında AB 2 dm, dik yükseklik 12 cm. E, AB üzerinde ve AE 60 mm. F, DC üzerinde ve DF 8 cm. EBCF dörtgeni taralı; ADF ve AEF üçgenleri taralı değil.</desc><rect width="360" height="460" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#0f172a"><polygon points="30,315 280,315 335,145 85,145" fill="#f8fafc" stroke="#334155" stroke-width="3"/><polygon points="105,315 280,315 335,145 185,145" fill="#a5b4fc" stroke="#334155" stroke-width="3"/><line x1="30" y1="315" x2="185" y2="145" stroke="#334155" stroke-width="3" /><line x1="85" y1="145" x2="85" y2="315" stroke="#334155" stroke-width="3" stroke-dasharray="7 5"/><line x1="85" y1="301" x2="99" y2="301" stroke="#334155" stroke-width="3" /><line x1="99" y1="301" x2="99" y2="315" stroke="#334155" stroke-width="3" /><text x="25" y="347" font-size="26" text-anchor="middle" >A</text><text x="285" y="347" font-size="26" text-anchor="middle" >B</text><text x="340" y="130" font-size="26" text-anchor="middle" >C</text><text x="80" y="130" font-size="26" text-anchor="middle" >D</text><text x="107" y="347" font-size="26" text-anchor="middle" >E</text><text x="185" y="130" font-size="26" text-anchor="middle" >F</text><text x="135" y="83" font-size="26" text-anchor="middle" >8 cm</text><line x1="85" y1="100" x2="185" y2="100" stroke="#334155" stroke-width="3" /><text x="38" y="225" font-size="26" text-anchor="middle" transform="rotate(-90 38 225)">12 cm</text><text x="76" y="388" font-size="26" text-anchor="middle" >60 mm</text><text x="180" y="437" font-size="26" text-anchor="middle" >AB = 2 dm</text></g></svg>