<svg xmlns="http://www.w3.org/2000/svg" width="360" height="380" viewBox="0 0 360 380" role="img" aria-label="Matematik sorusu"><title>Matematik 2. dönem Test 1 — Soru 1</title><desc>Dikdörtgen bahçenin yatay kenarı (2n + 3) m, düşey kenarı (n + 4) m. Alt kenarda 5 m genişliğinde kapı boşluğu bulunuyor.</desc><rect width="360" height="380" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#0f172a"><polygon points="55,85 325,85 325,250 55,250" fill="#dcfce7" stroke="#334155" stroke-width="3"/><line x1="145" y1="250" x2="225" y2="250" stroke="#fff" stroke-width="8"/><text x="190" y="53" font-size="26" text-anchor="middle" >(2n + 3) m</text><text x="25" y="175" font-size="26" text-anchor="middle" transform="rotate(-90 25 175)">(n + 4) m</text><line x1="145" y1="270" x2="225" y2="270" stroke="#334155" stroke-width="3" /><line x1="145" y1="260" x2="145" y2="280" stroke="#334155" stroke-width="3" /><line x1="225" y1="260" x2="225" y2="280" stroke="#334155" stroke-width="3" /><text x="185" y="312" font-size="26" text-anchor="middle" >5 m kapı</text><text x="180" y="355" font-size="26" text-anchor="middle" >Çit uzunluğu: 51 m</text></g></svg>