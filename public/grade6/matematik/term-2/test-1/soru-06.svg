<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430" role="img" aria-label="Matematik sorusu"><title>Matematik 2. dönem Test 1 — Soru 6</title><desc>Dış kenarları 160 cm ve 120 cm olan dikdörtgen levhanın içinde bir kenarı 0,8 m olan kare boşluk var. Boşluk dış kenarlara değmiyor; renkli kısım levhanın dolu alanı.</desc><rect width="360" height="430" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#0f172a"><rect x="55" y="90" width="275" height="220" rx="8" fill="#c7d2fe" stroke="#334155" stroke-width="3"/><rect x="128" y="137" width="130" height="130" fill="#ffffff" stroke="#334155" stroke-width="3"/><text x="190" y="55" font-size="26" text-anchor="middle" >160 cm</text><text x="25" y="200" font-size="26" text-anchor="middle" transform="rotate(-90 25 200)">120 cm</text><text x="193" y="186" font-size="26" text-anchor="middle" >Boşluk</text><text x="193" y="224" font-size="26" text-anchor="middle" >0,8 m</text><text x="180" y="355" font-size="26" text-anchor="middle" >İç ve dış sınıra şerit</text><text x="180" y="397" font-size="26" text-anchor="middle" >Yalnız bir yüz boyalı</text></g></svg>