<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720" role="img" aria-label="Matematik sorusu"><title>Matematik 2. dönem Test 1 — Soru 3</title><desc>Başlangıç sayısından sonra sayıyı 2 ile çarp, 5 ekle, sonuç 50’den büyük mü diye kontrol et. Evetse bitir. Hayırsa sonuçtan 3 çıkar ve bu yeni sayıyla 2 ile çarp adımına dön.</desc><rect width="360" height="720" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#0f172a"><rect x="80" y="20" width="200" height="65" rx="8" fill="#eef2ff" stroke="#334155" stroke-width="3"/><text x="180" y="61" font-size="26" text-anchor="middle" >Sayıyı gir</text><line x1="180" y1="85" x2="180" y2="125" stroke="#334155" stroke-width="3" /><polygon points="174,116 180,126 186,116" fill="#334155" stroke="#334155" stroke-width="3"/><rect x="80" y="130" width="200" height="65" rx="8" fill="#eef2ff" stroke="#334155" stroke-width="3"/><text x="180" y="171" font-size="26" text-anchor="middle" >2 ile çarp</text><line x1="180" y1="195" x2="180" y2="220" stroke="#334155" stroke-width="3" /><polygon points="174,211 180,221 186,211" fill="#334155" stroke="#334155" stroke-width="3"/><rect x="80" y="225" width="200" height="65" rx="8" fill="#eef2ff" stroke="#334155" stroke-width="3"/><text x="180" y="266" font-size="26" text-anchor="middle" >5 ekle</text><line x1="180" y1="290" x2="180" y2="315" stroke="#334155" stroke-width="3" /><polygon points="174,306 180,316 186,306" fill="#334155" stroke="#334155" stroke-width="3"/><polygon points="180,320 275,385 180,450 85,385" fill="#fef3c7" stroke="#334155" stroke-width="3"/><text x="180" y="381" font-size="26" text-anchor="middle" >Sonuç</text><text x="180" y="412" font-size="26" text-anchor="middle" >&gt; 50 mi?</text><line x1="180" y1="450" x2="180" y2="495" stroke="#334155" stroke-width="3" /><text x="216" y="478" font-size="26" text-anchor="middle" >Evet</text><polygon points="174,486 180,496 186,486" fill="#334155" stroke="#334155" stroke-width="3"/><rect x="110" y="500" width="140" height="55" rx="8" fill="#dcfce7" stroke="#334155" stroke-width="3"/><text x="180" y="536" font-size="26" text-anchor="middle" >Bitir</text><line x1="85" y1="385" x2="30" y2="385" stroke="#334155" stroke-width="3" /><line x1="30" y1="385" x2="30" y2="620" stroke="#334155" stroke-width="3" /><text x="37" y="469" font-size="26" text-anchor="start" >Hayır</text><line x1="30" y1="620" x2="75" y2="620" stroke="#334155" stroke-width="3" /><polygon points="66,614 76,620 66,626" fill="#334155" stroke="#334155" stroke-width="3"/><rect x="80" y="590" width="200" height="65" rx="8" fill="#eef2ff" stroke="#334155" stroke-width="3"/><text x="180" y="631" font-size="26" text-anchor="middle" >3 çıkar</text><line x1="280" y1="620" x2="330" y2="620" stroke="#334155" stroke-width="3" /><line x1="330" y1="620" x2="330" y2="162" stroke="#334155" stroke-width="3" /><line x1="330" y1="162" x2="285" y2="162" stroke="#334155" stroke-width="3" /><polygon points="294,156 284,162 294,168" fill="#334155" stroke="#334155" stroke-width="3"/></g></svg>