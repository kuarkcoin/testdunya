<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480" role="img" aria-label="Matematik sorusu"><title>Matematik 2. dönem Test 1 — Soru 5</title><desc>30 m eninde ve 20 m boyunda dikdörtgen park. Sol alttaki yeşil üçgenin tabanı x m, dik yüksekliği 10 m. Sağ üstteki ayrık yeşil üçgenin tabanı (x + 4) m, dik yüksekliği 15 m. Geriye kalan taş kaplı alan 420 m².</desc><rect width="360" height="480" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#0f172a"><rect x="50" y="105" width="280" height="260" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="3"/><polygon points="50,365 162,365 50,235" fill="#86efac" stroke="#334155" stroke-width="3"/><polygon points="180,105 330,105 330,300" fill="#86efac" stroke="#334155" stroke-width="3"/><text x="190" y="40" font-size="26" text-anchor="middle" >30 m</text><text x="21" y="235" font-size="26" text-anchor="middle" transform="rotate(-90 21 235)">20 m</text><text x="111" y="405" font-size="26" text-anchor="middle" >x m</text><text x="245" y="88" font-size="26" text-anchor="middle" >(x + 4) m</text><text x="83" y="315" font-size="26" text-anchor="middle" transform="rotate(-90 83 315)">10 m</text><text x="296" y="203" font-size="26" text-anchor="middle" transform="rotate(-90 296 203)">15 m</text><line x1="50" y1="351" x2="64" y2="351" stroke="#334155" stroke-width="3" /><line x1="64" y1="351" x2="64" y2="365" stroke="#334155" stroke-width="3" /><line x1="316" y1="105" x2="316" y2="119" stroke="#334155" stroke-width="3" /><line x1="316" y1="119" x2="330" y2="119" stroke="#334155" stroke-width="3" /><text x="212" y="330" font-size="26" text-anchor="middle" >420 m²</text><text x="180" y="458" font-size="26" text-anchor="middle" >Şekil ölçekli değildir.</text></g></svg>