<svg xmlns="http://www.w3.org/2000/svg" width="360" height="450" viewBox="0 0 360 450" role="img">
<title>İki üçgenden oluşan tabela</title>
<rect x="0" y="0" width="360" height="450" rx="16" fill="#ffffff"/>
<g font-family="DejaVu Sans, sans-serif" font-size="26" fill="#0f172a" stroke-linecap="round" stroke-linejoin="round">
<text x="180" y="40" text-anchor="middle">Tabela</text>
<polygon points="60,200 180,100 300,200" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<polygon points="60,200 180,340 300,200" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
<line x1="180" y1="100" x2="180" y2="340" stroke="#0f172a" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M180 188 H192 V200" fill="none" stroke="#0f172a" stroke-width="2"/>
<text x="225" y="177" text-anchor="middle">5 cm</text>
<text x="225" y="244" text-anchor="middle">7 cm</text>
<text x="38" y="209" text-anchor="middle">A</text>
<text x="322" y="209" text-anchor="middle">B</text>
<text x="180" y="410" text-anchor="middle">AB = 12 cm</text>
</g>
</svg>
