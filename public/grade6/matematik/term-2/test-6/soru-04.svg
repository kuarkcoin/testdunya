<line x1="55" y1="222" x2="235" y2="222" stroke="#0f172a" stroke-width="2"/><line x1="55" y1="216" x2="55" y2="228" stroke="#0f172a" stroke-width="2"/><line x1="235" y1="216" x2="235" y2="228" stroke="#0f172a" stroke-width="2"/>
