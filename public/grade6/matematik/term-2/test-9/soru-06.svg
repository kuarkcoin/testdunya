<svg xmlns="http://www.w3.org/2000/svg" width="360" height="410" viewBox="0 0 360 410"><title>Tabloda 1. adım 2 kart, 2. adım 5 kart, 3. adım 9 kart, 4. adım 14 kart olarak verilmiştir.</title><rect width="360" height="410" rx="20" fill="#f8fafc"/><g font-family="DejaVu Sans,sans-serif" font-size="28" fill="#172554"><text x="180" y="45" text-anchor="middle">KART ÖRÜNTÜSÜ</text><rect x="35" y="75" width="290" height="65" fill="#e0e7ff"/><text x="180" y="118" text-anchor="middle">1. adım: 2 kart</text><rect x="35" y="150" width="290" height="65" fill="#f1f5f9"/><text x="180" y="193" text-anchor="middle">2. adım: 5 kart</text><rect x="35" y="225" width="290" height="65" fill="#e0e7ff"/><text x="180" y="268" text-anchor="middle">3. adım: 9 kart</text><rect x="35" y="300" width="290" height="65" fill="#f1f5f9"/><text x="180" y="343" text-anchor="middle">4. adım: 14 kart</text></g></svg>