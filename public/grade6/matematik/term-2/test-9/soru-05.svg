<svg xmlns="http://www.w3.org/2000/svg" width="360" height="600" viewBox="0 0 360 600"><title>Üstte dikdörtgen 12 cm genişlik, 8 cm yükseklik. Altta paralelkenar taban 14 cm, dik yükseklik 5 cm, eğik kenar x. Çevreleri eşit.</title><rect width="360" height="600" rx="20" fill="#f8fafc"/><g font-family="DejaVu Sans,sans-serif" font-size="28" fill="#172554"><rect x="72" y="65" width="216" height="144" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="180" y="45" text-anchor="middle">12 cm</text><text x="180" y="250" text-anchor="middle">Yükseklik: 8 cm</text><path d="M20 480 H272 L331.699 390 H79.699Z" fill="#fef3c7" stroke="#a16207" stroke-width="3"/><path d="M79.699 390 V480" stroke="#475569" stroke-width="3" stroke-dasharray="7 5"/><path d="M79.699 465 H94.699 V480" fill="none" stroke="#475569"/><text x="180" y="530" text-anchor="middle">Taban: 14 cm</text><text x="180" y="435" text-anchor="middle">5 cm</text><text x="30" y="430" text-anchor="middle">x</text><text x="180" y="575" text-anchor="middle">Çevreleri eşit</text></g></svg>