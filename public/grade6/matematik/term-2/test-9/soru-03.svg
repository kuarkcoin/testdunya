<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350"><title>Bir kartonun alanı 3 dm², diğerinin alanı 40 cm². Kartonlar birbirinden ayrı gösterilmiş.</title><rect width="360" height="350" rx="20" fill="#f8fafc"/><g font-family="DejaVu Sans,sans-serif" font-size="28" fill="#172554"><rect x="40" y="30" width="280" height="140" fill="#c7d2fe" stroke="#4338ca"/><text x="180" y="115" text-anchor="middle">3 dm²</text><rect x="105" y="215" width="150" height="85" fill="#fed7aa" stroke="#c2410c"/><text x="180" y="269" text-anchor="middle">40 cm²</text></g></svg>