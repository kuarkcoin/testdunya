<svg xmlns="http://www.w3.org/2000/svg" width="360" height="310" viewBox="0 0 360 310"><title>Kalem kutusunda başlangıç 20 kalem, verilen n kalem, kalan 20 eksi n kalem olarak yazılı.</title><rect width="360" height="310" rx="20" fill="#f8fafc"/><g font-family="DejaVu Sans,sans-serif" font-size="28" fill="#172554"><rect x="25" y="35" width="310" height="240" rx="18" fill="#fef3c7"/><text x="180" y="90" text-anchor="middle">Başlangıç: 20</text><text x="180" y="155" text-anchor="middle">Verilen: n</text><text x="180" y="220" text-anchor="middle">Kalan: 20 − n</text></g></svg>