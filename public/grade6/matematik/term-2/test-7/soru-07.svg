<svg xmlns="http://www.w3.org/2000/svg" width="360" height="700" viewBox="0 0 360 700" role="img">
<title>İki sayılı çıkarma algoritması</title>
<desc>Başlangıç kutuları N ve 18. Her turda sayılar eşitse durulur; değilse büyükten küçük çıkarılır, yalnız büyük sayının kutusu değiştirilir. Tam üçüncü turun sonunda her iki kutuda 6 vardır.</desc>
<rect width="360" height="700" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="180" y="38" font-size="28" text-anchor="middle" fill="#183153" >Başlangıç</text><rect x="45" y="64" width="110" height="78" fill="#dbeafe" stroke="#183153" stroke-width="2" /><rect x="205" y="64" width="110" height="78" fill="#dbeafe" stroke="#183153" stroke-width="2" /><text x="100" y="115" font-size="34" text-anchor="middle" fill="#183153" >N</text><text x="260" y="115" font-size="34" text-anchor="middle" fill="#183153" >18</text><text x="180" y="195" font-size="27" text-anchor="middle" fill="#183153" >Her tur: tek çıkarma</text><rect x="20" y="222" width="320" height="245" fill="#f8fafc" stroke="#183153" stroke-width="2" rx="12"/><text x="180" y="260" font-size="26" text-anchor="middle" fill="#183153" >Sayılar eşitse dur.</text><text x="180" y="305" font-size="27" text-anchor="middle" fill="#183153" >Değilse büyükten</text><text x="180" y="342" font-size="27" text-anchor="middle" fill="#183153" >küçüğü çıkar.</text><text x="180" y="395" font-size="26" text-anchor="middle" fill="#183153" >Yalnız büyük sayının</text><text x="180" y="432" font-size="26" text-anchor="middle" fill="#183153" >kutusunu değiştir.</text><line x1="180" y1="479" x2="180" y2="520" stroke="#183153" stroke-width="2.5" /><polygon points="172,510 188,510 180,526" fill="#183153" stroke="#183153" stroke-width="2.5" /><text x="180" y="565" font-size="28" text-anchor="middle" fill="#183153" >3. turun sonu</text><rect x="45" y="589" width="110" height="78" fill="#dcfce7" stroke="#183153" stroke-width="2" /><rect x="205" y="589" width="110" height="78" fill="#dcfce7" stroke="#183153" stroke-width="2" /><text x="100" y="641" font-size="34" text-anchor="middle" fill="#183153" >6</text><text x="260" y="641" font-size="34" text-anchor="middle" fill="#183153" >6</text>
</g>
</svg>
