<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img">
<title>Üçgen kartonun ölçüleri</title>
<desc>Üçgenin yatay tabanı 8 cm, kesikli dik yüksekliği 6 cm.</desc>
<rect width="360" height="360" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
