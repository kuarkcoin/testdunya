<svg xmlns="http://www.w3.org/2000/svg" width="360" height="710" viewBox="0 0 360 710" role="img">
<title>Köşesi içeri katlanan dikdörtgen kâğıt</title>
<desc>Başlangıçtaki kâğıt 12 cm ile 8 cm boyutlarında dikdörtgen. Sağ üstteki dik üçgenin dik kenarları 4 cm ve 4 cm. Bu köşe kesikli çizgiden içeri katlanınca aynı büyüklükte turuncu iki katlı üçgen oluşur; kalan mavi bölge tek kattır.</desc>
<rect width="360" height="710" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="180" y="36" font-size="28" text-anchor="middle" fill="#183153" >1. Katlamadan önce</text><rect x="45" y="110" width="240" height="160" fill="#dbeafe" stroke="#183153" stroke-width="2" /><polygon points="205,110 285,110 285,190" fill="#fed7aa" stroke="#183153" stroke-width="2.5" /><line x1="205" y1="110" x2="285" y2="190" stroke="#ffffff" stroke-width="4"/><line x1="205" y1="110" x2="285" y2="190" stroke="#183153" stroke-width="2.5" stroke-dasharray="6 5"/><text x="165" y="72" font-size="28" text-anchor="middle" fill="#183153" >12 cm</text><text x="245" y="100" font-size="26" text-anchor="middle" fill="#183153" >4 cm</text><text x="320" y="163" font-size="26" text-anchor="middle" fill="#183153" transform="rotate(90 320 163)">4 cm</text><text x="25" y="195" font-size="26" text-anchor="middle" fill="#183153" transform="rotate(-90 25 195)">8 cm</text><text x="180" y="350" font-size="27" text-anchor="middle" fill="#183153" >2. Katlandıktan sonra</text><polygon points="45,420 205,420 285,500 285,580 45,580" fill="#dbeafe" stroke="#183153" stroke-width="2.5" /><polygon points="205,420 285,500 205,500" fill="#fed7aa" stroke="#183153" stroke-width="2.5" /><line x1="205" y1="420" x2="285" y2="500" stroke="#ffffff" stroke-width="4"/><line x1="205" y1="420" x2="285" y2="500" stroke="#183153" stroke-width="2.5" stroke-dasharray="6 5"/><text x="180" y="634" font-size="28" text-anchor="middle" fill="#183153" >Turuncu: iki kat</text><text x="180" y="677" font-size="28" text-anchor="middle" fill="#183153" >Mavi: tek kat</text>
</g>
</svg>
