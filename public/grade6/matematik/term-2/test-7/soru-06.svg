<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480" role="img">
<title>Havuzlu bahçeyi ayıran sınır</title>
<desc>20 m genişlik ve 12 m yükseklikte dikdörtgen bahçe. Üst kenardaki P sol üst köşeden 6 m uzakta. PQ sınırı alt kenardaki Q’ya uzanıyor; R sağ alt köşe. Sol bölümün sol alt köşesinde 6 m × 4 m dikdörtgen havuz bulunuyor.</desc>
<rect width="360" height="480" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="180" y="38" font-size="28" text-anchor="middle" fill="#183153" >Dikdörtgen bahçe</text><polygon points="36,130 114,130 244,286 36,286" fill="#dcfce7" stroke="#183153" stroke-width="2.5" /><polygon points="114,130 296,130 296,286 244,286" fill="#dbeafe" stroke="#183153" stroke-width="2.5" /><rect x="36" y="234" width="78" height="52" fill="#ffffff" stroke="#183153" stroke-width="2" /><text x="75" y="270" font-size="28" text-anchor="middle" fill="#183153" >H</text><text x="79" y="199" font-size="26" text-anchor="middle" fill="#183153" >Sol</text><text x="233" y="199" font-size="26" text-anchor="middle" fill="#183153" >Sağ</text><text x="114" y="122" font-size="26" text-anchor="middle" fill="#183153" >P</text><text x="244" y="316" font-size="26" text-anchor="middle" fill="#183153" >Q</text><text x="296" y="316" font-size="26" text-anchor="middle" fill="#183153" >R</text><line x1="36" y1="88" x2="114" y2="88" stroke="#183153" stroke-width="2.5" /><line x1="36" y1="80" x2="36" y2="96" stroke="#183153" stroke-width="2.5" /><line x1="114" y1="80" x2="114" y2="96" stroke="#183153" stroke-width="2.5" /><text x="75" y="73" font-size="26" text-anchor="middle" fill="#183153" >6 m</text><line x1="317" y1="130" x2="317" y2="286" stroke="#183153" stroke-width="2.5" /><line x1="309" y1="130" x2="325" y2="130" stroke="#183153" stroke-width="2.5" /><line x1="309" y1="286" x2="325" y2="286" stroke="#183153" stroke-width="2.5" /><text x="342" y="208" font-size="26" text-anchor="middle" fill="#183153" transform="rotate(-90 342 208)">12 m</text><line x1="36" y1="353" x2="296" y2="353" stroke="#183153" stroke-width="2.5" /><line x1="36" y1="345" x2="36" y2="361" stroke="#183153" stroke-width="2.5" /><line x1="296" y1="345" x2="296" y2="361" stroke="#183153" stroke-width="2.5" /><text x="166" y="390" font-size="28" text-anchor="middle" fill="#183153" >20 m</text><text x="180" y="441" font-size="27" text-anchor="middle" fill="#183153" >Havuz: 6 m × 4 m</text>
</g>
</svg>
