<svg xmlns="http://www.w3.org/2000/svg" width="360" height="460" viewBox="0 0 360 460" role="img">
<title>Tabana paralel hareket eden üçgen tepesi</title>
<desc>AB tabanı 8 cm. C ve C′, AB’ye paralel aynı üst doğru üzerindedir. İki doğru arasındaki dik uzaklık 6 cm. ABC ve ABC′ üçgenleri aynı tabanı paylaşır.</desc>
<rect width="360" height="460" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="180" y="40" font-size="28" text-anchor="middle" fill="#183153" >Kayan tepe noktası</text><line x1="35" y1="135" x2="325" y2="135" stroke="#183153" stroke-width="2.5" /><polygon points="65,285 265,285 105,135" fill="#bfdbfe" stroke="#183153" stroke-width="2.5" fill-opacity="0.6"/><polygon points="65,285 265,285 290,135" fill="#fed7aa" stroke="#183153" stroke-width="2.5" fill-opacity="0.55"/><line x1="65" y1="285" x2="265" y2="285" stroke="#183153" stroke-width="2.5" /><line x1="175" y1="135" x2="175" y2="285" stroke="#183153" stroke-width="2.5" stroke-dasharray="7 6"/><line x1="175" y1="269" x2="191" y2="269" stroke="#183153" stroke-width="2.5" /><line x1="191" y1="269" x2="191" y2="285" stroke="#183153" stroke-width="2.5" /><text x="105" y="115" font-size="28" text-anchor="middle" fill="#183153" >C</text><text x="290" y="115" font-size="28" text-anchor="middle" fill="#183153" >C′</text><text x="48" y="314" font-size="28" text-anchor="middle" fill="#183153" >A</text><text x="283" y="314" font-size="28" text-anchor="middle" fill="#183153" >B</text><line x1="31" y1="135" x2="31" y2="285" stroke="#183153" stroke-width="2.5"/><line x1="24" y1="135" x2="38" y2="135" stroke="#183153" stroke-width="2.5"/><line x1="24" y1="285" x2="38" y2="285" stroke="#183153" stroke-width="2.5"/><text x="20" y="210" font-size="26" text-anchor="middle" fill="#183153" transform="rotate(-90 20 210)">6 cm</text><text x="165" y="339" font-size="28" text-anchor="middle" fill="#183153" >8 cm</text><text x="180" y="391" font-size="26" text-anchor="middle" fill="#183153" >Üst doğru, AB’ye</text><text x="180" y="425" font-size="26" text-anchor="middle" fill="#183153" >paraleldir.</text>
</g>
</svg>
