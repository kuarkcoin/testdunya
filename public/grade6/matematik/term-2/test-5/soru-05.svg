<polygon points="80,100 80,340 140,340" fill="#fed7aa" stroke="#0f172a" stroke-width="2.5"/><polygon points="80,100 140,340 290,340" fill="#bfdbfe" stroke="#0f172a" stroke-width="2.5"/><rect x="80" y="340" width="60" height="60" rx="0" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><line x1="80" y1="100" x2="80" y2="340" stroke="#0f172a" stroke-width="3" stroke-dasharray="7 6"/><line x1="80" y1="328" x2="92" y2="328" stroke="#0f172a" stroke-width="3" /><line x1="92" y1="328" x2="92" y2="340" stroke="#0f172a" stroke-width="3" /><text x="80" y="81" text-anchor="middle" font-size="26" font-weight="700" fill="#172554" >A</text><text x="58" y="348" text-anchor="middle" font-size="26" font-weight="700" fill="#172554" >D</text><text x="151" y="334" text-anchor="middle" font-size="26" font-weight="700" fill="#172554" >B</text><text x="308" y="348" text-anchor="middle" font-size="26" font-weight="700" fill="#172554" >C</text><text x="170" y="267" text-anchor="middle" font-size="32" font-weight="700" fill="#2563eb" >?</text><text x="110" y="379" text-anchor="middle" font-size="26" font-weight="600" fill="#115e59" >36</text><line x1="80" y1="438" x2="290" y2="438" stroke="#94a3b8" stroke-width="2" /><line x1="80" y1="430" x2="80" y2="446" stroke="#94a3b8" stroke-width="2" /><line x1="290" y1="430" x2="290" y2="446" stroke="#94a3b8" stroke-width="2" /><text x="185" y="474" text-anchor="middle" font-size="28" font-weight="600" fill="#0f172a" >21 cm</text><text x="180" y="527" text-anchor="middle" font-size="27" font-weight="600" fill="#0f172a" >ADB alanı: 72 cm²</text><text x="180" y="577" text-anchor="middle" font-size="27" font-weight="600" fill="#0f172a" >Kare alanı: 36 cm²</text>
