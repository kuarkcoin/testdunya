<svg xmlns="http://www.w3.org/2000/svg" width="360" height="620" viewBox="0 0 360 620" role="img" font-family="Arial, sans-serif">
<title>Matematik Test 5 — Soru 5: DIŞTAKİ YÜKSEKLİK</title>
<desc>A noktası D’nin tam üstünde. D, B ve C yatay doğru üzerinde soldan sağa sıralı; AD ile DC arasında dik açı işareti var. A, B ve C birleştirilmiş; ADB turuncu, ABC mavi. DB’nin altına bir kare çizilmiş. Ölçü anahtarı: karenin alanı 36 cm²; ADB’nin alanı 72 cm²; DC’nin tamamı 21 cm. AD kesikli çizgiyle üçgenin dış yüksekliği olarak gösteriliyor.</desc>
