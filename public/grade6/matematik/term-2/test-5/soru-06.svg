<svg xmlns="http://www.w3.org/2000/svg" width="360" height="500" viewBox="0 0 360 500" role="img" font-family="Arial, sans-serif">
<title>Matematik Test 5 — Soru 6: İÇ İÇE KARELER</title>
<desc>En dıştaki kare yatay ve düşey kenarlı. Birinci iç kare dış karenin dört kenarının orta noktalarından geçiyor. İkinci iç kare birinci karenin, üçüncü ve en küçük iç kare de ikincinin kenar orta noktalarını birleştiriyor. Dört kare iç içe; en küçük kare turuncu. Altta turuncu alan 0,045 m² yazıyor. Her yeni köşe önceki karenin bir kenarının orta noktasıdır.</desc>
<rect x="3" y="3" width="354" height="494" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2.5"/><rect x="4" y="4" width="352" height="51" rx="14" fill="#172554" stroke="#172554" stroke-width="2.5"/><text x="180" y="39" text-anchor="middle" font-size="26" font-weight="700" fill="#fff" >İÇ İÇE KARELER</text>
<polygon points="60,100 300,100 300,340 60,340" fill="#f8fafc" stroke="#2563eb" stroke-width="3"/><polygon points="180.0,100.0 300.0,220.0 180.0,340.0 60.0,220.0" fill="#e0e7ff" stroke="#2563eb" stroke-width="3"/><polygon points="240.0,160.0 240.0,280.0 120.0,280.0 120.0,160.0" fill="#fff" stroke="#2563eb" stroke-width="3"/><polygon points="240.0,220.0 180.0,280.0 120.0,220.0 180.0,160.0" fill="#fed7aa" stroke="#2563eb" stroke-width="3"/><text x="180" y="401" text-anchor="middle" font-size="27" font-weight="700" fill="#172554" >Turuncu alan</text><text x="180" y="446" text-anchor="middle" font-size="30" font-weight="700" fill="#172554" >0,045 m²</text>
</svg>
