<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430" role="img" font-family="Arial, sans-serif">
<title>Matematik Test 5 — Soru 3: İKİLİ TOPLAMA</title>
<desc>Üstte soldan sağa A, B, C, D, E kutuları var. Altta dört kutuda soldan sağa 29, 41, 53, 67 yazıyor. Her alt kutu, üstteki komşu iki kutuya çizgilerle bağlı: 29 A ve B’ye, 41 B ve C’ye, 53 C ve D’ye, 67 D ve E’ye. Üstteki beş sayının toplamı 119.</desc>
