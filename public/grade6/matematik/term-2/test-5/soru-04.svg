<svg xmlns="http://www.w3.org/2000/svg" width="360" height="560" viewBox="0 0 360 560" role="img" font-family="Arial, sans-serif">
<title>Matematik Test 5 — Soru 4: PARALELKENARDA ALAN</title>
<desc>ABCD paralelkenarında A sol üstte, B sağ üstte, C sağ altta, D sol altta. İçteki P dört köşeye bağlı. Üst ABP üçgeninin alanı 24 cm², alt DCP üçgeninin alanı 16 cm², sol DAP üçgeninin alanı 14 cm². Sağ BPC üçgeni mavi ve alanı soru işareti. Alanlar alttaki köşe adlarıyla eşleştirilmiş anahtarda da yazıyor.</desc>
<rect x="3" y="3" width="354" height="554" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2.5"/><rect x="4" y="4" width="352" height="51" rx="14" fill="#172554" stroke="#172554" stroke-width="2.5"/><text x="180" y="39" text-anchor="middle" font-size="26" font-weight="700" fill="#fff" >PARALELKENARDA ALAN</text>
<polygon points="70,120 310,120 130,240" fill="#e0e7ff" stroke="#0f172a" stroke-width="2.5"/><polygon points="310,120 270,320 130,240" fill="#bfdbfe" stroke="#0f172a" stroke-width="2.5"/><polygon points="270,320 30,320 130,240" fill="#fef3c7" stroke="#0f172a" stroke-width="2.5"/><polygon points="30,320 70,120 130,240" fill="#fed7aa" stroke="#0f172a" stroke-width="2.5"/><text x="60" y="101" text-anchor="middle" font-size="26" font-weight="700" fill="#172554" >A</text><text x="315" y="101" text-anchor="middle" font-size="26" font-weight="700" fill="#172554" >B</text><text x="282" y="351" text-anchor="middle" font-size="26" font-weight="700" fill="#172554" >C</text><text x="18" y="351" text-anchor="middle" font-size="26" font-weight="700" fill="#172554" >D</text><text x="138" y="239" text-anchor="middle" font-size="26" font-weight="700" fill="#172554" >P</text><text x="172" y="161" text-anchor="middle" font-size="27" font-weight="600" fill="#0f172a" >24</text><text x="145" y="293" text-anchor="middle" font-size="27" font-weight="600" fill="#0f172a" >16</text><text x="74" y="230" text-anchor="middle" font-size="27" font-weight="600" fill="#0f172a" >14</text><text x="241" y="233" text-anchor="middle" font-size="32" font-weight="700" fill="#2563eb" >?</text><text x="180" y="400" text-anchor="middle" font-size="26" font-weight="700" fill="#172554" >Alanlar (cm²)</text><text x="180" y="446" text-anchor="middle" font-size="26" font-weight="600" fill="#0f172a" >ABP: 24   DCP: 16</text><text x="180" y="490" text-anchor="middle" font-size="26" font-weight="600" fill="#0f172a" >DAP: 14   BPC: ?</text>
