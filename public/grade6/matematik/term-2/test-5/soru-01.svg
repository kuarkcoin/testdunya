<svg xmlns="http://www.w3.org/2000/svg" width="360" height="570" viewBox="0 0 360 570" role="img" font-family="Arial, sans-serif">
<title>Matematik Test 5 — Soru 1: REZERVASYON KAYITLARI</title>
<desc>Üç rezervasyon kaydı: K kaydında 2 yetişkin, 1 çocuk, toplam 174 TL; L kaydında 1 yetişkin, 3 çocuk, toplam 186 TL; M kaydında 4 yetişkin, 2 çocuk, toplam 330 TL. Her toplamın içinde bir kez alınan aynı sabit rezervasyon ücreti vardır.</desc>
<rect x="3" y="3" width="354" height="564" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2.5"/><rect x="4" y="4" width="352" height="51" rx="14" fill="#172554" stroke="#172554" stroke-width="2.5"/><text x="180" y="39" text-anchor="middle" font-size="26" font-weight="700" fill="#fff" >REZERVASYON KAYITLARI</text>
<rect x="20" y="76" width="320" height="128" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2.5"/><text x="45" y="112" text-anchor="middle" font-size="28" font-weight="700" fill="#2563eb" >K</text><text x="305" y="112" text-anchor="end" font-size="29" font-weight="700" fill="#172554" >174 TL</text><line x1="36" y1="124" x2="324" y2="124" stroke="#bfdbfe" stroke-width="2" /><text x="180" y="163" text-anchor="middle" font-size="26" font-weight="600" fill="#0f172a" >2 yetişkin + 1 çocuk</text><rect x="20" y="221" width="320" height="128" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2.5"/><text x="45" y="257" text-anchor="middle" font-size="28" font-weight="700" fill="#2563eb" >L</text><text x="305" y="257" text-anchor="end" font-size="29" font-weight="700" fill="#172554" >186 TL</text><line x1="36" y1="269" x2="324" y2="269" stroke="#bfdbfe" stroke-width="2" /><text x="180" y="308" text-anchor="middle" font-size="26" font-weight="600" fill="#0f172a" >1 yetişkin + 3 çocuk</text><rect x="20" y="366" width="320" height="128" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2.5"/><text x="45" y="402" text-anchor="middle" font-size="28" font-weight="700" fill="#2563eb" >M</text><text x="305" y="402" text-anchor="end" font-size="29" font-weight="700" fill="#172554" >330 TL</text><line x1="36" y1="414" x2="324" y2="414" stroke="#bfdbfe" stroke-width="2" /><text x="180" y="453" text-anchor="middle" font-size="26" font-weight="600" fill="#0f172a" >4 yetişkin + 2 çocuk</text><text x="180" y="536" text-anchor="middle" font-size="26" font-weight="600" fill="#0f172a" >Sabit ücret dâhil</text>
