<title>Matematik Test 5 — Soru 7: ARSA DEĞİŞİMİ</title>
<desc>Dikdörtgen arsanın yatay kenarı 24 m, sol düşey kenarı 18 m. Sol kenarın tamamına bitişik dış yeşil üçgen var; soldaki tepesinden bu kenara çizilen yatay kesikli dikmenin uzunluğu h. Sağ alt köşede çıkarılan turuncu dik üçgenin yatay dik kenarı 12 m, düşey dik kenarı 9 m. Yeni arsa dikdörtgen artı yeşil üçgen eksi turuncu üçgendir.</desc>
