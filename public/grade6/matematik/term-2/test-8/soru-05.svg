<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430"><title>Dış dikdörtgen 10 cm genişlikte ve 8 cm yükseklikte. İçte dikdörtgen boşluk var; dört kenarın her birinde sarı çerçeve 1 cm kalınlıkta.</title><rect width="360" height="430" rx="20" fill="#f8fafc"/><g font-family="DejaVu Sans,sans-serif" font-size="28" fill="#172554"><text x="180" y="40" text-anchor="middle">ÇERÇEVE</text><rect x="55" y="100" width="250" height="200" fill="#fbbf24" stroke="#92400e" stroke-width="3"/><rect x="80" y="125" width="200" height="150" fill="#fff" stroke="#92400e" stroke-width="2"/><text x="180" y="85" text-anchor="middle">10 cm</text><text x="180" y="340" text-anchor="middle">Dış yükseklik: 8 cm</text><text x="180" y="385" text-anchor="middle">Her kenarda: 1 cm</text></g></svg>