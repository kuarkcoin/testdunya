<svg xmlns="http://www.w3.org/2000/svg" width="360" height="490" viewBox="0 0 360 490"><title>Yetişkin bileti a TL, çocuk bileti a eksi 4 TL. İndirim yok. İki yetişkin ve üç çocuk bileti toplam 48 TL.</title><rect width="360" height="490" rx="20" fill="#f8fafc"/><g font-family="DejaVu Sans,sans-serif" font-size="28" fill="#172554"><text x="180" y="45" text-anchor="middle">BİLET FİYATLARI</text><rect x="20" y="75" width="320" height="210" rx="18" fill="#e0e7ff"/><text x="180" y="125" text-anchor="middle">Yetişkin: a TL</text><text x="180" y="185" text-anchor="middle">Çocuk: (a − 4) TL</text><text x="180" y="245" text-anchor="middle">İndirim yok</text><rect x="20" y="310" width="320" height="145" rx="18" fill="#ffedd5"/><text x="180" y="355" text-anchor="middle">2 yetişkin + 3 çocuk</text><text x="180" y="410" text-anchor="middle">Toplam: 48 TL</text></g></svg>