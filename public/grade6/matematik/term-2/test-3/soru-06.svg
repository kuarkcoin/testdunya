<svg xmlns="http://www.w3.org/2000/svg" width="360" height="610" viewBox="0 0 360 610" role="img">
<title>Bayrak kesim planı</title>
<desc>Üstte kumaşın yatay kenarı 1,7 m, düşey kenarı 1,1 m. Altta iki eş dik üçgen, köşegen boyunca birleşerek 40 cm genişlik ve 30 cm yükseklikte bir dikdörtgen oluşturuyor. Üçgenler farklı renklerde; her biri bir bayrak. 40 cm ve 30 cm ölçüleri dikdörtgenin dik kenarlarına ait.</desc>
<rect x="0" y="0" width="360" height="610" rx="16" fill="#ffffff"/>
<g font-family="Arial, sans-serif" font-weight="700">
<text x="180" y="40" font-size="26" fill="#172554" text-anchor="middle" >Bayrak kesim planı</text><line x1="94" y1="93" x2="315" y2="93" stroke="#475569" stroke-width="2"/><line x1="90" y1="87" x2="98" y2="99" stroke="#475569" stroke-width="2"/><line x1="311" y1="87" x2="319" y2="99" stroke="#475569" stroke-width="2"/><text x="204" y="79" font-size="26" fill="#172554" text-anchor="middle" >1,7 m</text><rect x="94" y="110" width="221" height="143" rx="0" fill="#e0f2fe" stroke="#172554" stroke-width="3"/><text x="58" y="186" font-size="26" fill="#172554" text-anchor="middle" transform="rotate(-90 58 186)">1,1 m</text><text x="180" y="315" font-size="26" fill="#172554" text-anchor="middle" >Bir çift = 2 bayrak</text><text x="200" y="367" font-size="26" fill="#172554" text-anchor="middle" >40 cm</text><polygon points="100,390 300,390 300,540" fill="#bfdbfe" stroke="#172554" stroke-width="3" stroke-linejoin="round"/><polygon points="100,390 100,540 300,540" fill="#fed7aa" stroke="#172554" stroke-width="3" stroke-linejoin="round"/><line x1="288" y1="390" x2="288" y2="402" stroke="#172554" stroke-width="2"/><line x1="288" y1="402" x2="300" y2="402" stroke="#172554" stroke-width="2"/><line x1="100" y1="528" x2="112" y2="528" stroke="#172554" stroke-width="2"/><line x1="112" y1="528" x2="112" y2="540" stroke="#172554" stroke-width="2"/><text x="63" y="470" font-size="26" fill="#172554" text-anchor="middle" transform="rotate(-90 63 470)">30 cm</text><text x="180" y="587" font-size="26" fill="#172554" text-anchor="middle" >Çiftler: aynı yönde</text>
</g>
</svg>
