<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" role="img">
<title>İşlem sırası farkı</title>
<desc>K ve L için başlangıç değerleri k = 1, S = 0. K’de her tur önce S ← S + 2k + 1, sonra k ← k + 1. L’de her tur önce k ← k + 1, sonra S ← S + 2k + 1. Her iki işlem çifti n kez tekrarlanıyor; sonunda S yazdırılıyor.</desc>
<rect x="0" y="0" width="360" height="650" rx="16" fill="#ffffff"/>
<g font-family="Arial, sans-serif" font-weight="700">
<text x="180" y="40" font-size="26" fill="#172554" text-anchor="middle" >İşlem sırası farkı</text><rect x="20" y="65" width="320" height="42" rx="10" fill="#f1f5f9" stroke="none" stroke-width="2"/><text x="180" y="95" font-size="26" fill="#172554" text-anchor="middle" >Her biri: k = 1, S = 0</text><rect x="24" y="125" width="312" height="210" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="3"/><text x="180" y="165" font-size="28" fill="#2563eb" text-anchor="middle" >K — her tur</text><text x="180" y="216" font-size="28" fill="#172554" text-anchor="middle" >S ← S + 2k + 1</text><line x1="180" y1="233" x2="180" y2="253" stroke="#2563eb" stroke-width="3"/><polygon points="172,248 188,248 180,260" fill="#2563eb" stroke="#2563eb" stroke-width="2" stroke-linejoin="round"/><text x="180" y="293" font-size="28" fill="#172554" text-anchor="middle" >k ← k + 1</text><rect x="24" y="355" width="312" height="210" rx="14" fill="#f8fafc" stroke="#7c3aed" stroke-width="3"/><text x="180" y="395" font-size="28" fill="#7c3aed" text-anchor="middle" >L — her tur</text><text x="180" y="446" font-size="28" fill="#172554" text-anchor="middle" >k ← k + 1</text><line x1="180" y1="463" x2="180" y2="483" stroke="#7c3aed" stroke-width="3"/><polygon points="172,478 188,478 180,490" fill="#7c3aed" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round"/><text x="180" y="523" font-size="28" fill="#172554" text-anchor="middle" >S ← S + 2k + 1</text><text x="180" y="612" font-size="26" fill="#172554" text-anchor="middle" >n tur sonunda S yazdır</text>
</g>
</svg>
