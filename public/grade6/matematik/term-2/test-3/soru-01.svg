<svg xmlns="http://www.w3.org/2000/svg" width="360" height="540" viewBox="0 0 360 540" role="img">
<title>Kare çerçeve</title>
<desc>Dört özdeş dikdörtgen, dış kenarı 2 dm olan bir karenin içinde dönerek yerleşiyor. Üstte yatay, sağda düşey, altta yatay, solda düşey bir parça var. Ortada kenarı 40 mm olan kare boşluk kalıyor. Parça sınırları, dış kenarın uzun ve kısa kenar toplamı olduğunu gösteriyor.</desc>
<rect x="0" y="0" width="360" height="540" rx="16" fill="#ffffff"/>
<g font-family="Arial, sans-serif" font-weight="700">
<text x="180" y="40" font-size="26" fill="#172554" text-anchor="middle" >Kare çerçeve</text><line x1="60" y1="100" x2="300" y2="100" stroke="#475569" stroke-width="2"/><line x1="56" y1="94" x2="64" y2="106" stroke="#475569" stroke-width="2"/><line x1="296" y1="94" x2="304" y2="106" stroke="#475569" stroke-width="2"/><text x="180" y="82" font-size="26" fill="#172554" text-anchor="middle" >2 dm</text><polygon points="60,130 204,130 204,226 60,226" fill="#bfdbfe" stroke="#172554" stroke-width="3" stroke-linejoin="round"/><polygon points="204,130 300,130 300,274 204,274" fill="#ddd6fe" stroke="#172554" stroke-width="3" stroke-linejoin="round"/><polygon points="156,274 300,274 300,370 156,370" fill="#a7f3d0" stroke="#172554" stroke-width="3" stroke-linejoin="round"/><polygon points="60,226 156,226 156,370 60,370" fill="#fed7aa" stroke="#172554" stroke-width="3" stroke-linejoin="round"/><rect x="156" y="226" width="48" height="48" rx="0" fill="#ffffff" stroke="#172554" stroke-width="3"/><text x="180" y="259" font-size="28" fill="#172554" text-anchor="middle" >K</text><text x="180" y="424" font-size="26" fill="#172554" text-anchor="middle" >4 özdeş dikdörtgen</text><rect x="24" y="450" width="312" height="65" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="180" y="491" font-size="26" fill="#172554" text-anchor="middle" >K’nin kenarı: 40 mm</text>
</g>
</svg>
