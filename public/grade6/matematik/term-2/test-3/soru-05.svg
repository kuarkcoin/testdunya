<svg xmlns="http://www.w3.org/2000/svg" width="360" height="610" viewBox="0 0 360 610" role="img">
<title>P’nin yer değiştirmesi</title>
<desc>ABCD paralelkenarında alttaki AB tabanı 24 cm, AB ile DC arasındaki dik uzaklık 10 cm. P üstte; PAB ve PDC üçgenlerinin kenarları çizili. P’den dikey olarak 3 cm yukarıda P′ var. AB ve DC yatay, aralarındaki dik yükseklik kesikli ve dik açı işaretli.</desc>
<rect x="0" y="0" width="360" height="610" rx="16" fill="#ffffff"/>
<g font-family="Arial, sans-serif" font-weight="700">
<text x="180" y="40" font-size="26" fill="#172554" text-anchor="middle" >P’nin yer değiştirmesi</text><polygon points="60,485 300,485 330,385 90,385" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-linejoin="round"/><polygon points="200,210 90,385 330,385" fill="#bfdbfe" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/><polygon points="200,210 60,485 300,485" fill="none" stroke="#172554" stroke-width="3" stroke-linejoin="round"/><line x1="90" y1="385" x2="330" y2="385" stroke="#2563eb" stroke-width="3"/><line x1="280" y1="385" x2="280" y2="485" stroke="#475569" stroke-width="2" stroke-dasharray="7 5"/><line x1="270" y1="485" x2="270" y2="475" stroke="#475569" stroke-width="2"/><line x1="270" y1="475" x2="280" y2="475" stroke="#475569" stroke-width="2"/><text x="234" y="440" font-size="26" fill="#172554" text-anchor="middle" >10 cm</text><circle cx="200" cy="210" r="4" fill="#172554"/><circle cx="200" cy="180" r="4" fill="#7c3aed"/><line x1="200" y1="204" x2="200" y2="185" stroke="#7c3aed" stroke-width="3"/><polygon points="194,190 206,190 200,179" fill="#7c3aed" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round"/><text x="169" y="232" font-size="28" fill="#172554" text-anchor="middle" >P</text><text x="187" y="161" font-size="28" fill="#7c3aed" text-anchor="middle" >P′</text><text x="255" y="202" font-size="26" fill="#7c3aed" text-anchor="middle" >3 cm</text><text x="48" y="519" font-size="26" fill="#172554" text-anchor="middle" >A</text><text x="304" y="519" font-size="26" fill="#172554" text-anchor="middle" >B</text><text x="342" y="378" font-size="26" fill="#172554" text-anchor="middle" >C</text><text x="74" y="378" font-size="26" fill="#172554" text-anchor="middle" >D</text><line x1="60" y1="548" x2="300" y2="548" stroke="#475569" stroke-width="2"/><line x1="56" y1="542" x2="64" y2="554" stroke="#475569" stroke-width="2"/><line x1="296" y1="542" x2="304" y2="554" stroke="#475569" stroke-width="2"/><text x="180" y="576" font-size="26" fill="#172554" text-anchor="middle" >24 cm</text><text x="180" y="100" font-size="26" fill="#172554" text-anchor="middle" >Alan(PAB) = 330 cm²</text>
</g>
</svg>
