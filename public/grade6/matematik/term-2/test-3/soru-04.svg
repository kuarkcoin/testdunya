<svg xmlns="http://www.w3.org/2000/svg" width="360" height="680" viewBox="0 0 360 680" role="img">
<title>İki katlama, tek kesim</title>
<desc>Üstte kenarları 0,8 m ve 60 cm olan dikdörtgen kâğıt, yatay ve düşey orta kat çizgileriyle gösteriliyor. Altta iki katlamadan sonraki dört katlı dikdörtgen var. Katlı iki kenarın birleştiği sol üst köşede kesilecek dik üçgen turuncu; dik kenarları 12 cm ve 10 cm. Bu iki kenar katlı kenarlar olarak işaretlenmiş.</desc>
<rect x="0" y="0" width="360" height="680" rx="16" fill="#ffffff"/>
<g font-family="Arial, sans-serif" font-weight="700">
<text x="180" y="40" font-size="26" fill="#172554" text-anchor="middle" >İki katlama, tek kesim</text><line x1="130" y1="80" x2="290" y2="80" stroke="#475569" stroke-width="2"/><line x1="126" y1="74" x2="134" y2="86" stroke="#475569" stroke-width="2"/><line x1="286" y1="74" x2="294" y2="86" stroke="#475569" stroke-width="2"/><text x="210" y="67" font-size="26" fill="#172554" text-anchor="middle" >0,8 m</text><rect x="130" y="100" width="160" height="120" rx="0" fill="#dbeafe" stroke="#172554" stroke-width="3"/><line x1="210" y1="100" x2="210" y2="220" stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 5"/><line x1="130" y1="160" x2="290" y2="160" stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 5"/><text x="92" y="160" font-size="26" fill="#172554" text-anchor="middle" transform="rotate(-90 92 160)">60 cm</text><text x="180" y="255" font-size="26" fill="#172554" text-anchor="middle" >İki kez ikiye katla</text><line x1="220" y1="266" x2="220" y2="277" stroke="#475569" stroke-width="3"/><polygon points="212,274 228,274 220,285" fill="#475569" stroke="#475569" stroke-width="2" stroke-linejoin="round"/><rect x="140" y="300" width="160" height="120" rx="0" fill="#dbeafe" stroke="#172554" stroke-width="3"/><polygon points="140,300 188,300 140,340" fill="#fed7aa" stroke="#ea580c" stroke-width="2" stroke-linejoin="round"/><line x1="140" y1="300" x2="300" y2="300" stroke="#7c3aed" stroke-width="5"/><line x1="140" y1="300" x2="140" y2="420" stroke="#7c3aed" stroke-width="5"/><text x="180" y="455" font-size="26" fill="#172554" text-anchor="middle" >Mor: katlı kenarlar</text><text x="180" y="493" font-size="26" fill="#172554" text-anchor="middle" >Kesilecek üçgen</text><polygon points="150,532 294,532 150,652" fill="#fed7aa" stroke="#ea580c" stroke-width="3" stroke-linejoin="round"/><line x1="150" y1="544" x2="162" y2="544" stroke="#172554" stroke-width="2"/><line x1="162" y1="532" x2="162" y2="544" stroke="#172554" stroke-width="2"/><text x="226" y="523" font-size="26" fill="#172554" text-anchor="middle" >12 cm</text><text x="90" y="598" font-size="26" fill="#172554" text-anchor="middle" >10 cm</text>
</g>
</svg>
