<svg xmlns="http://www.w3.org/2000/svg" width="360" height="580" viewBox="0 0 360 580" role="img">
<title>Hatalı makine kaydı</title>
<desc>Makinenin kuralı: girdiyi a ile çarp, ardından b ekle. a ve b sabit pozitif tam sayılar. İki sütunlu kayıt tablosunda Girdi ve Sonuç başlıkları var. Satırlar sırayla 2 → 19, 7 → 49, 4 → 31, 9 → 60. Alt not: Tam bir sonuç yanlış yazılmıştır.</desc>
<rect x="0" y="0" width="360" height="580" rx="16" fill="#ffffff"/>
<g font-family="Arial, sans-serif" font-weight="700">
<text x="180" y="40" font-size="26" fill="#172554" text-anchor="middle" >Hatalı makine kaydı</text><rect x="24" y="68" width="312" height="110" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/><text x="180" y="112" font-size="30" fill="#172554" text-anchor="middle" >Girdi × a + b</text><text x="180" y="153" font-size="26" fill="#172554" text-anchor="middle" >a ve b: sabit</text><rect x="30" y="210" width="300" height="52" rx="0" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/><rect x="30" y="262" width="300" height="52" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><rect x="30" y="314" width="300" height="52" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><rect x="30" y="366" width="300" height="52" rx="0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><rect x="30" y="418" width="300" height="52" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><line x1="160" y1="210" x2="160" y2="470" stroke="#94a3b8" stroke-width="2"/><text x="95" y="245" font-size="26" fill="#172554" text-anchor="middle" >Girdi</text><text x="245" y="245" font-size="26" fill="#172554" text-anchor="middle" >Sonuç</text><text x="95" y="297" font-size="28" fill="#172554" text-anchor="middle" >2</text><text x="245" y="297" font-size="28" fill="#172554" text-anchor="middle" >19</text><text x="95" y="349" font-size="28" fill="#172554" text-anchor="middle" >7</text><text x="245" y="349" font-size="28" fill="#172554" text-anchor="middle" >49</text><text x="95" y="401" font-size="28" fill="#172554" text-anchor="middle" >4</text><text x="245" y="401" font-size="28" fill="#172554" text-anchor="middle" >31</text><text x="95" y="453" font-size="28" fill="#172554" text-anchor="middle" >9</text><text x="245" y="453" font-size="28" fill="#172554" text-anchor="middle" >60</text><text x="180" y="524" font-size="26" fill="#172554" text-anchor="middle" >Yalnız 1 sonuç yanlış.</text><text x="180" y="562" font-size="26" fill="#172554" text-anchor="middle" >Doğru kuralı belirle.</text>
</g>
</svg>
