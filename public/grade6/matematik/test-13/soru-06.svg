<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" font-family="Arial, sans-serif"><title>Matematik Test 13 Soru 6</title><desc>ABC üçgeninde D, B ile C arasında. AB, AD ve DC eşitlik çizgileriyle işaretli. CAD 24°; BAC soruluyor.</desc><rect width="360" height="650" fill="#f8fafc"/><text x="180" y="42" font-size="26" text-anchor="middle" fill="#172554">AB = AD = DC</text><polygon points="109.70432723693702,240.8226209427127 29.408654473874037,330 310,330" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><line x1="109.70432723693702" y1="240.8226209427127" x2="190" y2="330" stroke="#2563eb" stroke-width="3" /><text x="97.70432723693702" y="222.8226209427127" font-size="26" text-anchor="middle" fill="#172554">A</text><text x="29.408654473874037" y="365" font-size="26" text-anchor="middle" fill="#172554">B</text><text x="190" y="365" font-size="26" text-anchor="middle" fill="#172554">D</text><text x="325" y="365" font-size="26" text-anchor="middle" fill="#172554">C</text><line x1="74.7585046337473" y1="290.0952247158683" x2="64.35447707706376" y2="280.72739622684435" stroke="#ea580c" stroke-width="3" /><line x1="155.05417739681027" y1="280.72739622684435" x2="144.65014984012677" y2="290.0952247158683" stroke="#ea580c" stroke-width="3" /><line x1="250.0" y1="323.0" x2="250.0" y2="337.0" stroke="#ea580c" stroke-width="3" /><text x="180" y="435" font-size="26" text-anchor="middle" fill="#172554">CAD = 24°</text><text x="180" y="485" font-size="26" text-anchor="middle" fill="#172554">B, D, C doğrusal</text><text x="180" y="555" font-size="26" text-anchor="middle" fill="#172554">BAC = ?</text><path d="M169.08478198370608 267.2605027426397 A65 65 0 0 1 153.1978166502628 289.1270345987433" fill="none" stroke="#ea580c" stroke-width="3"/></svg>