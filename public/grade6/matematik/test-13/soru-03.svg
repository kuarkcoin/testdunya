<svg xmlns="http://www.w3.org/2000/svg" width="360" height="700" viewBox="0 0 360 700" font-family="Arial, sans-serif"><title>Matematik Test 13 Soru 3</title><desc>Paralelkenarın tabanı 1,8 m, dik yüksekliği 120 cm. Alt tabanın 60 cm uzunluğundaki parçasını taban alan ve üst kenarda tepe noktası bulunan beyaz üçgen boş bırakılır. Kalan bölge mavi.</desc><rect width="360" height="700" fill="#f8fafc"/><text x="180" y="42" font-size="26" text-anchor="middle" fill="#172554">KAPLANACAK ZEMİN</text><polygon points="30,340 270,340 330,180 90,180" fill="#93c5fd" stroke="#2563eb" stroke-width="3"/><polygon points="110,340 190,340 210,180" fill="#fff" stroke="#2563eb" stroke-width="3"/><line x1="90" y1="180" x2="90" y2="340" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" /><polygon points="90,325 105,325 105,340 90,340" fill="#fff" stroke="#64748b" stroke-width="3"/><text x="180" y="390" font-size="26" text-anchor="middle" fill="#172554">Taban: 1,8 m</text><text x="180" y="430" font-size="26" text-anchor="middle" fill="#172554">Dik yükseklik: 120 cm</text><text x="180" y="470" font-size="26" text-anchor="middle" fill="#172554">Üçgen tabanı: 60 cm</text><text x="180" y="510" font-size="26" text-anchor="middle" fill="#172554">Beyaz üçgen boş kalır</text><rect x="48" y="550" width="264" height="110" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="180" y="584" font-size="26" text-anchor="middle" fill="#172554">1 parça = 0,09 m²</text><text x="180" y="626" font-size="26" text-anchor="middle" fill="#172554">1 paket = 6 parça</text></svg>