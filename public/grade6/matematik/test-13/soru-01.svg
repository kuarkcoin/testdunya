<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" font-family="Arial, sans-serif"><title>Matematik Test 13 Soru 1</title><desc>ABCD dikdörtgeni: AB 18 cm, AD 12 cm. E, AB üzerinde ve AE 6 cm. F, BC üzerinde ve BF 8 cm. D, E, F birleştirilmiş; DEF üçgeni boyalıdır.</desc><rect width="360" height="650" fill="#f8fafc"/><text x="180" y="42" font-size="26" text-anchor="middle" fill="#172554">BOYALI ALAN</text><rect x="45" y="160" width="270" height="180" fill="#fff" stroke="#2563eb" stroke-width="2"/><polygon points="45,160 135,340 315,220" fill="#93c5fd" stroke="#2563eb" stroke-width="3"/><text x="30" y="370" font-size="26" text-anchor="middle" fill="#172554">A</text><text x="330" y="370" font-size="26" text-anchor="middle" fill="#172554">B</text><text x="330" y="145" font-size="26" text-anchor="middle" fill="#172554">C</text><text x="30" y="145" font-size="26" text-anchor="middle" fill="#172554">D</text><text x="135" y="375" font-size="26" text-anchor="middle" fill="#172554">E</text><text x="337" y="225" font-size="26" text-anchor="middle" fill="#172554">F</text><text x="180" y="422" font-size="26" text-anchor="middle" fill="#172554">AB = 18 cm</text><text x="180" y="460" font-size="26" text-anchor="middle" fill="#172554">AD = 12 cm</text><text x="180" y="498" font-size="26" text-anchor="middle" fill="#172554">AE = 6 cm</text><text x="180" y="536" font-size="26" text-anchor="middle" fill="#172554">BF = 8 cm</text><text x="180" y="602" font-size="26" text-anchor="middle" fill="#172554">DEF alanı = ?</text><polygon points="45,325 60,325 60,340 45,340" fill="#fff" stroke="#64748b" stroke-width="3"/></svg>