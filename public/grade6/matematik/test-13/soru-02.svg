<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" font-family="Arial, sans-serif"><title>Matematik Test 13 Soru 2</title><desc>Çapı 28 cm olan O merkezli çember. OA ve OB arasındaki küçük merkez açı 120°. Küçük AB yayı ve iki yarıçap kalın turuncu çizgiyle tel olarak gösterilir.</desc><rect width="360" height="650" fill="#f8fafc"/><text x="180" y="42" font-size="26" text-anchor="middle" fill="#172554">YAY + İKİ YARIÇAP</text><circle cx="180" cy="250" r="105" fill="none" stroke="#94a3b8" stroke-width="3"/><path d="M 180 250 L 232.5 159.07 A105 105 0 0 1 232.5 340.93 Z" fill="#ffedd5" stroke="#ea580c" stroke-width="5"/><text x="158" y="259" font-size="26" text-anchor="middle" fill="#172554">O</text><text x="254" y="150" font-size="26" text-anchor="middle" fill="#172554">A</text><text x="254" y="368" font-size="26" text-anchor="middle" fill="#172554">B</text><text x="240" y="260" font-size="26" text-anchor="middle" fill="#172554">120°</text><text x="180" y="422" font-size="26" text-anchor="middle" fill="#172554">Çap: 28 cm</text><text x="180" y="462" font-size="26" text-anchor="middle" fill="#172554">π = 3</text><line x1="180" y1="485" x2="180" y2="510" stroke="#ea580c" stroke-width="3" /><polygon points="173,502 187,502 180,516" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><rect x="145" y="530" width="70" height="70" fill="#fff" stroke="#ea580c" stroke-width="2"/><text x="180" y="636" font-size="26" text-anchor="middle" fill="#172554">Tel → kare</text></svg>