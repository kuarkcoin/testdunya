<rect x="213" y="70" width="56" height="65" rx="0" fill="#D9EBFF" stroke="#36586D" stroke-width="2"/>
<text x="241" y="102" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">4</text>
