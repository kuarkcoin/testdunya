<text x="180" y="28" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">10 eş aralık</text>
<line x1="30" y1="112" x2="330" y2="112" stroke="#36586D" stroke-width="3"/>
