<svg xmlns="http://www.w3.org/2000/svg" width="360" height="230" viewBox="0 0 360 230" role="img">
<title>Test 7 · Soru 1</title>
<desc>3,4 ile 3,5 arasındaki sayı doğrusu 10 eş aralığa bölünmüş. P, 3,4’ten sonraki üçüncü; Q ise sekizinci işarette. Ortadaki sayının değeri gösterilmiyor.</desc>
