<svg xmlns="http://www.w3.org/2000/svg" width="360" height="292" viewBox="0 0 360 292" role="img">
<title>İki farklı blok türü</title>
<desc>Üstte K kulesinde kullanılacak bir örnek blok; düşey yüksekliği 6 cm. Altta L kulesinde kullanılacak bir örnek blok; düşey yüksekliği 10 cm. Tamamlanmış kuleler gösterilmiyor.</desc>
<rect width="360" height="292" fill="#FFFFFF"/>
<text x="180" y="24" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">K için bir blok</text>
<rect x="34" y="48" width="164" height="54" rx="2" fill="#DFF2F1" stroke="#36586D" stroke-width="2.5"/>
<line x1="222" y1="48" x2="222" y2="102" stroke="#36586D" stroke-width="2.5" stroke-linecap="round"/><line x1="216" y1="48" x2="228" y2="48" stroke="#36586D" stroke-width="2.5" stroke-linecap="round"/><line x1="216" y1="102" x2="228" y2="102" stroke="#36586D" stroke-width="2.5" stroke-linecap="round"/><text x="294" y="75" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">6 cm</text>
<text x="180" y="157" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">L için bir blok</text>
<rect x="34" y="182" width="164" height="90" rx="2" fill="#EDE9FE" stroke="#36586D" stroke-width="2.5"/>
<line x1="222" y1="182" x2="222" y2="272" stroke="#36586D" stroke-width="2.5" stroke-linecap="round"/><line x1="216" y1="182" x2="228" y2="182" stroke="#36586D" stroke-width="2.5" stroke-linecap="round"/><line x1="216" y1="272" x2="228" y2="272" stroke="#36586D" stroke-width="2.5" stroke-linecap="round"/><text x="294" y="227" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">10 cm</text>
</svg>
