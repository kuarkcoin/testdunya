<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img"><title>Test 9 · Soru 3</title><desc>AB ve AC eşit işaretli ikizkenar üçgen. A üstte, B sol altta, C sağ altta. CB doğrusu B’den sola D’ye uzatılmış. ABD dış açısı 112°.</desc><rect width="360" height="350" fill="white"/><polygon points="190,55 110,265 270,265" fill="#EEF7FC" stroke="#36586D" stroke-width="3"/><line x1="110" y1="265" x2="18" y2="265" stroke="#36586D" stroke-width="3"/><text x="190" y="27" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">A</text><text x="110" y="293" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">B</text><text x="282" y="293" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">C</text><text x="22" y="293" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">D</text><path d="M122.82,231.36 A36,36 0 0,0 74.00,265.00" fill="none" stroke="#B56916" stroke-width="3"/><text x="59" y="218" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">112°</text><line x1="145" y1="153" x2="159" y2="160" stroke="#36586D" stroke-width="3"/><line x1="222" y1="160" x2="236" y2="153" stroke="#36586D" stroke-width="3"/><text x="190" y="134" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">?</text><text x="180" y="328" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Çizim ölçekli değildir.</text></svg>