<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img"><title>Test 9 · Soru 2</title><desc>ABC üçgeninde A üstte, B solda ve C sağda. BC doğrusu C’den D’ye uzatılmış. A iç açısı 47°, ACD dış açısı 124°.</desc><rect width="360" height="350" fill="white"/><polygon points="155,55 55,265 260,265" fill="#EEF7FC" stroke="#36586D" stroke-width="3"/><line x1="260" y1="265" x2="340" y2="265" stroke="#36586D" stroke-width="3"/><text x="155" y="27" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">A</text><text x="37" y="290" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">B</text><text x="257" y="294" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">C</text><text x="338" y="294" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">D</text><path d="M140.38,85.70 A34,34 0 0,0 170.21,85.41" fill="none" stroke="#B56916" stroke-width="3"/><text x="160" y="122" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">47°</text><path d="M297.00,265.00 A37,37 0 0,0 243.45,231.91" fill="none" stroke="#B56916" stroke-width="3"/><text x="296" y="215" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">124°</text><text x="180" y="328" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Çizim ölçekli değildir.</text></svg>