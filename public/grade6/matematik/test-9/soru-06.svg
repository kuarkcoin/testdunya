<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img"><title>Test 9 · Soru 6</title><desc>ABCD dikdörtgeninde A sol alt, B sağ alt, C sağ üst, D sol üst. Köşegenler O’da kesişir. OAB açısı 32°, AOB açısı x ile gösterilmiştir.</desc><rect width="360" height="350" fill="white"/><polygon points="50,260 310,260 310,98 50,98" fill="#EEF7FC" stroke="#36586D" stroke-width="3"/><line x1="50" y1="260" x2="310" y2="98" stroke="#36586D" stroke-width="3"/><line x1="310" y1="260" x2="50" y2="98" stroke="#36586D" stroke-width="3"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Dikdörtgen</text><text x="36" y="287" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">A</text><text x="326" y="287" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">B</text><text x="326" y="70" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">C</text><text x="34" y="70" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">D</text><text x="180" y="147" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">O</text><path d="M90.74,234.62 A48,48 0 0,1 98.00,260.00" fill="none" stroke="#B56916" stroke-width="3"/><text x="115" y="242" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">32°</text><path d="M155.39,194.34 A29,29 0 0,0 204.61,194.34" fill="none" stroke="#B56916" stroke-width="3"/><text x="180" y="227" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">x</text><text x="180" y="328" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Çizim ölçekli değildir.</text></svg>