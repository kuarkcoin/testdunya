<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430" role="img"><title>Test 9 · Soru 7</title><desc>Üstte A solda B sağda, altta C solda D sağda olan iki paralel doğru. AD ve BC, O’da kesişir. Üst üçgenin A açısı 48°, B açısı 62°. O’nun sağında OB ve OD arasındaki açı x; C’de CO ve CD arasındaki açı y.</desc><rect width="360" height="430" fill="white"/><line x1="10" y1="75" x2="345" y2="75" stroke="#36586D" stroke-width="3"/><line x1="10" y1="355" x2="345" y2="355" stroke="#36586D" stroke-width="3"/><line x1="20" y1="75" x2="272.1131324033952" y2="355" stroke="#36586D" stroke-width="3"/><line x1="260" y1="75" x2="111.12135913478596" y2="355" stroke="#36586D" stroke-width="3"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">AB ∥ CD</text><text x="20" y="49" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">A</text><text x="260" y="49" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">B</text><text x="111.12135913478596" y="382" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">C</text><text x="272.1131324033952" y="382" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">D</text><text x="140.89374847668856" y="242.58448546769878" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">O</text><path d="M53.00,75.00 A33,33 0 0,1 42.08,99.52" fill="none" stroke="#B56916" stroke-width="3"/><path d="M227.00,75.00 A33,33 0 0,0 244.51,104.14" fill="none" stroke="#B56916" stroke-width="3"/><