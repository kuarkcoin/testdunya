<text x="49" y="137" text-anchor="end" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">22</text>
<line x1="66" y1="83" x2="330" y2="83" stroke="#36586D" stroke-width="3"/>
<text x="49" y="83" text-anchor="end" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">24</text>
<line x1="66" y1="72" x2="66" y2="245" stroke="#36586D" stroke-width="3"/>
<rect x="107" y="191" width="66" height="54" rx="0" fill="#7EB7E6" stroke="#36586D" stroke-width="2"/>
<rect x="234" y="83" width="66" height="162" rx="0" fill="#EAC76B" stroke="#36586D" stroke-width="2"/>
<text x="140" y="174" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">20</text>
<text x="267" y="64" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">24</text>
