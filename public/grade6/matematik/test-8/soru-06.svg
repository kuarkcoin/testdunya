<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img">
<title>Test 8 · Soru 6</title>
<desc>Pil sayısı ekseni 18, 20, 22, 24 olarak işaretli. A sütunu 20’ye, B sütunu 24’e ulaşıyor. Eksenin 18’den başladığı açıkça belirtiliyor.</desc>
