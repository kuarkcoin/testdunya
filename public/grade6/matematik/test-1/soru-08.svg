<svg xmlns="http://www.w3.org/2000/svg" width="360" height="336" viewBox="0 0 360 336" role="img">
<title>Aynı ölçekte iki işaret şeridi</title>
<desc>Aynı konum ölçeğini kullanan iki yatay şerit var. K şeridinde ilk iki işaret 0 ve 6 konumlarında; araları 6 birim. L şeridinde ilk iki işaret 2 ve 10 konumlarında; araları 8 birim. Şeritler sağa doğru bu eşit aralıklarla devam ediyor; sonraki işaretler çizilmemiş.</desc>
<rect width="360" height="336" fill="#FFFFFF"/>
<text x="25" y="94" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#15354B">K</text>
<text x="25" y="244" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#15354B">L</text>
<line x1="70" y1="94" x2="206" y2="94" stroke="#36586D" stroke-width="2.5" stroke-linecap="round"/>
<line x1="206" y1="94" x2="344" y2="94" stroke="#36586D" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 8"/>
<line x1="70" y1="244" x2="286" y2="244" stroke="#36586D" stroke-width="2.5" stroke-linecap="round"/>
<line x1="286" y1="244" x2="344" y2="244" stroke="#36586D" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 8"/>
<line x1="70" y1="81" x2="70" y2="107" stroke="#36586D" stroke-width="3.5" stroke-linecap="round"/>
<text x="70" y="58" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#15354B">0</text>
<line x1="190" y1="81" x2="190" y2="107" stroke="#36586D" stroke-width="3.5" stroke-linecap="round"/>
<text x="190" y="58" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#15354B">6</text>
<line x1="110" y1="231" x2="110" y2="257" stroke="#36586D" stroke-width="3.5" stroke-linecap="round"/>
<text x="110" y="208" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#15354B">2</text>
<line x1="270" y1="231" x2="270" y2="257" stroke="#36586D" stroke-width="3.5" stroke-linecap="round"/>
<text x="270" y="208" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#15354B">10</text>
<line x1="70" y1="126" x2="190" y2="126" stroke="#36586D" stroke-width="2.5" stroke-linecap="round"/><line x1="70" y1="120" x2="70" y2="132" stroke="#36586D" stroke-width="2.5" stroke-linecap="round"/><line x1="190" y1="120" x2="190" y2="132" stroke="#36586D" stroke-width="2.5" stroke-linecap="round"/><text x="130" y="159" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">6 birim</text>
<line x1="110" y1="276" x2="270" y2="276" stroke="#36586D" stroke-width="2.5" stroke-linecap="round"/><line x1="110" y1="270" x2="110" y2="282" stroke="#36586D" stroke-width="2.5" stroke-linecap="round"/><line x1="270" y1="270" x2="270" y2="282" stroke="#36586D" stroke-width="2.5" stroke-linecap="round"/><text x="190" y="309" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">8 birim</text>
</svg>
