<svg xmlns="http://www.w3.org/2000/svg" width="360" height="202" viewBox="0 0 360 202" role="img">
<title>Üç asal sayının zinciri</title>
<desc>Soldan sağa A, B ve C kutuları var. A’dan B’ye giden okun üstünde artı 2, B’den C’ye giden okun üstünde artı 4 yazıyor. A, B ve C asal sayılardır; C, 30’dan küçüktür.</desc>
<rect width="360" height="202" fill="#FFFFFF"/>
<line x1="97" y1="94" x2="139" y2="94" stroke="#41566B" stroke-width="2.5" stroke-linecap="round"/><path d="M 130.90 97.91 L 139.00 94.00 L 130.90 90.09" fill="none" stroke="#41566B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="222" y1="94" x2="264" y2="94" stroke="#41566B" stroke-width="2.5" stroke-linecap="round"/><path d="M 255.90 97.91 L 264.00 94.00 L 255.90 90.09" fill="none" stroke="#41566B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="118" y="33" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#15354B">+2</text>
<text x="243" y="33" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#15354B">+4</text>
<rect x="16" y="58" width="78" height="72" rx="10" fill="#DFF2F1" stroke="#36586D" stroke-width="2.5"/>
<text x="55" y="94" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700" fill="#15354B">A</text>
<rect x="141" y="58" width="78" height="72" rx="10" fill="#DFF2F1" stroke="#36586D" stroke-width="2.5"/>
<text x="180" y="94" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700" fill="#15354B">B</text>
<rect x="266" y="58" width="78" height="72" rx="10" fill="#DFF2F1" stroke="#36586D" stroke-width="2.5"/>
<text x="305" y="94" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700" fill="#15354B">C</text>
<text x="180" y="174" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#15354B">C &lt; 30</text>
</svg>
