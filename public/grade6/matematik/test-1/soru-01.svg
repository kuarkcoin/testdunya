<svg xmlns="http://www.w3.org/2000/svg" width="360" height="388" viewBox="0 0 360 388" role="img">
<title>Numaralı anahtarlar</title>
<desc>Başlangıçta hepsi kapalı altı anahtar. Üst sırada soldan sağa 12, 18, 20; alt sırada soldan sağa 24, 27, 30 yazıyor. Birinci turda 3’ün katı olan numaraların, ikinci turda 4’ün katı olan numaraların anahtarları birer kez çevriliyor.</desc>
