<svg xmlns="http://www.w3.org/2000/svg" width="360" height="334" viewBox="0 0 360 334" role="img">
<title>Bir kart sil, sırayı koru</title>
<desc>Yan yana beş rakam kartında soldan sağa 6, 2, 4, 5, 0 yazıyor. Altında, kalan dört kartın sırası değiştirilmeden oluşturulacak dört basamaklı sayı için dört boş kutu var. Bu sayı hem 3’e hem 4’e kalansız bölünmelidir.</desc>
