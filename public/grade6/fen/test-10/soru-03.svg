<svg xmlns="http://www.w3.org/2000/svg" width="360" height="370" viewBox="0 0 360 370" role="img"><title>Fen Test 10 · Soru 3</title><desc>K uzun ve ince; L aynı uzunlukta kalın; M L ile aynı kalınlıkta fakat daha kısa tel. Tüm teller aynı maddeden.</desc><rect width="360" height="370" fill="white"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Aynı cins tel</text><text x="35" y="100" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">K</text><rect x="70" y="96.0" width="220" height="8" rx="5" fill="#F2CA79" stroke="#36586D" stroke-width="2"/><text x="35" y="185" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">L</text><rect x="70" y="173.0" width="220" height="24" rx="5" fill="#F2CA79" stroke="#36586D" stroke-width="2"/><text x="35" y="270" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">M</text><rect x="70" y="258.0" width="110" height="24" rx="5" fill="#F2CA79" stroke="#36586D" stroke-width="2"/><text x="180" y="330" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Boy ve kalınlık değişiyor</text></svg>