<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img"><title>Fen Test 10 · Soru 7</title><desc>K orta uzunluk ve kalınlıkta; L daha uzun ince; M daha uzun kalın; N daha kısa kalın. Şema nitel karşılaştırmadır.</desc><rect width="360" height="420" fill="white"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Tel seçenekleri</text><text x="35" y="95" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">K</text><rect x="80" y="87.5" width="150" height="15" rx="5" fill="#F2CA79" stroke="#36586D" stroke-width="2"/><text x="35" y="170" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">L</text><rect x="80" y="166.5" width="230" height="7" rx="5" fill="#F2CA79" stroke="#36586D" stroke-width="2"/><text x="35" y="245" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">M</text><rect x="80" y="232.0" width="230" height="26" rx="5" fill="#F2CA79" stroke="#36586D" stroke-width="2"/><text x="35" y="320" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">N</text><rect x="80" y="307.0" width="85" height="26" rx="5" fill="#F2CA79" stroke="#36586D" stroke-width="2"/><text x="180" y="365" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Hepsi aynı maddeden</text><text x="180" y="400" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Çizim ölçekli değildir.</text></svg>