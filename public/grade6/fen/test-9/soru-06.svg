<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img"><title>Fen Test 9 · Soru 6</title><desc>Başlangıç bloğu 120 g, 40 cm³. Bir parça ayrılmış ve 30 g olarak etiketlenmiş. Şema ölçekli değildir.</desc><rect width="360" height="350" fill="white"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Homojen blok</text><rect x="45" y="85" width="270" height="100" rx="5" fill="#F2CD7F" stroke="#36586D" stroke-width="2"/><line x1="112" y1="85" x2="112" y2="185" stroke="#36586D" stroke-width="3" stroke-dasharray="5 5"/><text x="180" y="218" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">120 g • 40 cm³</text><rect x="40" y="255" width="70" height="45" rx="5" fill="#F2CD7F" stroke="#36586D" stroke-width="2"/><text x="220" y="277" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="600" fill="#15354B">Ayrılan: 30 g</text><text x="180" y="330" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Çizim ölçekli değildir.</text></svg>