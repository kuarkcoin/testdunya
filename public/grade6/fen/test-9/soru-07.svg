<svg xmlns="http://www.w3.org/2000/svg" width="360" height="410" viewBox="0 0 360 410" role="img"><title>Fen Test 9 · Soru 7</title><desc>Aynı örnek: sıvı su 90 g, 90 cm³; buz 90 g, 100 cm³. Sayılar yaklaşık örnek değerlerdir, şekiller ölçekli değildir.</desc><rect width="360" height="410" fill="white"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Aynı su örneği</text><text x="85" y="75" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Sıvı su</text><rect x="35" y="105" width="100" height="130" rx="5" fill="white" stroke="#36586D" stroke-width="2"/><rect x="38" y="145" width="94" height="87" rx="5" fill="#B8DEEB" stroke="#36586D" stroke-width="2"/><text x="85" y="270" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">90 g</text><text x="85" y="310" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">90 cm³</text><text x="270" y="75" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Buz</text><rect x="220" y="105" width="100" height="130" rx="5" fill="white" stroke="#36586D" stroke-width="2"/><rect x="223" y="135" width="94" height="97" rx="5" fill="#E1F0FA" stroke="#36586D" stroke-width="2"/><text x="270" y="270" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">90 g</text><text x="270" y="310" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">100 cm³</text><text x="180" y="350" text-anchor="middle" dominant-baseline