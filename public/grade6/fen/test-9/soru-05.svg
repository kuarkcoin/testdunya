<svg xmlns="http://www.w3.org/2000/svg" width="360" height="410" viewBox="0 0 360 410" role="img"><title>Fen Test 9 · Soru 5</title><desc>Su kabında K yüzeyde kısmen batmış, L dipte. K’den alınan küçük parça ayrı gösterilmiş; şekiller şematiktir.</desc><rect width="360" height="410" fill="white"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Su içindeki cisimler</text><rect x="35" y="100" width="250" height="210" rx="5" fill="white" stroke="#36586D" stroke-width="2"/><rect x="38" y="145" width="244" height="163" rx="5" fill="#B8DEEB" stroke="#36586D" stroke-width="2"/><rect x="70" y="125" width="55" height="65" rx="5" fill="#F2CD7F" stroke="#36586D" stroke-width="2"/><text x="97" y="110" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">K</text><rect x="205" y="263" width="50" height="44" rx="5" fill="#8BA6BC" stroke="#36586D" stroke-width="2"/><text x="230" y="245" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">L</text><rect x="302" y="150" width="25" height="25" rx="5" fill="#F2CD7F" stroke="#36586D" stroke-width="2"/><text x="180" y="345" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">K’den küçük bir parça</text><text x="180" y="375" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Şema ölçekli değildir.</text></svg>