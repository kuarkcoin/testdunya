<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img"><title>Fen Test 9 · Soru 2</title><desc>Boş kap terazi okuması 30 g; aynı kap ve 40 cm³ sıvı birlikte 110 g.</desc><rect width="360" height="360" fill="white"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Kap ve sıvı</text><text x="85" y="70" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Boş kap</text><rect x="45" y="100" width="80" height="100" rx="5" fill="white" stroke="#36586D" stroke-width="2"/><rect x="30" y="210" width="110" height="50" rx="5" fill="#E8EEF2" stroke="#36586D" stroke-width="2"/><text x="85" y="236" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">30 g</text><text x="270" y="70" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Dolu kap</text><rect x="230" y="100" width="80" height="100" rx="5" fill="white" stroke="#36586D" stroke-width="2"/><rect x="233" y="133" width="74" height="64" rx="5" fill="#B8DEEB" stroke="#36586D" stroke-width="2"/><rect x="215" y="210" width="110" height="50" rx="5" fill="#E8EEF2" stroke="#36586D" stroke-width="2"/><text x="270" y="236" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">110 g</text><text x="180" y="305" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="600" fill="#15354B">Sıvı hacmi: 40 cm³</text></svg>