<svg xmlns="http://www.w3.org/2000/svg" width="360" height="600" viewBox="0 0 360 600" role="img"><title>Fen Test 13 Soru 2</title><desc>Cisme K ve 6 N doğuya, L batıya uygulanıyor. İlk bileşke doğuya 4 N. İkinci durumda yalnız 6 N doğu kuvveti kaldırılıyor.</desc><rect width="360" height="600" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="180" y="40" font-size="26" fill="#172554" text-anchor="middle">İLK DURUM</text><text x="75" y="90" font-size="26" fill="#172554" text-anchor="middle">Batı</text><text x="285" y="90" font-size="26" fill="#172554" text-anchor="middle">Doğu</text><rect x="130" y="150" width="100" height="230" rx="12" fill="#fef3c7" stroke="#0284c7" stroke-width="2"/><line x1="130" y1="210" x2="25" y2="210" stroke="#b91c1c" stroke-width="5"/><polygon points="25,210 40,201 40,219" fill="#b91c1c"/><text x="65" y="190" font-size="26" fill="#172554" text-anchor="middle">L</text><line x1="230" y1="200" x2="335" y2="200" stroke="#2563eb" stroke-width="5"/><polygon points="335,200 320,191 320,209" fill="#2563eb"/><text x="283" y="177" font-size="26" fill="#172554" text-anchor="middle">K</text><line x1="230" y1="315" x2="335" y2="315" stroke="#2563eb" stroke-width="5"/><polygon points="335,315 320,306 320,324" fill="#2563eb"/><text x="283" y="290" font-size="26" fill="#172554" text-anchor="middle">6 N</text><text x="180" y="425" font-size="26" fill="#172554" text-anchor="middle">Bileşke: 4 N doğuya</text><rect x="18" y="455" width="324" height="112" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="180" y="492" font-size="26" fill="#172554" text-anchor="middle">İkinci durumda:</text><text x="180" y="533" font-size="26" fill="#172554" text-anchor="middle">Yalnız 6 N kaldırılır.</text></g></svg>