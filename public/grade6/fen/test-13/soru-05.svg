<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" role="img"><title>Fen Test 13 Soru 5</title><desc>K’nin kütlesi 90 g. Başlangıçtaki su seviyesi 40 cm³, K tamamen batınca seviye 85 cm³. K üç eşit kütleli parçaya ayrılıyor.</desc><rect width="360" height="650" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="180" y="36" font-size="26" fill="#172554" text-anchor="middle">K CİSMİ: 90 g</text><text x="91" y="84" font-size="26" fill="#172554" text-anchor="middle">Önce</text><path d="M 24 110 V 415 H 158 V 110" fill="none" stroke="#334155" stroke-width="3"/><rect x="26" y="285" width="130" height="128" fill="#bae6fd"/><line x1="29" y1="285" x2="153" y2="285" stroke="#0284c7" stroke-width="3"/><text x="91" y="453" font-size="26" fill="#172554" text-anchor="middle">40 cm³</text><text x="269" y="84" font-size="26" fill="#172554" text-anchor="middle">Sonra</text><path d="M 202 110 V 415 H 336 V 110" fill="none" stroke="#334155" stroke-width="3"/><rect x="204" y="165" width="130" height="248" fill="#bae6fd"/><rect x="242" y="300" width="55" height="80" fill="#64748b"/><text x="269" y="351" font-size="28" fill="#ffffff" text-anchor="middle">K</text><line x1="207" y1="165" x2="331" y2="165" stroke="#0284c7" stroke-width="3"/><text x="269" y="453" font-size="26" fill="#172554" text-anchor="middle">85 cm³</text><rect x="18" y="493" width="324" height="120" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="180" y="535" font-size="26" fill="#172554" text-anchor="middle">Sonra üç eşit</text><text x="180" y="578" font-size="26" fill="#172554" text-anchor="middle">kütleli parçaya ayrılır.</text></g></svg>