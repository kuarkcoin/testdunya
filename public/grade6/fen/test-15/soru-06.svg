<svg xmlns="http://www.w3.org/2000/svg" width="360" height="740" viewBox="0 0 360 740"><title>Fen Bilimleri Test 15 Soru 6</title><desc>Dış uçları sabitlenmiş iki levha arasında 5 mm boşluk. Sol levhanın serbest ucu sağa 1,5 mm; sağ levhanın serbest ucu sola 2,5 mm ilerler.</desc><rect width="360" height="740" rx="18" fill="#f8fafc"/><text x="180" y="45" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">İKİ SERBEST UÇ</text><rect x="20" y="160" width="130" height="50" fill="#94a3b8" stroke="#64748b" stroke-width="2"/><rect x="210" y="160" width="130" height="50" fill="#94a3b8" stroke="#64748b" stroke-width="2"/><rect x="15" y="130" width="10" height="110" fill="#475569" stroke="#64748b" stroke-width="2"/><rect x="335" y="130" width="10" height="110" fill="#475569" stroke="#64748b" stroke-width="2"/><text x="80" y="280" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">Sabit</text><text x="290" y="280" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">Sabit</text><line x1="150" y1="120" x2="210" y2="120" stroke="#475569" stroke-width="3"/><text x="180" y="100" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">5 mm</text><line x1="90" y1="345" x2="165" y2="345" stroke="#ea580c" stroke-width="4"/><polygon points="165,345 154.5,350.8 154.5,339.2" fill="#ea580c"/><line x1="270" y1="345" x2="195" y2="345" stroke="#ea580c" stroke-width="4"/><polygon points="195,345 205.5,339.2 205.5,350.8" fill="#ea580c"/><text x="90" y="395" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">1,5 mm</text><text x="270" y="395" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">2,5 mm</text><text x="180" y="470" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">Serbest uçlar boşluğa</text><text x="180" y="510" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">doğru ilerliyor.</text><text x="180" y="590" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">Yeni boşluk = ?</text><text x="180" y="665" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">Çizim ölçekli değildir.</text></svg>