<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780"><title>Fen Bilimleri Test 15 Soru 4</title><desc>Kaynak → kırmızı levha → beyaz levha ışık yolu. Beyaz levhaya doğrudan ışık gitmiyor. Denemelerde önce beyaz, sonra mavi kaynak kullanılıyor.</desc><rect width="360" height="780" rx="18" fill="#f8fafc"/><text x="180" y="45" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">İKİ LEVHADA IŞIK</text><circle cx="65" cy="140" r="30" fill="#fde68a" stroke="#475569" stroke-width="2"/><text x="65" y="200" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">Kaynak</text><rect x="255" y="110" width="25" height="110" fill="#ef4444" stroke="#64748b" stroke-width="2"/><text x="285" y="300" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">Kırmızı</text><line x1="105" y1="140" x2="245" y2="140" stroke="#475569" stroke-width="4"/><polygon points="245,140 234.5,145.8 234.5,134.2" fill="#475569"/><line x1="250" y1="210" x2="135" y2="390" stroke="#475569" stroke-width="4"/><polygon points="135,390 135.8,378.0 145.5,384.2" fill="#475569"/><rect x="60" y="400" width="170" height="20" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="150" y="465" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">Beyaz levha</text><text x="180" y="535" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">Doğrudan kaynak ışığı</text><text x="180" y="570" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">beyaz levhaya ulaşmaz.</text><text x="180" y="635" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">1. deneme: beyaz ışık</text><text x="180" y="685" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">2. deneme: mavi ışık</text></svg>