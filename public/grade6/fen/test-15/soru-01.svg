<svg xmlns="http://www.w3.org/2000/svg" width="360" height="740" viewBox="0 0 360 740"><title>Fen Bilimleri Test 15 Soru 1</title><desc>K, A’dan B’ye düz yol; L, A’dan C’ye aynı uzunlukta düz yol; M, A’dan D’ye ve B’ye daha uzun kırık yol. K ve L toplam yolları eşit, bütün süreler eşit.</desc><rect width="360" height="740" rx="18" fill="#f8fafc"/><text x="180" y="45" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">ÜÇ YOLCULUK</text><line x1="60" y1="350" x2="300" y2="350" stroke="#2563eb" stroke-width="5"/><line x1="60" y1="350" x2="60" y2="110" stroke="#16a34a" stroke-width="5"/><line x1="60" y1="350" x2="210" y2="160" stroke="#ea580c" stroke-width="4"/><line x1="210" y1="160" x2="300" y2="350" stroke="#ea580c" stroke-width="4"/><circle cx="60" cy="350" r="6" fill="#fff" stroke="#475569" stroke-width="2"/><text x="74" y="335" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">A</text><circle cx="300" cy="350" r="6" fill="#fff" stroke="#475569" stroke-width="2"/><text x="314" y="335" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">B</text><circle cx="60" cy="110" r="6" fill="#fff" stroke="#475569" stroke-width="2"/><text x="74" y="95" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">C</text><circle cx="210" cy="160" r="6" fill="#fff" stroke="#475569" stroke-width="2"/><text x="224" y="145" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">D</text><text x="180" y="420" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">K: A → B</text><text x="180" y="460" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">L: A → C</text><text x="180" y="500" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">M: A → D → B</text><text x="180" y="565" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">K ve L yolları eşit.</text><text x="180" y="605" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">M’nin yolu daha uzun.</text><text x="180" y="665" font-size="26" fill="#172554" text-anchor="middle" font-family="Arial, sans-serif">Bütün süreler eşit.</text></svg>