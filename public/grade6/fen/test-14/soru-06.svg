<svg xmlns="http://www.w3.org/2000/svg" width="360" height="700" viewBox="0 0 360 700" role="img"><title>Sabit okun sağındaki düz ayna, kesikli eski konumundan oka daha yakın mavi yeni konumuna kaydırılıyor. Yüzeylerin yönleri aynı; hareket oku sola.</title><rect width="360" height="700" fill="#f8fafc"/><text x="180" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">AYNA YER DEĞİŞTİRİYOR</text><line x1="60" y1="360" x2="60" y2="220" stroke="#16a34a" stroke-width="4"/><polygon points="60,220 54.0,233.0 66.0,233.0" fill="#16a34a"/><text x="60" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Sabit ok</text><line x1="260" y1="165" x2="260" y2="440" stroke="#94a3b8" stroke-width="5" stroke-dasharray="7 5"/><line x1="210" y1="165" x2="210" y2="440" stroke="#2563eb" stroke-width="6"/><line x1="255" y1="125" x2="215" y2="125" stroke="#f97316" stroke-width="4"/><polygon points="215,125 228.0,131.0 228.0,119.0" fill="#f97316"/><text x="180" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Oka doğru</text><line x1="60" y1="475" x2="260" y2="475" stroke="#475569" stroke-width="3"/><line x1="60" y1="465" x2="60" y2="485" stroke="#475569" stroke-width="3"/><line x1="260" y1="465" x2="260" y2="485" stroke="#475569" stroke-width="3"/><text x="160" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Ayna yaklaşır.</text><text x="180" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Kesikli: eski ayna</text><text x="180" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Mavi: yeni ayna</text><text x="180" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Okun yeri değişmez.</text></svg>