<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780" role="img"><title>Aynı bireyin larva 2,4 g → pupa 1,8 g → ergin 1,2 g aşamaları. Larva sürünür; pupa dönüşüm aşamasıdır; ergin kanatlarıyla uçar.</title><rect width="360" height="780" fill="#f8fafc"/><text x="180" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">AYNI BİREYİN GELİŞİMİ</text><circle cx="100" cy="130" r="22" fill="#86efac" stroke="#475569" stroke-width="2"/><circle cx="130" cy="130" r="22" fill="#86efac" stroke="#475569" stroke-width="2"/><circle cx="160" cy="130" r="22" fill="#86efac" stroke="#475569" stroke-width="2"/><circle cx="190" cy="130" r="22" fill="#86efac" stroke="#475569" stroke-width="2"/><circle cx="220" cy="130" r="22" fill="#86efac" stroke="#475569" stroke-width="2"/><text x="180" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Larva: 2,4 g</text><text x="180" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Sürünerek ilerler.</text><line x1="180" y1="245" x2="180" y2="295" stroke="#f97316" stroke-width="4"/><polygon points="180,295 186.0,282.0 174.0,282.0" fill="#f97316"/><ellipse cx="180" cy="360" rx="35" ry="58" fill="#a3a3a3" stroke="#475569" stroke-width="2"/><text x="180" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Pupa: 1,8 g</text><text x="180" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172554">Dönüşüm sürer.</text><line x1="180" y1="505" x2="180" y2="550" stroke="#f97316" stroke-width="4"/><polygon points="180,550 186.0,537.0 174.0,537.0" fill="#f97316"/><ellipse cx="140" cy="610" rx="38" ry="48" fill="#fdba74" stroke="#475569" stroke-width="2"/><ellipse cx="220" cy="610" rx="38" ry="48" fill="#fdba74" stroke="#475569" stroke-width="2"/><rect x="173" y="570" width="14" height="85" rx="5" fill="#475569" stroke="#475569" stroke-width="