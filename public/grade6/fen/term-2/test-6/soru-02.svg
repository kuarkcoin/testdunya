<svg xmlns="http://www.w3.org/2000/svg" width="360" height="530" viewBox="0 0 360 530" role="img" font-family="DejaVu Sans, sans-serif">
<title>Göl çevresindeki yaşam alanları ve kirli su girişi</title>
<desc>Göl çevresinde P ağaçlık alanı, R sazlığı, S kuş yuvasını gösteriyor. T, atık su kaynağından göle giden borunun üzerinde; ok kirli suyun borudan göle aktığını gösteriyor.</desc>
<rect width="360" height="530" fill="#ffffff"/>
<text x="180" y="36" font-size="29" fill="#172554" text-anchor="middle" font-weight="bold">Göl ve çevresi</text><rect x="20" y="70" width="125" height="85" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="82" y="105" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">Atık su</text><text x="82" y="137" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">kaynağı</text><path d="M 81 155 L 81 250 L 116 273" fill="none" stroke="#64748b" stroke-width="20"/><path d="M 81 155 L 81 250 L 116 273" fill="none" stroke="#cbd5e1" stroke-width="12"/><ellipse cx="180" cy="322" rx="153" ry="86" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M 81 171 L 81 244 L 109 264" fill="none" stroke="#92400e" stroke-width="5"/><polygon points="103,250 121,273 97,267" fill="#92400e"/><circle cx="35" cy="210" r="20" fill="#fff" stroke="#334155" stroke-width="2"/><text x="35" y="219" font-size="27" fill="#172554" text-anchor="middle" font-weight="bold">T</text><text x="180" y="330" font-size="29" fill="#1e40af" text-anchor="middle" font-weight="bold">Göl</text><line x1="230" y1="110" x2="230" y2="145" stroke="#92400e" stroke-width="10" /><circle cx="230" cy="100" r="25" fill="#86efac" stroke="#15803d" stroke-width="2"/><line x1="283" y1="145" x2="283" y2="180" stroke="#92400e" stroke-width="10" /><circle cx="283" cy="135" r="25" fill="#86efac" stroke="#15803d" stroke-width="2"/><line x1="218" y1="180" x2="218" y2="215" stroke="#92400e" stroke-width="10" /><circle cx="218" cy="170" r="25" fill="#86efac" stroke="#15803d" stroke-width="2"/><circle cx="312" cy="76" r="20" fill="#fff" stroke="#334155" stroke-width="2"/><text x="312" y="85" font-size="27" fill="#172554" text-anchor="middle" font-weight="bold">P</text><line x1="45" y1="446" x2="48" y2="397" stroke="#15803d" stroke-width="4" /><line x1="48" y1="420" x2="60" y2="403" stroke="#15803d" stroke-width="3" /><line x1="48" y1="416" x2="35" y2="401" stroke="#15803d" stroke-width="3" /><line x1="60" y1="446" x2="63" y2="387" stroke="#15803d" stroke-width="4" /><line x1="63" y1="410" x2="75" y2="393" stroke="#15803d" stroke-width="3" /><line x1="63" y1="406" x2="50" y2="391" stroke="#15803d" stroke-width="3" /><line x1="76" y1="446" x2="79" y2="402" stroke="#15803d" stroke-width="4" /><line x1="79" y1="425" x2="91" y2="408" stroke="#15803d" stroke-width="3" /><line x1="79" y1="421" x2="66" y2="406" stroke="#15803d" stroke-width="3" /><line x1="91" y1="446" x2="94" y2="394" stroke="#15803d" stroke-width="4" /><line x1="94" y1="417" x2="106" y2="400" stroke="#15803d" stroke-width="3" /><line x1="94" y1="413" x2="81" y2="398" stroke="#15803d" stroke-width="3" /><circle cx="30" cy="468" r="20" fill="#fff" stroke="#334155" stroke-width="2"/><text x="30" y="477" font-size="27" fill="#172554" text-anchor="middle" font-weight="bold">R</text><ellipse cx="270" cy="441" rx="43" ry="15" fill="#a16207" stroke="#713f12" stroke-width="3"/><ellipse cx="270" cy="431" rx="28" ry="18" fill="#fef3c7" stroke="#713f12" stroke-width="2"/><circle cx="274" cy="412" r="14" fill="#94a3b8" stroke="#334155" stroke-width="2"/><polygon points="285,408 300,413 285,418" fill="#ea580c"/><circle cx="278" cy="409" r="2" fill="#0f172a" stroke="#0f172a" stroke-width="1"/><circle cx="320" cy="458" r="20" fill="#fff" stroke="#334155" stroke-width="2"/><text x="320" y="467" font-size="27" fill="#172554" text-anchor="middle" font-weight="bold">S</text><text x="180" y="515" font-size="26" fill="#78350f" text-anchor="middle" font-weight="normal">Ok: kirli su akışı</text>
</svg>
