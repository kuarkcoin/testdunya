<svg xmlns="http://www.w3.org/2000/svg" width="360" height="490" viewBox="0 0 360 490" role="img" font-family="DejaVu Sans, sans-serif">
<title>İki araştırma için farklı cins, uzunluk ve kalınlıktaki teller</title>
<desc>K: bakır, 20 cm, ince. L: demir, 30 cm, ince. M: demir, 30 cm, kalın. K ve L aynı kalınlıkta; M daha kalındır. Çizilen tel uzunlukları 20’ye 30 oranını korur.</desc>
<rect width="360" height="490" fill="#ffffff"/>
<text x="180" y="35" font-size="29" fill="#172554" text-anchor="middle" font-weight="bold">Kesilmeden önce</text><rect x="12" y="58" width="336" height="114" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="180" y="90" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">K · Bakır</text><line x1="70" y1="116" x2="230" y2="116" stroke="#b45309" stroke-width="8" /><text x="180" y="156" font-size="27" fill="#172554" text-anchor="middle" font-weight="normal">20 cm · ince</text><rect x="12" y="184" width="336" height="114" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="180" y="216" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">L · Demir</text><line x1="70" y1="242" x2="310" y2="242" stroke="#475569" stroke-width="8" /><text x="180" y="282" font-size="27" fill="#172554" text-anchor="middle" font-weight="normal">30 cm · ince</text><rect x="12" y="310" width="336" height="114" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="180" y="342" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">M · Demir</text><line x1="70" y1="368" x2="310" y2="368" stroke="#475569" stroke-width="20" /><text x="180" y="408" font-size="27" fill="#172554" text-anchor="middle" font-weight="normal">30 cm · kalın</text><text x="180" y="472" font-size="26" fill="#475569" text-anchor="middle" font-weight="normal">K ve L aynı kalınlıkta.</text>
</svg>
