<svg xmlns="http://www.w3.org/2000/svg" width="360" height="460" viewBox="0 0 360 460" role="img" font-family="DejaVu Sans, sans-serif">
<title>Bağlı esnek balonun ısıtılmadan önceki ve sonraki hacmi</title>
<desc>Aynı ağzı bağlı balon önce 20 °C’de daha küçük, sonra 40 °C’de daha büyük hacimde gösteriliyor. İçindeki hava miktarı değişmiyor; görsel hacimleri sayısal olarak ölçmek için ölçekli değildir.</desc>
<rect width="360" height="460" fill="#ffffff"/>
<text x="180" y="36" font-size="29" fill="#172554" text-anchor="middle" font-weight="bold">Aynı balon</text><rect x="14" y="58" width="332" height="164" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><rect x="14" y="260" width="332" height="164" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="80" y="142" font-size="29" fill="#172554" text-anchor="middle" font-weight="bold">20 °C</text><text x="80" y="350" font-size="29" fill="#172554" text-anchor="middle" font-weight="bold">40 °C</text><ellipse cx="250" cy="129" rx="43" ry="51" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/><polygon points="250,179 243,190 257,190" fill="#fb923c" stroke="#c2410c" stroke-width="2"/><ellipse cx="250" cy="336" rx="68" ry="69" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/><polygon points="250,404 243,415 257,415" fill="#fb923c" stroke="#c2410c" stroke-width="2"/><text x="144" y="250" font-size="26" fill="#9a3412" text-anchor="middle" font-weight="normal">Isıtma</text><line x1="217" y1="228" x2="217" y2="248" stroke="#c2410c" stroke-width="4" /><polygon points="211,246 223,246 217,256" fill="#c2410c"/><text x="180" y="451" font-size="26" fill="#475569" text-anchor="middle" font-weight="normal">Hacimler şematiktir.</text>
</svg>
