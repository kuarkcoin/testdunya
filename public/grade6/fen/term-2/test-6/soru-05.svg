<svg xmlns="http://www.w3.org/2000/svg" width="360" height="510" viewBox="0 0 360 510" role="img" font-family="DejaVu Sans, sans-serif">
<title>Saf maddelerin hâl değiştirme noktaları ve iki bölme</title>
<desc>Aynı basınçta P’nin erime noktası 10 °C, kaynama noktası 70 °C; R’nin erime noktası 30 °C, kaynama noktası 90 °C. I. bölme 15 °C, II. bölme 80 °C.</desc>
<rect width="360" height="510" fill="#ffffff"/>
<text x="180" y="36" font-size="29" fill="#172554" text-anchor="middle" font-weight="bold">Saf maddeler</text><rect x="12" y="61" width="336" height="223" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><line x1="12" y1="137" x2="348" y2="137" stroke="#94a3b8" stroke-width="2" /><line x1="12" y1="210" x2="348" y2="210" stroke="#cbd5e1" stroke-width="2" /><line x1="112" y1="61" x2="112" y2="284" stroke="#cbd5e1" stroke-width="2" /><line x1="210" y1="61" x2="210" y2="284" stroke="#cbd5e1" stroke-width="2" /><text x="62" y="101" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">Madde</text><text x="161" y="101" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">Erime</text><text x="279" y="101" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">Kaynama</text><text x="62" y="183" font-size="29" fill="#172554" text-anchor="middle" font-weight="bold">P</text><text x="161" y="183" font-size="27" fill="#172554" text-anchor="middle" font-weight="normal">10 °C</text><text x="279" y="183" font-size="27" fill="#172554" text-anchor="middle" font-weight="normal">70 °C</text><text x="62" y="257" font-size="29" fill="#172554" text-anchor="middle" font-weight="bold">R</text><text x="161" y="257" font-size="27" fill="#172554" text-anchor="middle" font-weight="normal">30 °C</text><text x="279" y="257" font-size="27" fill="#172554" text-anchor="middle" font-weight="normal">90 °C</text><text x="180" y="323" font-size="27" fill="#172554" text-anchor="middle" font-weight="bold">Bölme sıcaklıkları</text><rect x="14" y="344" width="152" height="119" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="90" y="386" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">I. bölme</text><text x="90" y="435" font-size="30" fill="#172554" text-anchor="middle" font-weight="bold">15 °C</text><rect x="194" y="344" width="152" height="119" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/><text x="270" y="386" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">II. bölme</text><text x="270" y="435" font-size="30" fill="#172554" text-anchor="middle" font-weight="bold">80 °C</text><text x="180" y="498" font-size="26" fill="#475569" text-anchor="middle" font-weight="normal">Basınç aynı ve sabit.</text>
