<svg xmlns="http://www.w3.org/2000/svg" width="360" height="680" viewBox="0 0 360 680" role="img" font-family="DejaVu Sans, sans-serif">
<title>Taşırma kabındaki başlangıç boşluğu ve toplama kabının tartımları</title>
<desc>Başlangıçtaki taşırma kabı: su 90 cm³ çizgisinde, taşma ağzı 100 cm³ çizgisinde. Katı tamamen batırıldığında taşan su ayrı bir kapta toplanıyor. Toplama kabı boşken 12 g; taşan suyla birlikte 32 g. Katının kütlesi 45 g. Şema ölçekli değildir.</desc>
<rect width="360" height="680" fill="#ffffff"/>
<text x="180" y="36" font-size="29" fill="#172554" text-anchor="middle" font-weight="bold">Taşırma deneyi</text><text x="93" y="83" font-size="26" fill="#172554" text-anchor="middle" font-weight="bold">Başlangıç</text><rect x="24" y="156" width="140" height="144" rx="0" fill="#bae6fd" stroke="#bae6fd" stroke-width="0"/><path d="M 24 111 L 24 301 L 164 301 L 164 141 L 202 141 L 216 162" fill="none" stroke="#475569" stroke-width="4"/><line x1="24" y1="156" x2="164" y2="156" stroke="#0284c7" stroke-width="3" /><line x1="26" y1="141" x2="167" y2="141" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/><line x1="167" y1="141" x2="211" y2="120" stroke="#64748b" stroke-width="2" /><text x="278" y="118" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">100 cm³</text><line x1="167" y1="156" x2="212" y2="181" stroke="#0284c7" stroke-width="2" /><text x="279" y="195" font-size="26" fill="#075985" text-anchor="middle" font-weight="normal">90 cm³</text><polygon points="237,252 257,228 292,231 310,258 297,278 248,276" fill="#a3a3a3" stroke="#475569" stroke-width="3"/><text x="273" y="313" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">45 g</text><text x="180" y="350" font-size="26" fill="#475569" text-anchor="middle" font-weight="normal">Şema ölçekli değildir.</text><text x="92" y="397" font-size="27" fill="#172554" text-anchor="middle" font-weight="bold">Boş kap</text><path d="M 44 421 L 44 488 L 140 488 L 140 421" fill="none" stroke="#475569" stroke-width="3"/><line x1="32" y1="496" x2="152" y2="496" stroke="#334155" stroke-width="6" /><rect x="39" y="503" width="106" height="48" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="92" y="537" font-size="29" fill="#172554" text-anchor="middle" font-weight="bold">12 g</text><text x="268" y="397" font-size="27" fill="#172554" text-anchor="middle" font-weight="bold">Su + kap</text><rect x="222" y="451" width="92" height="35" rx="0" fill="#7dd3fc" stroke="#7dd3fc" stroke-width="0"/><path d="M 220 421 L 220 488 L 316 488 L 316 421" fill="none" stroke="#475569" stroke-width="3"/><line x1="222" y1="451" x2="314" y2="451" stroke="#0284c7" stroke-width="3" /><line x1="208" y1="496" x2="328" y2="496" stroke="#334155" stroke-width="6" /><rect x="215" y="503" width="106" height="48" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="268" y="537" font-size="29" fill="#172554" text-anchor="middle" font-weight="bold">32 g</text><text x="180" y="602" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">Taşan suyun tamamı</text><text x="180" y="638" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">aynı kapta toplanır.</text>
</svg>
