<svg xmlns="http://www.w3.org/2000/svg" width="360" height="700" viewBox="0 0 360 700" role="img" font-family="DejaVu Sans, sans-serif">
<title>Ölçek kalibrasyonu ve katı hacminin ölçümü</title>
<desc>Aynı eşit bölmeli ölçü kabıyla iki deney: I’de 12 g su eklenince seviye 2. çizgiden 5. çizgiye çıkar. II’de 48 g katı tamamen batırılınca seviye 3. çizgiden 9. çizgiye çıkar. Şekilde bütün çizgiler eşit aralıklı; numaralar hacim birimi değildir.</desc>
