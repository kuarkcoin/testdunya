text x="285" y="304" font-size="30" fill="#172554" text-anchor="middle" font-weight="bold">5</text><text x="180" y="352" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">12 g su eklenir.</text><text x="180" y="405" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">II. deney</text><rect x="112" y="425" width="104" height="210" rx="0" fill="#fff" stroke="#64748b" stroke-width="2"/><rect x="114" y="464" width="100" height="169" rx="0" fill="#bae6fd" stroke="#bae6fd" stroke-width="2"/><line x1="112" y1="635" x2="126" y2="635" stroke="#475569" stroke-width="2"/><line x1="112" y1="616" x2="126" y2="616" stroke="#475569" stroke-width="2"/><line x1="112" y1="597" x2="126" y2="597" stroke="#475569" stroke-width="2"/><line x1="112" y1="578" x2="126" y2="578" stroke="#475569" stroke-width="2"/><text x="100" y="587" font-size="26" fill="#172554" text-anchor="end" font-weight="bold">3</text><line x1="112" y1="559" x2="126" y2="559" stroke="#475569" stroke-width="2"/><line x1="112" y1="540" x2="126" y2="540" stroke="#475569" stroke-width="2"/><line x1="112" y1="521" x2="126" y2="521" stroke="#475569" stroke-width="2"/><line x1="112" y1="502" x2="126" y2="502" stroke="#475569" stroke-width="2"/><line x1="112" y1="483" x2="126" y2="483" stroke="#475569" stroke-width="2"/><line x1="112" y1="464" x2="126" y2="464" stroke="#475569" stroke-width="2"/><text x="100" y="473" font-size="26" fill="#172554" text-anchor="end" font-weight="bold">9</text><line x1="112" y1="445" x2="126" y2="445" stroke="#475569" stroke-width="2"/><line x1="114" y1="578" x2="214" y2="578" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="7 5"/><text x="285" y="478" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">Önce</text><text x="285" y="517" font-size="30" fill="#172554" text-anchor="middle" font-weight="bold">3</text><text x="285" y="569" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">Sonra</text><text x="285" y="60