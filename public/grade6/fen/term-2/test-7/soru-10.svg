<svg xmlns="http://www.w3.org/2000/svg" width="360" height="500" viewBox="0 0 360 500" role="img" font-family="DejaVu Sans, sans-serif">
<title>Dört saf maddenin erime ve kaynama noktaları</title>
<desc>Aynı basınçta saf maddelerin erime ve kaynama noktaları: K için 10 ve 60 °C; L için 30 ve 90 °C; M için 50 ve 120 °C; N için 70 ve 150 °C.</desc>
<rect width="360" height="500" fill="#ffffff"/>
<text x="180" y="35" font-size="29" fill="#172554" text-anchor="middle" font-weight="bold">Saf maddeler</text><text x="180" y="73" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">Aynı basınçta (°C)</text><rect x="15" y="98" width="330" height="355" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><line x1="81" y1="98" x2="81" y2="453" stroke="#475569" stroke-width="3"/><line x1="205" y1="98" x2="205" y2="453" stroke="#475569" stroke-width="3"/><text x="49" y="143" font-size="26" fill="#172554" text-anchor="middle" font-weight="bold">Tür</text><text x="143" y="143" font-size="26" fill="#172554" text-anchor="middle" font-weight="bold">Erime</text><text x="275" y="143" font-size="26" fill="#172554" text-anchor="middle" font-weight="bold">Kaynama</text><line x1="15" y1="164" x2="345" y2="164" stroke="#475569" stroke-width="3"/><text x="49" y="210" font-size="29" fill="#172554" text-anchor="middle" font-weight="bold">K</text><text x="143" y="210" font-size="29" fill="#172554" text-anchor="middle" font-weight="normal">10</text><text x="275" y="210" font-size="29" fill="#172554" text-anchor="middle" font-weight="normal">60</text><line x1="15" y1="236" x2="345" y2="236" stroke="#475569" stroke-width="3"/><text x="49" y="282" font-size="29" fill="#172554" text-anchor="middle" font-weight="bold">L</text><text x="143" y="282" font-size="29" fill="#172554" text-anchor="middle" font-weight="normal">30</text><text x="275" y="282" font-size="29" fill="#172554" text-anchor="middle" font-weight="normal">90</text><line x1="15" y1="308" x2="345" y2="308" stroke="#475569" stroke-width="3"/><text x="49" y="354" font-size="29" fill="#172554" text-anchor="middle" font-weight="bold">M</text><text x="143" y="354" font-size="29" fill="#172554" text-anchor="middle" font-weight="normal">50</text><text x="275" y="354" font-size="29" fill="#172554" text-anchor="middle" font-weight="normal">120</text><line x1="15" y1="380" x2="345" y2="380" stroke="#475569" stroke-width="3"/><text x="49" y="426" font-size="29" fill="#172554" text-anchor="middle" font-weight="bold">N</text><text x="143" y="426" font-size="29" fill="#172554" text-anchor="middle" font-weight="normal">70</text><text x="275" y="426" font-size="29" fill="#172554" text-anchor="middle" font-weight="normal">150</text>
</svg>
