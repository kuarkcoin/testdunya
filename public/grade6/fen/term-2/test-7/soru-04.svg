<svg xmlns="http://www.w3.org/2000/svg" width="360" height="410" viewBox="0 0 360 410" role="img" font-family="DejaVu Sans, sans-serif">
<title>X maddesinin yoğuşma gözlemi</title>
<desc>Saf X gazı soğutulurken 76 °C’de sıvıya dönüşüyor; kapta gaz ve sıvı birlikte bulunuyor. Termometre 76 °C gösteriyor.</desc>
<rect width="360" height="410" fill="#ffffff"/>
<text x="180" y="37" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">Saf X soğutuluyor</text><text x="180" y="78" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">Basınç sabit</text><rect x="34" y="115" width="194" height="244" rx="10" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><rect x="37" y="270" width="188" height="86" rx="0" fill="#93c5fd" stroke="#93c5fd" stroke-width="2"/><text x="130" y="160" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">Gaz</text><text x="130" y="326" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">Sıvı</text><circle cx="65" cy="205" r="6" fill="#64748b"/><circle cx="112" cy="223" r="6" fill="#64748b"/><circle cx="164" cy="205" r="6" fill="#64748b"/><circle cx="198" cy="238" r="6" fill="#64748b"/><rect x="267" y="124" width="25" height="195" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><rect x="274" y="195" width="11" height="122" rx="3" fill="#ef4444" stroke="#ef4444" stroke-width="2"/><circle cx="279" cy="325" r="19" fill="#ef4444" stroke="#475569" stroke-width="3"/><text x="279" y="101" font-size="27" fill="#172554" text-anchor="middle" font-weight="bold">76 °C</text><text x="180" y="394" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">Gaz → sıvı</text>
</svg>
