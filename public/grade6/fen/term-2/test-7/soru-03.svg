<svg xmlns="http://www.w3.org/2000/svg" width="360" height="460" viewBox="0 0 360 460" role="img" font-family="DejaVu Sans, sans-serif">
<title>Sıcaklığa bağlı tel görünümü</title>
<desc>Aynı uzaklıktaki iki direk arasında soğuk havada az sarkan, sıcak havada daha çok sarkan aynı tel gösteriliyor.</desc>
<rect width="360" height="460" fill="#ffffff"/>
<text x="180" y="34" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">Aynı tel ve direkler</text><text x="180" y="80" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">Soğuk hava</text><line x1="35" y1="110" x2="35" y2="225" stroke="#64748b" stroke-width="9"/><line x1="325" y1="110" x2="325" y2="225" stroke="#64748b" stroke-width="9"/><path d="M 35 115 Q 180 140 325 115" fill="none" stroke="#1d4ed8" stroke-width="5"/><text x="180" y="274" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">Sıcak hava</text><line x1="35" y1="304" x2="35" y2="419" stroke="#64748b" stroke-width="9"/><line x1="325" y1="304" x2="325" y2="419" stroke="#64748b" stroke-width="9"/><path d="M 35 309 Q 180 404 325 309" fill="none" stroke="#1d4ed8" stroke-width="5"/>
</svg>
