<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720" role="img" font-family="DejaVu Sans, sans-serif">
<title>Mevcut koruma ve üç onarım seçeneği</title>
<desc>Mevcut koruma: K üreme, L üreme, M beslenme. Onarım I: K beslenme ve M üreme; mevcut M beslenme alanı kaybolur. Onarım II: L beslenme ve M beslenme. Onarım III: K beslenme ve L beslenme.</desc>
<rect width="360" height="720" fill="#ffffff"/>
<text x="180" y="35" font-size="29" fill="#172554" text-anchor="middle" font-weight="bold">Koruma planı</text><rect x="14" y="61" width="332" height="165" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="180" y="98" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">Mevcut koruma</text><text x="180" y="143" font-size="28" fill="#172554" text-anchor="middle" font-weight="normal">K ve L: üreme</text><text x="180" y="187" font-size="28" fill="#172554" text-anchor="middle" font-weight="normal">M: beslenme</text><rect x="14" y="247" width="332" height="188" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="49" y="289" font-size="30" fill="#172554" text-anchor="middle" font-weight="bold">I</text><text x="213" y="290" font-size="27" fill="#172554" text-anchor="middle" font-weight="normal">K: beslenme</text><text x="213" y="330" font-size="27" fill="#172554" text-anchor="middle" font-weight="normal">M: üreme</text><text x="180" y="372" font-size="26" fill="#b91c1c" text-anchor="middle" font-weight="normal">Mevcut M beslenme</text><text x="180" y="408" font-size="26" fill="#b91c1c" text-anchor="middle" font-weight="normal">alanı kaybolur.</text><rect x="14" y="453" width="332" height="112" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="49" y="495" font-size="30" fill="#172554" text-anchor="middle" font-weight="bold">II</text><text x="213" y="496" font-size="27" fill="#172554" text-anchor="middle" font-weight="normal">L: beslenme</text><text x="213" y="536" font-size="27" fill="#172554" text-anchor="middle" font-weight="normal">M: beslenme</text><rect x="14" y="579" width="332" height="112" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="49" y="621" font-size="30" fill="#172554" text-anchor="middle" font-weight="bold">III</text><text x="213" y="622" font-size="27" fill="#172554" text-anchor="middle" font-weight="normal">K: beslenme</text><text x="213" y="662" font-size="27" fill="#172554" text-anchor="middle" font-weight="normal">L: beslenme</text>
</svg>
