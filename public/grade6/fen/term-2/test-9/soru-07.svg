<svg xmlns="http://www.w3.org/2000/svg" width="360" height="600" viewBox="0 0 360 600" role="img"><title>Genleşmeyle kapanan temas boşluğu</title><desc>İki çubuğun serbest uçları aynı boşluğa doğru ilerler. Serbest uzama tablosu K0,1/0,3;L0,2/0,5;M0,4/0,6mm.</desc><rect width="360" height="600" fill="#ffffff"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="180" y="36" font-size="27" fill="#14243a" text-anchor="middle" font-weight="bold">Temasla yanan uyarı</text><text x="180" y="75" font-size="26" fill="#14243a" text-anchor="middle" font-weight="normal">20 °C: uçlar ayrı</text><rect x="17" y="110" width="16" height="80" rx="1" fill="#64748b" stroke="#475569" stroke-width="2"/><rect x="327" y="110" width="16" height="80" rx="1" fill="#64748b" stroke="#475569" stroke-width="2"/><rect x="33" y="132" width="105" height="34" rx="2" fill="#7dd3fc" stroke="#0369a1" stroke-width="2"/><rect x="222" y="132" width="105" height="34" rx="2" fill="#fde68a" stroke="#a16207" stroke-width="2"/><line x1="69" y1="205" x2="138" y2="205" stroke="#0f766e" stroke-width="4"/><polygon points="138,205 127,198 127,212" fill="#0f766e"/><line x1="290" y1="205" x2="222" y2="205" stroke="#0f766e" stroke-width="4"/><polygon points="222,205 233,198 233,212" fill="#0f766e"/><text x="180" y="120" font-size="26" fill="#14243a" text-anchor="middle" font-weight="normal">Boşluk</text><line x1="138" y1="178" x2="222" y2="178" stroke="#7c3aed" stroke-width="3"/><line x1="138" y1="171" x2="138" y2="185" stroke="#7c3aed" stroke-width="3"/><line x1="222" y1="171" x2="222" y2="185" stroke="#7c3aed" stroke-width="3"/><text x="180" y="253" font-size="27" fill="#14243a" text-anchor="middle" font-weight="bold">Serbest uzama (mm)</text><text x="180" y="289" font-size="26" fill="#14243a" text-anchor="middle" font-weight="normal">20 °C’ye göre</text><rect x="15" y="310" width="330" height="230" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/><rect x="15" y="310" width="330" height="62" rx="8" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/><line x1="116" y1="310" x2="116" y2="540" stroke="#94a3b8" stroke-width="2"/><line x1="229" y1="310" x2="229" y2="540" stroke="#94a3b8" stroke-width="2"/><text x="66" y="350" font-size="26" fill="#14243a" text-anchor="middle" font-weight="normal">Çubuk</text><text x="172" y="350" font-size="26" fill="#14243a" text-anchor="middle" font-weight="normal">40 °C</text><text x="288" y="350" font-size="26" fill="#14243a" text-anchor="middle" font-weight="normal">60 °C</text><line x1="15" y1="372" x2="345" y2="372" stroke="#cbd5e1" stroke-width="2"/><text x="65" y="410" font-size="28" fill="#14243a" text-anchor="middle" font-weight="bold">K</text><text x="172" y="410" font-size="28" fill="#14243a" text-anchor="middle" font-weight="normal">0,1</text><text x="287" y="410" font-size="28" fill="#14243a" text-anchor="middle" font-weight="normal">0,3</text><line x1="15" y1="428" x2="345" y2="428" stroke="#cbd5e1" stroke-width="2"/><text x="65" y="466" font-size="28" fill="#14243a" text-anchor="middle" font-weight="bold">L</text><text x="172" y="466" font-size="28" fill="#14243a" text-anchor="middle" font-weight="normal">0,2</text><text x="287" y="466" font-size="28" fill="#14243a" text-anchor="middle" font-weight="normal">0,5</text><line x1="15" y1="484" x2="345" y2="484" stroke="#cbd5e1" stroke-width="2"/><text x="65" y="522" font-size="28" fill="#14243a" text-anchor="middle" font-weight="bold">M</text><text x="172" y="522" font-size="28" fill="#14243a" text-anchor="middle" font-weight="normal">0,4</text><text x="287" y="522" font-size="28" fill="#14243a" text-anchor="middle" font-weight="normal">0,6</text><text x="180" y="578" font-size="26" fill="#14243a" text-anchor="middle" font-weight="normal">Şema ölçekli değildir.</text></g></svg>
