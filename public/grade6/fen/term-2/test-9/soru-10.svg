<svg xmlns="http://www.w3.org/2000/svg" width="360" height="820" viewBox="0 0 360 820" role="img"><title>Gazın ısıtılması, boşaltılması ve yeniden ekleme</title><desc>6mg pay20°C’de5cm³,80°C’de6cm³.50cm³20°C ile başla;80°C’yeısıt;48cm³kalana kadarboşalt;20°C’yesoğut;5cm³20°C gazekle;80°C’yeısıt.</desc><rect width="360" height="820" fill="#ffffff"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="180" y="35" font-size="27" fill="#14243a" text-anchor="middle" font-weight="bold">Gaz modeli ve işlemler</text><rect x="16" y="53" width="328" height="115" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="180" y="86" font-size="28" fill="#14243a" text-anchor="middle" font-weight="bold">1 pay = 6 mg</text><text x="180" y="120" font-size="26" fill="#14243a" text-anchor="middle" font-weight="normal">20 °C → 5 cm³</text><text x="180" y="153" font-size="26" fill="#14243a" text-anchor="middle" font-weight="normal">80 °C → 6 cm³</text><rect x="16" y="191" width="328" height="80" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="180" y="222" font-size="26" fill="#14243a" text-anchor="middle" font-weight="bold">1. Başlangıç</text><text x="180" y="255" font-size="26" fill="#14243a" text-anchor="middle" font-weight="normal">20 °C’de 50 cm³</text><line x1="180" y1="273" x2="180" y2="288" stroke="#0f766e" stroke-width="4"/><polygon points="180,294 173,284 187,284" fill="#0f766e"/><rect x="16" y="294" width="328" height="80" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="180" y="325" font-size="26" fill="#14243a" text-anchor="middle" font-weight="bold">2. Kapalıyken ısıt</text><text x="180" y="358" font-size="26" fill="#14243a" text-anchor="middle" font-weight="normal">80 °C’ye getir</text><line x1="180" y1="376" x2="180" y2="391" stroke="#0f766e" stroke-width="4"/><polygon points="180,397 173,387 187,387" fill="#0f766e"/><rect x="16" y="397" width="328" height="80" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="180" y="428" font-size="26" fill="#14243a" text-anchor="middle" font-weight="bold">3. Gaz boşalt</text><text x="180" y="461" font-size="26" fill="#14243a" text-anchor="middle" font-weight="normal">80 °C’de 48 cm³ kalsın</text><line x1="180" y1="479" x2="180" y2="494" stroke="#0f766e" stroke-width="4"/><polygon points="180,500 173,490 187,490" fill="#0f766e"/><rect x="16" y="500" width="328" height="80" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="180" y="531" font-size="26" fill="#14243a" text-anchor="middle" font-weight="bold">4. Kapat ve soğut</text><text x="180" y="564" font-size="26" fill="#14243a" text-anchor="middle" font-weight="normal">20 °C’ye getir</text><line x1="180" y1="582" x2="180" y2="597" stroke="#0f766e" stroke-width="4"/><polygon points="180,603 173,593 187,593" fill="#0f766e"/><rect x="16" y="603" width="328" height="80" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="180" y="634" font-size="26" fill="#14243a" text-anchor="middle" font-weight="bold">5. Gaz ekle ve kapat</text><text x="180" y="667" font-size="26" fill="#14243a" text-anchor="middle" font-weight="normal">20 °C’deki 5 cm³ gaz</text><line x1="180" y1="685" x2="180" y2="700" stroke="#0f766e" stroke-width="4"/><polygon points="180,706 173,696 187,696" fill="#0f766e"/><rect x="16" y="706" width="328" height="80" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="180" y="737" font-size="26" fill="#14243a" text-anchor="middle" font-weight="bold">6. Yeniden ısıt</text><text x="180" y="770" font-size="26" fill="#14243a" text-anchor="middle" font-weight="normal">80 °C’ye getir</text></g></svg>
