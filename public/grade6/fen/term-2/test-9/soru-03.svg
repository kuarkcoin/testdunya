<svg xmlns="http://www.w3.org/2000/svg" width="360" height="530" viewBox="0 0 360 530" role="img"><title>Su donarken çatlayan şişe</title><desc>Tam dolu sert şişedeki sıvı su donduktan sonra şişede bir çatlak görülüyor. Şema ölçekli değildir.</desc><rect width="360" height="530" fill="#ffffff"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="180" y="36" font-size="28" fill="#14243a" text-anchor="middle" font-weight="bold">Donma sırasında</text><text x="180" y="72" font-size="26" fill="#14243a" text-anchor="middle" font-weight="normal">Sert şişe modeli</text><text x="92" y="122" font-size="28" fill="#14243a" text-anchor="middle" font-weight="bold">Önce</text><path d="M69 155 L115 155 L115 192 Q139 202 139 225 L139 394 L45 394 L45 225 Q45 202 69 192 Z" fill="#7dd3fc" stroke="#334155" stroke-width="4"/><rect x="64" y="143" width="56" height="14" rx="2" fill="#94a3b8" stroke="#334155" stroke-width="2"/><text x="267" y="122" font-size="28" fill="#14243a" text-anchor="middle" font-weight="bold">Sonra</text><path d="M244 155 L290 155 L290 192 Q314 202 314 225 L314 394 L220 394 L220 225 Q220 202 244 192 Z" fill="#dbeafe" stroke="#334155" stroke-width="4"/><rect x="239" y="143" width="56" height="14" rx="2" fill="#94a3b8" stroke="#334155" stroke-width="2"/><text x="92" y="275" font-size="28" fill="#14243a" text-anchor="middle" font-weight="normal">Sıvı</text><text x="92" y="312" font-size="28" fill="#14243a" text-anchor="middle" font-weight="normal">su</text><text x="255" y="290" font-size="28" fill="#14243a" text-anchor="middle" font-weight="normal">Buz</text><path d="M306 217 L285 247 L306 266 L285 297 L307 322 L290 348 L312 376" fill="none" stroke="#dc2626" stroke-width="6"/><text x="180" y="445" font-size="26" fill="#14243a" text-anchor="middle" font-weight="normal">Başlangıçta boşluk yok.</text><text x="180" y="485" font-size="26" fill="#14243a" text-anchor="middle" font-weight="normal">Donunca şişe çatlıyor.</text></g></svg>
