<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480" role="img" font-family="Arial, sans-serif"><title>Isıtıcının kısa süre kapatıldığı sıcaklık-zaman grafiği</title><desc>Sıcaklık-zaman grafiği: 0. dakika 20 °C; 2–4. dakikalar 50 °C; 6–8. dakikalar 80 °C; 10–12. dakikalar 90 °C. Aradaki yükselişler doğrusaldır. Isıtıcı yalnız 6–8. dakikalarda kapalıdır.</desc><rect x="0" y="0" width="360" height="480" rx="16" fill="#fff"/><text x="180" y="34" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="bold">Sıcaklık (°C)</text><line x1="55" y1="58" x2="55" y2="335" stroke="#334155" stroke-width="3"/><line x1="55" y1="335" x2="338" y2="335" stroke="#334155" stroke-width="3"/><text x="46" y="344.0" font-size="26" fill="#0f172a" text-anchor="end" font-weight="normal">20</text><line x1="55" y1="335.0" x2="333" y2="335.0" stroke="#cbd5e1" stroke-width="1"/><text x="46" y="242.0" font-size="26" fill="#0f172a" text-anchor="end" font-weight="normal">50</text><line x1="55" y1="233.0" x2="333" y2="233.0" stroke="#cbd5e1" stroke-width="1"/><text x="46" y="140.0" font-size="26" fill="#0f172a" text-anchor="end" font-weight="normal">80</text><line x1="55" y1="131.0" x2="333" y2="131.0" stroke="#cbd5e1" stroke-width="1"/><text x="46" y="106.0" font-size="26" fill="#0f172a" text-anchor="end" font-weight="normal">90</text><line x1="55" y1="97.0" x2="333" y2="97.0" stroke="#cbd5e1" stroke-width="1"/><polyline points="55,335.0 101,233.0 147,233.0 193,131.0 239,131.0 285,97.0 331,97.0" fill="none" stroke="#0f766e" stroke-width="5"/><circle cx="55" cy="335.0" r="4" fill="#0f766e" stroke="none" stroke-width="3"/><circle cx="101" cy="233.0" r="4" fill="#0f766e" stroke="none" stroke-width="3"/><circle cx="147" cy="233.0" r="4" fill="#0f766e" stroke="none" stroke-width="3"/><circle cx="193" cy="131.0" r="4" fill="#0f766e" stroke="none" stroke-width="3"/><circle cx="239" cy="131.0" r="4" fill="#0f766e" stroke="none" stroke-width="3"/><circle cx="285" cy="97.0" r="4" fill="#0f766e" stroke="none" stroke-width="3"/><circle cx="331" cy="97.0" r="4" fill="#0f766e" stroke="none" stroke-width="3"/><line x1="55" y1="335" x2="55" y2="342" stroke="#334155" stroke-width="3"/><text x="55" y="371" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="normal">0</text><line x1="101" y1="335" x2="101" y2="342" stroke="#334155" stroke-width="3"/><text x="101" y="371" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="normal">2</text><line x1="147" y1="335" x2="147" y2="342" stroke="#334155" stroke-width="3"/><text x="147" y="371" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="normal">4</text><line x1="193" y1="335" x2="193" y2="342" stroke="#334155" stroke-width="3"/><text x="193" y="371" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="normal">6</text><line x1="239" y1="335" x2="239" y2="342" stroke="#334155" stroke-width="3"/><text x="239" y="371" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="normal">8</text><line x1="285" y1="335" x2="285" y2="342" stroke="#334155" stroke-width="3"/><text x="285" y="371" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="normal">10</text><line x1="331" y1="335" x2="331" y2="342" stroke="#334155" stroke-width="3"/><text x="331" y="371" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="normal">12</text><text x="180" y="407" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="normal">Zaman (dakika)</text><line x1="193" y1="437" x2="239" y2="437" stroke="#b45309" stroke-width="10"/><text x="180" y="470" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="normal">6–8: Isıtıcı kapalı</text></svg>
