<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430" role="img" font-family="Arial, sans-serif"><title>İki denemenin renkli ışık enerjileri</title><desc>I. ışık paketi: üç eşit kırmızı enerji bölmesi ve bir mavi bölme. II. paket: bir kırmızı bölme ve üç eşit mavi bölme. Her paket ayrı ayrı iki yüzeyin her birine gönderilir.</desc><rect x="0" y="0" width="360" height="430" rx="16" fill="#fff"/><text x="180" y="38" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="bold">Işık enerjisi paketleri</text><rect x="16" y="70" width="328" height="148" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="32" y="104" font-size="28" fill="#0f172a" text-anchor="start" font-weight="bold">I. deneme</text><rect x="32" y="122" width="67" height="48" rx="3" fill="#ef4444" stroke="none" stroke-width="2"/><text x="65" y="156" font-size="26" fill="white" text-anchor="middle" font-weight="bold">K</text><rect x="106" y="122" width="67" height="48" rx="3" fill="#ef4444" stroke="none" stroke-width="2"/><text x="139" y="156" font-size="26" fill="white" text-anchor="middle" font-weight="bold">K</text><rect x="180" y="122" width="67" height="48" rx="3" fill="#ef4444" stroke="none" stroke-width="2"/><text x="213" y="156" font-size="26" fill="white" text-anchor="middle" font-weight="bold">K</text><rect x="254" y="122" width="67" height="48" rx="3" fill="#2563eb" stroke="none" stroke-width="2"/><text x="287" y="156" font-size="26" fill="white" text-anchor="middle" font-weight="bold">M</text><text x="32" y="201" font-size="26" fill="#0f172a" text-anchor="start" font-weight="normal">Her bölme = 1 birim</text><rect x="16" y="235" width="328" height="148" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="32" y="269" font-size="28" fill="#0f172a" text-anchor="start" font-weight="bold">II. deneme</text><rect x="32" y="287" width="67" height="48" rx="3" fill="#ef4444" stroke="none" stroke-width="2"/><text x="65" y="321" font-size="26" fill="white" text-anchor="middle" font-weight="bold">K</text><rect x="106" y="287" width="67" height="48" rx="3" fill="#2563eb" stroke="none" stroke-width="2"/><text x="139" y="321" font-size="26" fill="white" text-anchor="middle" font-weight="bold">M</text><rect x="180" y="287" width="67" height="48" rx="3" fill="#2563eb" stroke="none" stroke-width="2"/><text x="213" y="321" font-size="26" fill="white" text-anchor="middle" font-weight="bold">M</text><rect x="254" y="287" width="67" height="48" rx="3" fill="#2563eb" stroke="none" stroke-width="2"/><text x="287" y="321" font-size="26" fill="white" text-anchor="middle" font-weight="bold">M</text><text x="32" y="366" font-size="26" fill="#0f172a" text-anchor="start" font-weight="normal">Her bölme = 1 birim</text><text x="180" y="416" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="normal">K: kırmızı   M: mavi</text></svg>
