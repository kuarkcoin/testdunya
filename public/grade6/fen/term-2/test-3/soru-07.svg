<svg xmlns="http://www.w3.org/2000/svg" width="360" height="530" viewBox="0 0 360 530" role="img" font-family="Arial, sans-serif"><title>Sulak alanda tür kimliklerinin iki taramada değişimi</title><desc>Tür kayıt tablosu. İlk tarama: A, B, C, D var; E, F yok. Son tarama: A, B, E, F var; C, D yok. A–D yerli, E–F sonradan getirilen türlerdir. Dolu daire kayıt var, kısa çizgi kayıt yok anlamındadır.</desc><rect x="0" y="0" width="360" height="530" rx="16" fill="#fff"/><text x="180" y="35" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="bold">Sulak alan tür kayıtları</text><rect x="18" y="55" width="324" height="354" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="2"/><rect x="18" y="55" width="324" height="54" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="66" y="91" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="bold">Tür</text><text x="177" y="91" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="bold">İlk</text><text x="279" y="91" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="bold">Son</text><line x1="18" y1="109" x2="342" y2="109" stroke="#cbd5e1" stroke-width="1"/><text x="66" y="144" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="bold">A</text><circle cx="177" cy="134" r="9" fill="#0f766e" stroke="none" stroke-width="3"/><circle cx="279" cy="134" r="9" fill="#0f766e" stroke="none" stroke-width="3"/><line x1="18" y1="159" x2="342" y2="159" stroke="#cbd5e1" stroke-width="1"/><text x="66" y="194" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="bold">B</text><circle cx="177" cy="184" r="9" fill="#0f766e" stroke="none" stroke-width="3"/><circle cx="279" cy="184" r="9" fill="#0f766e" stroke="none" stroke-width="3"/><line x1="18" y1="209" x2="342" y2="209" stroke="#cbd5e1" stroke-width="1"/><text x="66" y="244" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="bold">C</text><circle cx="177" cy="234" r="9" fill="#0f766e" stroke="none" stroke-width="3"/><line x1="270" y1="234" x2="288" y2="234" stroke="#64748b" stroke-width="3"/><line x1="18" y1="259" x2="342" y2="259" stroke="#cbd5e1" stroke-width="1"/><text x="66" y="294" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="bold">D</text><circle cx="177" cy="284" r="9" fill="#0f766e" stroke="none" stroke-width="3"/><line x1="270" y1="284" x2="288" y2="284" stroke="#64748b" stroke-width="3"/><line x1="18" y1="309" x2="342" y2="309" stroke="#cbd5e1" stroke-width="1"/><text x="66" y="344" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="bold">E</text><line x1="168" y1="334" x2="186" y2="334" stroke="#64748b" stroke-width="3"/><circle cx="279" cy="334" r="9" fill="#0f766e" stroke="none" stroke-width="3"/><line x1="18" y1="359" x2="342" y2="359" stroke="#cbd5e1" stroke-width="1"/><text x="66" y="394" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="bold">F</text><line x1="168" y1="384" x2="186" y2="384" stroke="#64748b" stroke-width="3"/><circle cx="279" cy="384" r="9" fill="#0f766e" stroke="none" stroke-width="3"/><line x1="115" y1="55" x2="115" y2="409" stroke="#cbd5e1" stroke-width="1"/><line x1="230" y1="55" x2="230" y2="409" stroke="#cbd5e1" stroke-width="1"/><text x="26" y="443" font-size="26" fill="#0f172a" text-anchor="start" font-weight="normal">A–D: Yerli türler</text><text x="26" y="477" font-size="26" fill="#0f172a" text-anchor="start" font-weight="normal">E–F: Getirilen türler</text><circle cx="29" cy="501" r="6" fill="#0f766e" stroke="none" stroke-width="3"/><text x="44" y="509" font-size="26" fill="#0f172a" text-anchor="start" font-weight="normal">Var</text><line x1="142" y1="501" x2="158" y2="501" stroke="#334155" stroke-width="3"/><text x="173" y="509" font-size="26" fill="#0f172a" text-anchor="start" font-weight="normal">Kayıt yok</text></svg>
