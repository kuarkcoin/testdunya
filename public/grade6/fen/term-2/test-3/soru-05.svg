<svg xmlns="http://www.w3.org/2000/svg" width="360" height="470" viewBox="0 0 360 470" role="img" font-family="Arial, sans-serif"><title>Ek tel ile kullanılan reosta bölümünün başlangıç bağlantısı</title><desc>Başlangıç devresi: 20 cm ek tel ve sürgüsü D’de olan reosta. Reosta üzerinde A: 0 cm, B: 10 cm, C: 20 cm, D: 30 cm, E: 40 cm; uzaklıklar A’dan ölçülür. A ve sürgü devreye bağlıdır.</desc><rect x="0" y="0" width="360" height="470" rx="16" fill="#fff"/><text x="180" y="36" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="bold">Başlangıç düzeni</text><path d="M40 258 V92 H90 M133 92 H232 M278 92 H301 V170 H245 V237" fill="none" stroke="#334155" stroke-width="4"/><line x1="90" y1="67" x2="90" y2="117" stroke="#334155" stroke-width="5"/><line x1="109" y1="79" x2="109" y2="105" stroke="#334155" stroke-width="5"/><line x1="109" y1="92" x2="133" y2="92" stroke="#334155" stroke-width="3"/><circle cx="255" cy="92" r="23" fill="#fef08a" stroke="#334155" stroke-width="3"/><line x1="240" y1="77" x2="270" y2="107" stroke="#334155" stroke-width="3"/><line x1="240" y1="107" x2="270" y2="77" stroke="#334155" stroke-width="3"/><line x1="40" y1="137" x2="40" y2="212" stroke="#b45309" stroke-width="9"/><text x="64" y="168" font-size="26" fill="#0f172a" text-anchor="start" font-weight="normal">Ek tel</text><text x="64" y="199" font-size="28" fill="#0f172a" text-anchor="start" font-weight="bold">20 cm</text><line x1="40" y1="258" x2="312" y2="258" stroke="#0f766e" stroke-width="11"/><line x1="40" y1="245" x2="40" y2="272" stroke="#334155" stroke-width="3"/><text x="40" y="307" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="bold">A</text><text x="40" y="341" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="normal">0</text><line x1="108" y1="245" x2="108" y2="272" stroke="#334155" stroke-width="3"/><text x="108" y="307" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="bold">B</text><text x="108" y="341" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="normal">10</text><line x1="176" y1="245" x2="176" y2="272" stroke="#334155" stroke-width="3"/><text x="176" y="307" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="bold">C</text><text x="176" y="341" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="normal">20</text><line x1="244" y1="245" x2="244" y2="272" stroke="#334155" stroke-width="3"/><text x="244" y="307" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="bold">D</text><text x="244" y="341" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="normal">30</text><line x1="312" y1="245" x2="312" y2="272" stroke="#334155" stroke-width="3"/><text x="312" y="307" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="bold">E</text><text x="312" y="341" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="normal">40</text><polygon points="245,258 234,237 256,237" fill="#7c3aed"/><text x="264" y="217" font-size="28" fill="#7c3aed" text-anchor="middle" font-weight="bold">S</text><text x="180" y="385" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="normal">A’dan uzaklık (cm)</text><text x="180" y="427" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="normal">Sürgü S, D noktasında.</text></svg>
