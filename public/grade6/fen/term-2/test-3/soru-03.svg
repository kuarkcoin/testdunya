<svg xmlns="http://www.w3.org/2000/svg" width="360" height="510" viewBox="0 0 360 510" role="img" font-family="Arial, sans-serif"><title>Üç cismin ikili tartımları</title><desc>Her cismin hacmi 10 cm³. Birinci tartımda X ve Y toplam 36 g; ikinci tartımda Y ve Z toplam 48 g; üçüncü tartımda X ve Z toplam 42 g.</desc><rect x="0" y="0" width="360" height="510" rx="16" fill="#fff"/><text x="180" y="38" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="bold">Her cisim: 10 cm³</text><rect x="18" y="65" width="324" height="132" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><rect x="51" y="80" width="70" height="52" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="86" y="117" font-size="29" fill="#0f172a" text-anchor="middle" font-weight="bold">X</text><text x="154" y="117" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="normal">+</text><rect x="187" y="80" width="70" height="52" rx="10" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="222" y="117" font-size="29" fill="#0f172a" text-anchor="middle" font-weight="bold">Y</text><line x1="39" y1="142" x2="276" y2="142" stroke="#334155" stroke-width="3"/><rect x="116" y="152" width="128" height="35" rx="5" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="180" y="179" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="bold">36 g</text><rect x="18" y="210" width="324" height="132" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><rect x="51" y="225" width="70" height="52" rx="10" fill="#fef3c7" stroke="#94a3b8" stroke-width="2"/><text x="86" y="262" font-size="29" fill="#0f172a" text-anchor="middle" font-weight="bold">Y</text><text x="154" y="262" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="normal">+</text><rect x="187" y="225" width="70" height="52" rx="10" fill="#ede9fe" stroke="#94a3b8" stroke-width="2"/><text x="222" y="262" font-size="29" fill="#0f172a" text-anchor="middle" font-weight="bold">Z</text><line x1="39" y1="287" x2="276" y2="287" stroke="#334155" stroke-width="3"/><rect x="116" y="297" width="128" height="35" rx="5" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="180" y="324" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="bold">48 g</text><rect x="18" y="355" width="324" height="132" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><rect x="51" y="370" width="70" height="52" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="2"/><text x="86" y="407" font-size="29" fill="#0f172a" text-anchor="middle" font-weight="bold">X</text><text x="154" y="407" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="normal">+</text><rect x="187" y="370" width="70" height="52" rx="10" fill="#ede9fe" stroke="#94a3b8" stroke-width="2"/><text x="222" y="407" font-size="29" fill="#0f172a" text-anchor="middle" font-weight="bold">Z</text><line x1="39" y1="432" x2="276" y2="432" stroke="#334155" stroke-width="3"/><rect x="116" y="442" width="128" height="35" rx="5" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="180" y="469" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="bold">42 g</text></svg>
