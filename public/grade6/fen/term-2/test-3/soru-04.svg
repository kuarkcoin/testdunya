<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430" role="img" font-family="Arial, sans-serif"><title>K parçasını atlayan bakır köprülü devre</title><desc>Pil ve ampul, soldaki ve sağdaki temas noktalarına bağlıdır. Bu noktaların arasında K parçası vardır. Aynı iki noktayı K’ye uğramadan bağlayan ikinci yol, üstteki kesintisiz bakır köprüdür.</desc><rect x="0" y="0" width="360" height="430" rx="16" fill="#fff"/><text x="180" y="38" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="bold">İletkenlik düzeneği</text><path d="M62 206 V110 H298 V206" fill="none" stroke="#b45309" stroke-width="8"/><text x="180" y="86" font-size="28" fill="#92400e" text-anchor="middle" font-weight="bold">Bakır köprü</text><line x1="62" y1="206" x2="123" y2="206" stroke="#334155" stroke-width="3"/><rect x="123" y="181" width="114" height="50" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/><text x="180" y="216" font-size="30" fill="#0f172a" text-anchor="middle" font-weight="bold">K</text><line x1="237" y1="206" x2="298" y2="206" stroke="#334155" stroke-width="3"/><path d="M62 206 V340 H124 M158 340 H232 M278 340 H298 V206" fill="none" stroke="#334155" stroke-width="4"/><line x1="124" y1="314" x2="124" y2="366" stroke="#334155" stroke-width="5"/><line x1="143" y1="326" x2="143" y2="354" stroke="#334155" stroke-width="5"/><line x1="143" y1="340" x2="158" y2="340" stroke="#334155" stroke-width="3"/><circle cx="255" cy="340" r="23" fill="#fef08a" stroke="#334155" stroke-width="3"/><line x1="240" y1="325" x2="270" y2="355" stroke="#334155" stroke-width="3"/><line x1="240" y1="355" x2="270" y2="325" stroke="#334155" stroke-width="3"/><circle cx="62" cy="206" r="7" fill="#0f766e" stroke="none" stroke-width="3"/><circle cx="298" cy="206" r="7" fill="#0f766e" stroke="none" stroke-width="3"/><text x="131" y="402" font-size="26" fill="#0f172a" text-anchor="middle" font-weight="normal">Pil</text><text x="255" y="402" font-size="26" fill="#0f172a"