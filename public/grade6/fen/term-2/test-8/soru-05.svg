<svg xmlns="http://www.w3.org/2000/svg" width="360" height="470" viewBox="0 0 360 470" role="img">
<title>Levhaların sıcaklıkları</title><desc>Sıcaklık kayıtları: siyah K levhası başlangıçta 10 °C, sonunda 22 °C; beyaz L levhası başlangıçta 20 °C, sonunda 26 °C. Aynı ışık, uzaklık ve süre kullanılmıştır.</desc>
<rect width="360" height="470" rx="18" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" font-size="26">
<text x="180" y="40" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">Sıcaklık kayıtları</text><rect x="18" y="66" width="324" height="172" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><rect x="38" y="86" width="48" height="48" rx="4" fill="#111111" stroke="#334155" stroke-width="2"/><text x="104" y="121" font-size="28" fill="#172554" text-anchor="start" font-weight="bold">K • siyah</text><text x="38" y="169" font-size="26" fill="#172554" text-anchor="start" font-weight="normal">Başlangıç: 10 °C</text><text x="38" y="211" font-size="26" fill="#172554" text-anchor="start" font-weight="normal">Son: 22 °C</text><rect x="18" y="258" width="324" height="172" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><rect x="38" y="278" width="48" height="48" rx="4" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="104" y="313" font-size="28" fill="#172554" text-anchor="start" font-weight="bold">L • beyaz</text><text x="38" y="361" font-size="26" fill="#172554" text-anchor="start" font-weight="normal">Başlangıç: 20 °C</text><text x="38" y="403" font-size="26" fill="#172554" text-anchor="start" font-weight="normal">Son: 26 °C</text>
</g></svg>
