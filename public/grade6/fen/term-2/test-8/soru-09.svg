<svg xmlns="http://www.w3.org/2000/svg" width="360" height="770" viewBox="0 0 360 770" role="img">
<title>Boncuk yığını ve su tartımları</title><desc>Ölçü kabı boşken 25 g; aynı kap kuru boncuklarla 135 g. Boncuk yığını hava aralıklarıyla birlikte 100 cm³ çizgisine kadar. Verici su kabı dökmeden önce 180 g, sonra 130 g. Ölçü kabına girmeyip ayrı toplanan su 5 cm³. Son su seviyesi 100 cm³.</desc>
<rect width="360" height="770" rx="18" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" font-size="26">
<text x="180" y="38" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">Boncuk ölçümleri</text><rect x="16" y="58" width="328" height="282" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="180" y="94" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">Ölçü kabı</text><text x="32" y="136" font-size="26" fill="#172554" text-anchor="start" font-weight="normal">Boş kap: 25 g</text><text x="32" y="176" font-size="26" fill="#172554" text-anchor="start" font-weight="normal">Kap + boncuk: 135 g</text><path d="M 48 212 V 318 H 154 V 212" fill="#e0f2fe" stroke="#334155" stroke-width="3"/><circle cx="66" cy="298" r="12" fill="#64748b" stroke="#334155" stroke-width="2"/><circle cx="100" cy="298" r="12" fill="#64748b" stroke="#334155" stroke-width="2"/><circle cx="134" cy="298" r="12" fill="#64748b" stroke="#334155" stroke-width="2"/><circle cx="82" cy="271" r="12" fill="#64748b" stroke="#334155" stroke-width="2"/><circle cx="116" cy="271" r="12" fill="#64748b" stroke="#334155" stroke-width="2"/><circle cx="66" cy="244" r="12" fill="#64748b" stroke="#334155" stroke-width="2"/><circle cx="100" cy="244" r="12" fill="#64748b" stroke="#334155" stroke-width="2"/><circle cx="134" cy="244" r="12" fill="#64748b" stroke="#334155" stroke-width="2"/><line x1="42" y1="228" x2="160" y2="228" stroke="#2563eb" stroke-width="3" stroke-dasharray="5 4"/><text x="177" y="247" font-size="26" fill="#172554" text-anchor="start" font-weight="bold">100 cm³</text><text x="177" y="284" font-size="26" fill="#172554" text-anchor="start" font-weight="normal">Kuru yığın</text><text x="177" y="316" font-size="26" fill="#172554" text-anchor="start" font-weight="normal">+ boşluklar</text><rect x="16" y="358" width="328" height="154" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="180" y="396" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">Verici su kabı</text><text x="32" y="440" font-size="26" fill="#172554" text-anchor="start" font-weight="normal">Önce: 180 g</text><text x="32" y="482" font-size="26" fill="#172554" text-anchor="start" font-weight="normal">Sonra: 130 g</text><rect x="16" y="530" width="328" height="112" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="180" y="568" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">Ayrı toplanan su</text><text x="180" y="614" font-size="30" fill="#172554" text-anchor="middle" font-weight="bold">5 cm³</text><rect x="16" y="660" width="328" height="88" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="180" y="696" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">Son su seviyesi</text><text x="180" y="733" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">100 cm³</text>
</g></svg>
