<svg xmlns="http://www.w3.org/2000/svg" width="360" height="630" viewBox="0 0 360 630" role="img">
<title>Çözünmenin ölçüme etkisi</title><desc>İki ayrı deneyin kayıtları: su başlangıçta 40 cm³, örnek eklendikten sonra 50 cm³; katı kısmen çözünüyor. Yağ başlangıçta 40 cm³, örnek eklendikten sonra 52 cm³; katı çözünmüyor. Her örnek 24 g.</desc>
<rect width="360" height="630" rx="18" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" font-size="26">
<text x="180" y="39" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">Hacim ölçümleri</text><rect x="18" y="65" width="324" height="242" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="180" y="103" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">Su</text><text x="43" y="143" font-size="26" fill="#172554" text-anchor="start" font-weight="normal">Önce</text><text x="211" y="143" font-size="26" fill="#172554" text-anchor="start" font-weight="normal">Sonra</text><rect x="45" y="160" width="100" height="62" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="95" y="201" font-size="30" fill="#172554" text-anchor="middle" font-weight="bold">40</text><rect x="213" y="160" width="100" height="62" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="263" y="201" font-size="30" fill="#172554" text-anchor="middle" font-weight="bold">50</text><text x="180" y="255" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">cm³</text><text x="180" y="289" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">Kısmen çözünüyor</text><rect x="18" y="325" width="324" height="242" rx="12" fill="#eff6ff" stroke="#94a3b8" stroke-width="2"/><text x="180" y="363" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">Yağ</text><text x="43" y="403" font-size="26" fill="#172554" text-anchor="start" font-weight="normal">Önce</text><text x="211" y="403" font-size="26" fill="#172554" text-anchor="start" font-weight="normal">Sonra</text><rect x="45" y="420" width="100" height="62" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="95" y="461" font-size="30" fill="#172554" text-anchor="middle" font-weight="bold">40</text><rect x="213" y="420" width="100" height="62" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="263" y="461" font-size="30" fill="#172554" text-anchor="middle" font-weight="bold">52</text><text x="180" y="515" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">cm³</text><text x="180" y="549" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">Çözünmüyor</text><text x="180" y="610" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">Her örnek: 24 g</text>
</g></svg>
