<svg xmlns="http://www.w3.org/2000/svg" width="360" height="450" viewBox="0 0 360 450" role="img">
<title>Sıvının soğuma kaydı</title><desc>Aynı ince borulu kapta 60 °C’de sıvı seviyesi yüksek, 20 °C’ye soğutulduğunda daha alçaktır. İki kaptaki boyutlar aynıdır; seviyeler kesikli çizgilerle belirtilmiştir.</desc>
<rect width="360" height="450" rx="18" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" font-size="26">
<text x="180" y="40" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">Soğutma deneyi</text><text x="90" y="89" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">60 °C</text><path d="M 76 115 V 270 H 38 V 365 H 142 V 270 H 104 V 115 Z" fill="#e0f2fe" stroke="#334155" stroke-width="3"/><path d="M 80 135 V 274 H 42 V 361 H 138 V 274 H 100 V 135 Z" fill="#38bdf8"/><line x1="42" y1="135" x2="138" y2="135" stroke="#0284c7" stroke-width="3" stroke-dasharray="6 5"/><text x="270" y="89" font-size="28" fill="#172554" text-anchor="middle" font-weight="bold">20 °C</text><path d="M 256 115 V 270 H 218 V 365 H 322 V 270 H 284 V 115 Z" fill="#e0f2fe" stroke="#334155" stroke-width="3"/><path d="M 260 205 V 274 H 222 V 361 H 318 V 274 H 280 V 205 Z" fill="#38bdf8"/><line x1="222" y1="205" x2="318" y2="205" stroke="#0284c7" stroke-width="3" stroke-dasharray="6 5"/><text x="180" y="412" font-size="26" fill="#172554" text-anchor="middle" font-weight="normal">Aynı sıvı, aynı kap</text>
</g></svg>
