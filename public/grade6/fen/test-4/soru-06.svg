<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img"><title>Fen Test 4 · Soru 6</title><desc>Aynı civciv: ilk kayıtta 45 g, ince hav tüyleri; sonraki kayıtta 160 g, kanat tüyleri belirginleşmiş. Ölçümler örnek gözlem verisidir.</desc><rect width="360" height="360" fill="white"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Aynı civcivin kayıtları</text><rect x="10" y="55" width="340" height="120" rx="5" fill="#EEF7FC" stroke="#36586D" stroke-width="2"/><text x="180" y="77" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">İlk kayıt</text><text x="180" y="113" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600" fill="#15354B">45 g</text><text x="180" y="149" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">İnce hav tüyleri</text><rect x="10" y="190" width="340" height="120" rx="5" fill="#EEF7FC" stroke="#36586D" stroke-width="2"/><text x="180" y="212" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Sonraki kayıt</text><text x="180" y="248" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600" fill="#15354B">160 g</text><text x="180" y="284" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Kanat tüyleri belirgin</text><text x="180" y="340" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Örnek gözlem verileri</text></svg>