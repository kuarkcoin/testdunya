<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img"><title>Fen Test 4 · Soru 7</title><desc>K kaydı: kuyruk yenileniyor, yeni kertenkele oluşmuyor. L kaydı: planarya parçası bütün bir yeni bireye dönüşüyor. Gözlem kayıtları, deney önerisi değildir.</desc><rect width="360" height="360" fill="white"/><rect x="10" y="20" width="340" height="142" rx="5" fill="#EEF7FC" stroke="#36586D" stroke-width="2"/><text x="180" y="48" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">K: Kertenkele</text><text x="180" y="95" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Kuyruk yenileniyor.</text><text x="180" y="132" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Yeni birey yok.</text><rect x="10" y="177" width="340" height="142" rx="5" fill="#EEF7FC" stroke="#36586D" stroke-width="2"/><text x="180" y="205" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">L: Planarya</text><text x="180" y="252" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Parçadan bütün bir</text><text x="180" y="289" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">yeni birey oluşuyor.</text><text x="180" y="342" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Gözlem kayıtları</text></svg>