<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img"><title>Fen Test 4 · Soru 2</title><desc>İki grupta onar tohum. Aydınlıkta 8, karanlıkta 8 tohum çimlenmiş. Diğer koşullar aynı.</desc><rect width="360" height="350" fill="white"/><text x="180" y="24" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600" fill="#15354B">Çimlenen tohumlar</text><rect x="15" y="55" width="330" height="105" rx="5" fill="#EEF7FC" stroke="#36586D" stroke-width="2"/><text x="180" y="85" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">Aydınlık</text><text x="180" y="128" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600" fill="#15354B">10 tohumdan 8</text><rect x="15" y="180" width="330" height="105" rx="5" fill="#EEF7FC" stroke="#36586D" stroke-width="2"/><text x="180" y="210" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">Karanlık</text><text x="180" y="253" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="600" fill="#15354B">10 tohumdan 8</text><text x="180" y="323" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="600" fill="#15354B">Diğer koşullar aynı</text></svg>