<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img"><title>Fen Test 2 · Soru 3</title><desc>K gözlem kartı: gündüz, Ay Güneş’i örtüyor. L kartı: gece, Ay Dünya’nın gölgesinde. İki kayıt ayrı olaylara aittir.</desc><rect width="360" height="350" fill="white"/><rect x="14" y="20" width="332" height="138" rx="5" fill="#EEF7FC" stroke="#36586D" stroke-width="2"/><text x="180" y="49" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">K: Gündüz</text><text x="180" y="91" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Ay, Güneş’in</text><text x="180" y="127" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">önünü örtüyor.</text><rect x="14" y="183" width="332" height="146" rx="5" fill="#FFF0C9" stroke="#36586D" stroke-width="2"/><text x="180" y="214" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">L: Gece</text><text x="180" y="257" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Ay, Dünya’nın</text><text x="180" y="294" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">gölgesine giriyor.</text></svg>