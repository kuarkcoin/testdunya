<svg xmlns="http://www.w3.org/2000/svg" width="360" height="390" viewBox="0 0 360 390" role="img"><title>Fen Test 2 · Soru 2</title><desc>K: lamba, Ay ve Dünya modelleri aynı yatay doğrultuda. L: lamba ve Dünya aynı yerde, Ay yukarı kaymış. Gölgenin Dünya’ya düşüp düşmediği soruda belirtilmiştir. Şema ölçekli değildir.</desc><rect width="360" height="390" fill="white"/><text x="25" y="50" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">K</text><line x1="42" y1="110" x2="320" y2="110" stroke="#36586D" stroke-width="3" stroke-dasharray="5 6"/><circle cx="45" cy="110" r="25" fill="#FFD56B" stroke="#36586D" stroke-width="2"/><circle cx="295" cy="110" r="25" fill="#8DC4E9" stroke="#36586D" stroke-width="2"/><circle cx="170" cy="110" r="13" fill="#CBD2D6" stroke="#36586D" stroke-width="2"/><text x="45" y="157" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Lamba</text><text x="170" y="78" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Ay</text><text x="295" y="157" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Dünya</text><text x="25" y="215" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">L</text><line x1="42" y1="275" x2="320" y2="275" stroke="#36586D" stroke-width="3" stroke-dasharray="5 6"/><circle cx="45" cy="275" r="25" fill="#FFD56B" stroke="#36586D" stroke-width="2"/><circle cx="295" cy="275" r="25" fill="#8DC4E9" stroke="#36586D" stroke-width="2"/><circle cx="170" cy="220" r="13" fill="#CBD2D6" stroke="#36586D" stroke-width="2"/><text x="45" y="322" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Lamba</text><text x="170" y="188" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Ay</text><text x="295" y="322" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Dünya</text><text x="180" y="369" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Şema ölçekli değildir.</text></svg>