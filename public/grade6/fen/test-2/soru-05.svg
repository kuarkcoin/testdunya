<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img"><title>Fen Test 2 · Soru 5</title><desc>Yatay kuvvetler: cisme batıya 10 N, doğuya 7 N ve doğuya 5 N uygulanıyor. Oklar ayrı satırlarda aynı doğrultuyu temsil ediyor.</desc><rect width="360" height="350" fill="white"/><text x="45" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Batı</text><text x="305" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Doğu</text><rect x="152" y="69" width="46" height="220" rx="5" fill="#DCEEF6" stroke="#36586D" stroke-width="2"/><text x="175" y="314" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Aynı yatay doğrultu</text><line x1="175" y1="110" x2="75" y2="110" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="75,110 85,103 85,117" fill="#36586D"/><text x="125.0" y="85" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">10 N</text><line x1="175" y1="185" x2="245" y2="185" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="245,185 235,178 235,192" fill="#36586D"/><text x="210.0" y="160" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">7 N</text><line x1="175" y1="260" x2="225" y2="260" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="225,260 215,253 215,267" fill="#36586D"/><text x="200.0" y="235" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">5 N</text></svg>