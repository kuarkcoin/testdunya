<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480" role="img"><title>Fen Test 2 · Soru 1</title><desc>Aynı tutulmanın üç anı: Dünya’nın tam gölgesinin dairesel kesiti ve Ay. K’de Ay sol sınırı kesiyor, L’de tamamen içeride, M’de sağ sınırı kesiyor. Her satır ayrı bir andır.</desc><rect width="360" height="480" fill="white"/><text x="180" y="24" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Dünya’nın tam gölgesi</text><text x="25" y="105" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">K</text><circle cx="180" cy="105" r="55" fill="#B2BDCD" stroke="#36586D" stroke-width="2"/><circle cx="120" cy="105" r="22" fill="#FFEAB2" stroke="#36586D" stroke-width="2"/><text x="25" y="228" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">L</text><circle cx="180" cy="228" r="55" fill="#B2BDCD" stroke="#36586D" stroke-width="2"/><circle cx="180" cy="228" r="22" fill="#FFEAB2" stroke="#36586D" stroke-width="2"/><text x="25" y="351" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">M</text><circle cx="180" cy="351" r="55" fill="#B2BDCD" stroke="#36586D" stroke-width="2"/><circle cx="240" cy="351" r="22" fill="#FFEAB2" stroke="#36586D" stroke-width="2"/><text x="180" y="436" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Üç ayrı an</text><text x="180" y="467" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Ölçekli değildir.</text></svg>