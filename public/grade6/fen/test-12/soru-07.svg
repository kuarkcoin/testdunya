<text x="180" y="29" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Başlangıç devresi</text>
<rect x="16" y="56" width="328" height="469" rx="12" fill="#F5FAFD" stroke="#C7DDE9" stroke-width="2"/>
<text x="180" y="81" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">A ve B bağlı</text>
<line x1="130" y1="121" x2="230" y2="121" stroke="#647D8D" stroke-width="3" stroke-linecap="round"/>
