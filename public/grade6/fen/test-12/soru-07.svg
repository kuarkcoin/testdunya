<polygon points="180,254 172,236 188,236" fill="#647D8D"/>
<text x="213" y="169" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">S</text>
