<svg xmlns="http://www.w3.org/2000/svg" width="360" height="540" viewBox="0 0 360 540" role="img">
<title>Fen Test 12 · Başlangıçtaki reosta bağlantısı</title>
<desc>Bir pil, bir ampul ve bir reostadan oluşan kapalı devre gösteriliyor. Reosta telinin sol sabit ucu A, sağ sabit ucu B olarak etiketli. A ve B&#x27;nin her biri devrenin bağlantı kablolarından birine bağlı. Telin orta bölümüne temas eden S sürgüsü üstte gösterilmiş; S&#x27;den dış devreye uzanan bir bağlantı kablosu yok. S&#x27;nin A ile B arasında hareket edebileceği çift yönlü okla belirtilmiş. Ampulün parlaklığını gösteren bir karşılaştırma bulunmuyor.</desc>
