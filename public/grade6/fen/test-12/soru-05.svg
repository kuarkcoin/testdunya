<svg xmlns="http://www.w3.org/2000/svg" width="360" height="590" viewBox="0 0 360 590" role="img">
<title>Fen Test 12 · Açık ve kapalı kapların tartımı</title>
<desc>Başlangıç ve sonra sütunlarından oluşan iki satırlı tartım kaydı. K satırında her iki anda açık su kabı vardır; kap ve içindekilerin toplam kütlesi başlangıçta 100 g, sonra 96 g&#x27;dır. L satırında her iki anda kapaklı su kabı vardır; kap, kapak ve tüm içindekilerin toplam kütlesi başlangıçta 120 g, sonra yine 120 g&#x27;dır. L&#x27;nin başlangıç kapağı kuru, sonraki kapağının iç yüzü damlalıdır. Kapağın daha serin olduğu kısa bir etiketle belirtilmiştir. Tüm okumalar g birimindedir.</desc>
