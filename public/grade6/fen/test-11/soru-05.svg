<svg xmlns="http://www.w3.org/2000/svg" width="360" height="540" viewBox="0 0 360 540" role="img">
<title>Fen Test 11 · Saf X maddesinin başlangıç hâlleri</title>
<desc>Saf X maddesinin özellik kartında erime sıcaklığı 40°C, kaynama sıcaklığı 90°C yazılıdır. Başlangıç durumunda yan yana K ve L kapları gösterilir. K&#x27;de katı parçalar ve sıvı birlikte, L&#x27;de yalnız sıvı vardır. Her kabın termometresi 40°C&#x27;yi gösterir. K&#x27;nin altında katı + sıvı, L&#x27;nin altında sıvı yazılıdır. Sonraki ısıtma durumları çizilmemiştir.</desc>
