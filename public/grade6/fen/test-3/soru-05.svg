<svg xmlns="http://www.w3.org/2000/svg" width="360" height="380" viewBox="0 0 360 380" role="img"><title>Fen Test 3 · Soru 5</title><desc>A solda B sağda. K düz rota, L daha uzun kıvrımlı rota. Aynı başlangıç ve bitiş zamanı.</desc><rect width="360" height="380" fill="white"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Aynı süre • Aynı uçlar</text><circle cx="40" cy="205" r="9" fill="#8DC4E9" stroke="#36586D" stroke-width="2"/><circle cx="320" cy="205" r="9" fill="#8DC4E9" stroke="#36586D" stroke-width="2"/><line x1="50" y1="205" x2="310" y2="205" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><text x="180" y="229" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">K: Düz yol</text><path d="M40,205 C75,30 130,55 180,105 S270,40 320,205" fill="none" stroke="#B16A16" stroke-width="5"/><text x="180" y="58" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">L: Uzun yol</text><text x="35" y="250" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">A</text><text x="325" y="250" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">B</text><text x="180" y="310" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Birlikte çıkıyorlar.</text><text x="180" y="344" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Birlikte varıyorlar.</text></svg>