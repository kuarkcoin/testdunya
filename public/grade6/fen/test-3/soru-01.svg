<svg xmlns="http://www.w3.org/2000/svg" width="360" height="380" viewBox="0 0 360 380" role="img"><title>Fen Test 3 · Soru 1</title><desc>Araba doğuya hareket ediyor. Batıya 12 N ve doğuya 12 N kuvvet uygulanıyor. Doğu kuvvetine sonradan 6 N eklenecek.</desc><rect width="360" height="380" fill="white"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Hareket: Doğu →</text><text x="42" y="75" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Batı</text><text x="307" y="75" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Doğu</text><rect x="158" y="105" width="44" height="140" rx="5" fill="#DDEFF8" stroke="#36586D" stroke-width="2"/><line x1="180" y1="140" x2="72" y2="140" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="72,140 82,133 82,147" fill="#36586D"/><text x="126.0" y="115" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">12 N</text><line x1="180" y1="215" x2="288" y2="215" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="288,215 278,208 278,222" fill="#36586D"/><text x="234.0" y="190" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">12 N</text><rect x="20" y="280" width="320" height="70" rx="5" fill="#FFF0C9" stroke="#36586D" stroke-width="2"/><text x="180" y="303" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Doğu kuvvetine</text><text x="180" y="334" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-