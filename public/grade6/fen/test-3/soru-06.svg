<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img"><title>Fen Test 3 · Soru 6</title><desc>Dairesel pistte saat yönünde hareket. Üst K noktasında sağa, sağ L noktasında aşağıya teğet yön okları; sürat sabit.</desc><rect width="360" height="360" fill="white"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">Sürat sabit</text><circle cx="180" cy="185" r="95" fill="#EEF7FC" stroke="#36586D" stroke-width="2"/><circle cx="180" cy="90" r="6" fill="#8DC4E9" stroke="#36586D" stroke-width="2"/><circle cx="275" cy="185" r="6" fill="#8DC4E9" stroke="#36586D" stroke-width="2"/><line x1="180" y1="90" x2="255" y2="90" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="255,90 244,83 244,97" fill="#36586D"/><line x1="275" y1="185" x2="275" y2="260" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="275,260 268,249 282,249" fill="#36586D"/><text x="160" y="66" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">K</text><text x="307" y="184" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">L</text><text x="180" y="323" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Oklar hareket yönüdür.</text></svg>