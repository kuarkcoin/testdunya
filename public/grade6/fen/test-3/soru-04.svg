<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img"><title>Fen Test 3 · Soru 4</title><desc>A, B, C noktalarını birleştiren üçgen rota. Oklar A’dan B’ye, B’den C’ye, C’den A’ya. Başlangıç ve bitiş A.</desc><rect width="360" height="360" fill="white"/><line x1="65" y1="245" x2="285" y2="245" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="285,245 267.0,253.0 267.0,237.0" fill="#36586D"/><line x1="285" y1="245" x2="180" y2="75" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="180,75 196.26525583186884,86.11042090669193 182.65248787412014,94.5183069982426" fill="#36586D"/><line x1="180" y1="75" x2="65" y2="245" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="65,245 68.45930131365208,225.608423622063 81.71183592369948,234.57337350533035" fill="#36586D"/><text x="50" y="270" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">A</text><text x="302" y="270" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">B</text><text x="180" y="50" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">C</text><text x="180" y="310" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">A → B → C → A</text><text x="180" y="343" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Başlangıç = bitiş</text></svg>