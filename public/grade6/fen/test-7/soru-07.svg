<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400" role="img"><title>Fen Test 7 · Soru 7</title><desc>Beyaz kart üzerinde kırmızı üçgen. Ayrı iki aydınlatma: yalnız kırmızı ışık ve yalnız mavi ışık. Kartın beyaz ışık altındaki renkleri gösteriliyor.</desc><rect width="360" height="400" fill="white"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Beyaz kart, kırmızı şekil</text><rect x="80" y="70" width="200" height="110" rx="5" fill="white" stroke="#36586D" stroke-width="2"/><polygon points="180,90 130,155 230,155" fill="#DB2D35" stroke="#36586D" stroke-width="2"/><text x="180" y="212" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Ayrı ayrı aydınlatılıyor:</text><circle cx="90" cy="260" r="22" fill="#DB2D35" stroke="#36586D" stroke-width="2"/><line x1="90" y1="285" x2="90" y2="315" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="90,315 95.0,305.0 85.0,305.0" fill="#36586D"/><text x="90" y="342" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Kırmızı</text><circle cx="270" cy="260" r="22" fill="#3386C4" stroke="#36586D" stroke-width="2"/><line x1="270" y1="285" x2="270" y2="315" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="270,315 275.0,305.0 265.0,305.0" fill="#36586D"/><text x="270" y="342" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Mavi</text><text x="180" y="367" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Yalnız belirtilen ışık</text></svg>