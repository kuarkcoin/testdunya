<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img"><title>Fen Test 7 · Soru 5</title><desc>Beyaz ışık opak yüzeye geliyor; yüzeyden göze yeşil ışık oku gidiyor. Alt yazıda diğer renklerin soğurulduğu belirtiliyor.</desc><rect width="360" height="360" fill="white"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Gelen ve yansıyan ışık</text><line x1="20" y1="100" x2="150" y2="190" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="150,190 144.62412797771375,180.196939253478 138.93202818941066,188.4188611699158" fill="#36586D"/><text x="80" y="75" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Beyaz ışık</text><rect x="115" y="190" width="130" height="45" rx="5" fill="#4E9D65" stroke="#36586D" stroke-width="2"/><text x="180" y="260" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Opak yüzey</text><line x1="215" y1="190" x2="310" y2="110" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="310,110 299.13020928991557,112.61680146724254 305.5715667477434,120.26591344841304" fill="#36586D"/><text x="280" y="150" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Yeşil</text><circle cx="315" cy="90" r="14" fill="#DDEFF9" stroke="#36586D" stroke-width="2"/><text x="180" y="310" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Diğer renkler soğurulur.</text></svg>