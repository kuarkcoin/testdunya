<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400" role="img"><title>Fen Test 7 · Soru 1</title><desc>Aynı ışık altındaki siyah ve beyaz kutular. İkisi önce 20°C; sonra siyah 34°C, beyaz 25°C.</desc><rect width="360" height="400" fill="white"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Aynı ışık • Aynı süre</text><circle cx="90" cy="75" r="18" fill="#FFE184" stroke="#36586D" stroke-width="2"/><line x1="90" y1="98" x2="90" y2="140" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="90,140 95.0,130.0 85.0,130.0" fill="#36586D"/><rect x="35" y="155" width="110" height="95" rx="5" fill="#30343B" stroke="#36586D" stroke-width="2"/><text x="90" y="280" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Siyah</text><text x="90" y="320" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">20°C →</text><text x="90" y="357" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">34°C</text><circle cx="270" cy="75" r="18" fill="#FFE184" stroke="#36586D" stroke-width="2"/><line x1="270" y1="98" x2="270" y2="140" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="270,140 275.0,130.0 265.0,130.0" fill="#36586D"/><rect x="215" y="155" width="110" height="95" rx="5" fill="#FFFFFF" stroke="#36586D" stroke-width="2"/><text x="270" y="280" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Beyaz</text><text x="270" y="320" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">20°C →</text><text x="270" y="357" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">25°C</text></svg>