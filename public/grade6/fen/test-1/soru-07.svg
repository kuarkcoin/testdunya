<svg xmlns="http://www.w3.org/2000/svg" width="360" height="370" viewBox="0 0 360 370" role="img"><title>Fen Test 1 · Soru 7</title><desc>Güneş solda, Dünya ortada; sağda Dünya’nın gölge bölgesi kesik sınırlarla gösterilmiş. Ay, sağ tarafta fakat gölge bölgesinin üstünde. Şema ölçekli değildir.</desc><rect width="360" height="370" fill="white"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Dolunay konumu</text><polygon points="166,180 166,228 345,265 345,145" fill="#E0E5EB" stroke="#708192" stroke-width="2" stroke-dasharray="5 5"/><polygon points="166,180 166,228 345,216 345,192" fill="#9BAABD"/><line x1="45" y1="204" x2="345" y2="204" stroke="#36586D" stroke-width="3" stroke-dasharray="5 5"/><circle cx="40" cy="204" r="28" fill="#FFD56B" stroke="#36586D" stroke-width="2"/><circle cx="162" cy="204" r="25" fill="#8DC4E9" stroke="#36586D" stroke-width="2"/><circle cx="295" cy="92" r="13" fill="#CBD2D6" stroke="#36586D" stroke-width="2"/><text x="295" y="58" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Ay</text><text x="43" y="265" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Güneş</text><text x="157" y="265" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Dünya</text><text x="240" y="300" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Gölge bölgesi</text><text x="180" y="344" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Şema ölçekli değildir.</text></svg>