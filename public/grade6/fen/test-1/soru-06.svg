<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400" role="img"><title>Fen Test 1 · Soru 6</title><desc>Dünya’nın gündüz yüzünün şematik görünümü. Ortada tam gölge ve çevresinde yarı gölge bölgesi; P tam gölgenin içinde, R her iki bölgenin dışında. Ölçekli değildir.</desc><rect width="360" height="400" fill="white"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Dünya’nın gündüz yüzü</text><circle cx="180" cy="184" r="123" fill="#DFF3F8" stroke="#36586D" stroke-width="2"/><circle cx="165" cy="177" r="65" fill="#B9C2CD" stroke="#36586D" stroke-width="2"/><circle cx="165" cy="177" r="26" fill="#3E5268" stroke="#36586D" stroke-width="2"/><circle cx="165" cy="177" r="4" fill="white" stroke="#36586D" stroke-width="2"/><text x="165" y="178" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="white">P</text><circle cx="257" cy="164" r="4" fill="#15354B" stroke="#36586D" stroke-width="2"/><text x="270" y="143" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">R</text><line x1="145" y1="205" x2="85" y2="285" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><text x="82" y="315" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Tam gölge</text><line x1="192" y1="227" x2="255" y2="285" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><text x="260" y="345" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Yarı gölge</text><text x="180" y="381" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Şema ölçekli değildir.</text></svg>