<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img"><title>Fen Test 1 · Soru 4</title><desc>Güneş’e uzaklık aşağı doğru artıyor. P gezegeninin bölgesi, ana asteroit kuşağı ve R gezegeninin bölgesi sıralanmış. Şema ölçekli değildir.</desc><rect width="360" height="360" fill="white"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Güneş’e uzaklık</text><line x1="323" y1="65" x2="323" y2="276" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="318,267 328,267 323,276" fill="#36586D"/><rect x="24" y="60" width="272" height="58" rx="5" fill="#EEF7FC" stroke="#36586D" stroke-width="2"/><text x="160" y="89" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">P</text><rect x="24" y="137" width="272" height="82" rx="5" fill="#FFF0C9" stroke="#36586D" stroke-width="2"/><text x="160" y="160" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Ana asteroit</text><text x="160" y="195" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">kuşağı</text><rect x="24" y="238" width="272" height="58" rx="5" fill="#EEF7FC" stroke="#36586D" stroke-width="2"/><text x="160" y="267" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">R</text><text x="180" y="335" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Şema ölçekli değildir.</text></svg>