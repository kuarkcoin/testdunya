<svg xmlns="http://www.w3.org/2000/svg" width="360" height="450" viewBox="0 0 360 450" role="img"><title>Fen Test 8 · Soru 1</title><desc>Üç aşama: başlangıçta küçük küre halkadan geçer; ısıtılan küre büyür ve geçmez; soğutulan küre yeniden geçer. Boyut değişimi abartılmıştır.</desc><rect width="360" height="450" fill="white"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Küre ve halka</text><text x="90" y="80" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">İlk durum</text><circle cx="225" cy="85" r="23" fill="#FFD67E" stroke="#36586D" stroke-width="2"/><ellipse cx="225" cy="127" rx="27" ry="10" fill="none" stroke="#36586D" stroke-width="4"/><line x1="225" y1="100" x2="225" y2="125" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="225,125 230.0,115.0 220.0,115.0" fill="#36586D"/><text x="90" y="120" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Geçer</text><text x="90" y="185" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Isıtılınca</text><circle cx="225" cy="190" r="31" fill="#FFD67E" stroke="#36586D" stroke-width="2"/><ellipse cx="225" cy="232" rx="27" ry="10" fill="none" stroke="#36586D" stroke-width="4"/><line x1="225" y1="205" x2="225" y2="230" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="225,230 230.0,220.0 220.0,220.0" fill="#36586D"/><text x="90" y="225" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Geçmez</text><text x="90" y="290" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif"