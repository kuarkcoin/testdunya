<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img"><title>Fen Test 8 · Soru 2</title><desc>İki metal rayın uçları arasında boşluk; soğuk ve daha sıcak durumlar karşılaştırılmış. Sıcak durumda boşluk daha dar; şema ölçekli değildir.</desc><rect width="360" height="350" fill="white"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Ray uçları</text><text x="180" y="55" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Daha soğuk</text><rect x="20" y="100" width="135.0" height="30" rx="5" fill="#A7C5D9" stroke="#36586D" stroke-width="2"/><rect x="205.0" y="100" width="135.0" height="30" rx="5" fill="#A7C5D9" stroke="#36586D" stroke-width="2"/><line x1="155.0" y1="148" x2="205.0" y2="148" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><text x="180" y="165" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Boşluk</text><text x="180" y="215" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Daha sıcak</text><rect x="20" y="260" width="151.0" height="30" rx="5" fill="#A7C5D9" stroke="#36586D" stroke-width="2"/><rect x="189.0" y="260" width="151.0" height="30" rx="5" fill="#A7C5D9" stroke="#36586D" stroke-width="2"/><line x1="171.0" y1="308" x2="189.0" y2="308" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><text x="180" y="325" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Boşluk</text></svg>