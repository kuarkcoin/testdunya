<svg xmlns="http://www.w3.org/2000/svg" width="360" height="380" viewBox="0 0 360 380" role="img"><title>Fen Test 8 · Soru 3</title><desc>K ve L başlangıçta 1000 mm. Eşit sıcaklık artışından sonra K 1003 mm, L 1001 mm. Uzama farkı şemada büyütülmüş.</desc><rect width="360" height="380" fill="white"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Eşit sıcaklık artışı</text><text x="30" y="100" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">K</text><rect x="60" y="85" width="240" height="24" rx="5" fill="#F5CD79" stroke="#36586D" stroke-width="2"/><text x="180" y="140" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">İlk: 1000 mm</text><text x="180" y="178" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Son: 1003 mm</text><text x="30" y="235" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">L</text><rect x="60" y="220" width="240" height="24" rx="5" fill="#A7D3E8" stroke="#36586D" stroke-width="2"/><text x="180" y="275" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">İlk: 1000 mm</text><text x="180" y="313" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Son: 1001 mm</text><text x="180" y="365" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Çizim ölçekli değildir.</text></svg>