<svg xmlns="http://www.w3.org/2000/svg" width="360" height="370" viewBox="0 0 360 370" role="img"><title>Fen Test 6 · Soru 6</title><desc>İki gözlem: K’de yukarı yönlü cisim oku ve daha büyük yukarı görüntü; L’de yukarı cisim oku ve aşağı yönlü görüntü. Çukur ayna aynı, konum farklı.</desc><rect width="360" height="370" fill="white"/><text x="180" y="25" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="600" fill="#15354B">Aynı çukur ayna</text><text x="96" y="65" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Cisim</text><text x="264" y="65" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" fill="#15354B">Görüntü</text><text x="25" y="154" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">K</text><line x1="95" y1="205" x2="95" y2="145" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="95,145 90.0,155.0 100.0,155.0" fill="#36586D"/><line x1="260" y1="205" x2="260" y2="105" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="260,105 255.0,115.0 265.0,115.0" fill="#36586D"/><text x="25" y="279" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#15354B">L</text><line x1="95" y1="325" x2="95" y2="265" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="95,265 90.0,275.0 100.0,275.0" fill="#36586D"/><line x1="260" y1="260" x2="260" y2="320" stroke="#36586D" stroke-width="3" stroke-dasharray=""/><polygon points="260,320 265.0,310.0 255.0,310.0" fill="#36586D"/><text x="180" y="354" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600"