name: Public site SEO crawl

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-live-seo.cjs'
      - '.github/workflows/seo-live-audit.yml'

permissions:
  contents: read

concurrency:
  group: seo-live-audit
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Crawl public sitemap and HTML without authentication
        run: node scripts/audit-live-seo.cjs --base=https://testdunya.net --max-pages=650 --output=artifacts/seo-live-audit.json
      - name: Save crawl evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-live-audit
          path: artifacts/seo-live-audit.json
          if-no-files-found: warn
          retention-days: 14
