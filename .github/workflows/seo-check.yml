name: SEO and production build

on:
  push:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/data/**'
      - 'scripts/**'
      - '*config*'
      - 'package*.json'
      - '.github/workflows/seo-check.yml'

permissions:
  contents: read

concurrency:
  group: seo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate source, build and rendered SEO
        run: npm run build
