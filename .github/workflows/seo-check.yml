name: SEO and production build

on:
  push:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/data/**'
      - 'scripts/**'
      - '*config*'
      - 'package*.json'
      - '.github/workflows/seo-check.yml'

permissions:
  contents: read

concurrency:
  group: seo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate source, build and rendered SEO
        run: npm run build
      - name: Install browser verification tools
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify reading activities in the browser
        run: npm run check:reading:browser
      - name: Save reading screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-screenshots
          path: artifacts/reading-*.png
          if-no-files-found: ignore
          retention-days: 7
